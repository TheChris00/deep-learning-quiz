<!doctype html>

<head>
<meta charset="utf-8">

<body>
<title>Simulatore Deep Learning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow working column like an exam sheet; setup on the left, progress on the right; the answer-bubble grid is the recurring motif. */
:root {
  --bg: #f1f4f9; --surface: #ffffff; --ink: #151a2d; --muted: #586179; --line: #d3d9e6;
  --accent: #2743c4; --accent-soft: #e3e8fb; --on-accent: #ffffff;
  --good: #17794a; --good-soft: #dcf2e6; --bad: #b3261e; --bad-soft: #fbe2e0;
  --font-display: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131c; --surface: #191e2b; --ink: #e7eaf4; --muted: #9aa3ba; --line: #2d3446;
  --accent: #93a5ff; --accent-soft: #222a4c; --on-accent: #0d1230;
  --good: #5fd39a; --good-soft: #143225; --bad: #ff8d83; --bad-soft: #3a1b1a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10131c; --surface: #191e2b; --ink: #e7eaf4; --muted: #9aa3ba; --line: #2d3446;
  --accent: #93a5ff; --accent-soft: #222a4c; --on-accent: #0d1230;
  --good: #5fd39a; --good-soft: #143225; --bad: #ff8d83; --bad-soft: #3a1b1a; color-scheme: dark }

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1.05rem; font-weight: 600; }
code { font-family: var(--font-mono); font-size: 0.88em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top .sub { color: var(--muted); font-size: 0.9rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 13px; border-radius: 999px; font-size: 0.85rem; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.home { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .home { grid-template-columns: minmax(0, 1fr); } }

.modes { display: flex; flex-direction: column; gap: 8px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 11px 14px; display: flex; flex-direction: column; gap: 2px; }
.mode strong { font-family: var(--font-display); font-weight: 600; }
.mode span { font-size: 0.86rem; color: var(--muted); }
.mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 0.84rem; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.92rem; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 16px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.link { border: 0; background: none; padding: 0; color: var(--muted); font-size: 0.85rem; text-decoration: underline; }

.chrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; font-size: 0.9rem; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); display: flex; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .ok { background: var(--good); } .bar .ko { background: var(--bad); }
.chlist { display: flex; flex-direction: column; gap: 11px; }
.hist { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
.hist div { display: flex; justify-content: space-between; gap: 10px; }
.legend { display: flex; gap: 14px; font-size: 0.78rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer { font-family: var(--font-mono); font-size: 0.95rem; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; }
.timer.low { color: var(--bad); border-color: var(--bad); }
.qtext { font-size: 1.13rem; font-weight: 500; max-width: 68ch; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 14px; }
.bubble { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .bubble { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .bubble { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .bubble { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; color: inherit; opacity: 1; }
.explain { border-radius: var(--r); padding: 12px 14px; font-size: 0.95rem; max-width: 72ch; }
.explain.ok { background: var(--good-soft); } .explain.ko { background: var(--bad-soft); }
.explain b { font-family: var(--font-display); }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 6px; }
.sheet button { height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 0.78rem; font-variant-numeric: tabular-nums; padding: 0; }
.sheet button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sheet button.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.sheet button.ko { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.sheet button.cur { box-shadow: 0 0 0 2px var(--ink); }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.score { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; }
.score .big { font-family: var(--font-display); font-size: 3rem; font-weight: 700; line-height: 1; }
.score .big small { font-size: 1.3rem; color: var(--muted); font-weight: 500; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.4rem; }
.review { display: flex; flex-direction: column; gap: 14px; }
.ritem { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.ritem .q { font-weight: 500; max-width: 72ch; }
.ritem .a { font-size: 0.93rem; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.tag.ok { background: var(--good-soft); color: var(--good); } .tag.ko { background: var(--bad-soft); color: var(--bad); }
@media (prefers-reduced-motion: no-preference) { .opt, .chip, .mode { transition: background-color .12s, border-color .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Simulatore Deep Learning</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="seg" role="group" aria-label="Lingua / Language">
      <button id="lang-it" type="button">Italiano</button>
      <button id="lang-en" type="button">English</button>
    </div>
  </header>

  <main id="view-home" class="home"></main>
  <main id="view-quiz" class="panel" hidden></main>
  <main id="view-results" hidden></main>
</div>

<script>
const D = {"chapters": [{"it": "Basi di ML", "en": "ML basics"}, {"it": "Classificatore lineare", "en": "Linear classifier"}, {"it": "Reti neurali e attivazioni", "en": "Neural networks and activations"}, {"it": "Loss", "en": "Losses"}, {"it": "Backpropagation", "en": "Backpropagation"}, {"it": "Ottimizzazione", "en": "Optimization"}, {"it": "Training", "en": "Training"}, {"it": "Inizializzazione", "en": "Initialization"}, {"it": "Regolarizzazione", "en": "Regularization"}, {"it": "Batch norm e prestazioni", "en": "Batch norm and performance"}], "questions": [{"id": 1, "ch": 1, "a": "C", "it": {"q": "Quale di questi è un iperparametro?", "o": ["I pesi W", "I bias b", "Il learning rate", "Gli score di output"], "e": "lo imposti tu; pesi e bias sono parameters."}, "en": {"q": "Which of these is a hyperparameter?", "o": ["The weights W", "The biases b", "The learning rate", "The output scores"], "e": "you set it; weights and biases are parameters."}}, {"id": 2, "ch": 1, "a": "B", "it": {"q": "L'image segmentation, secondo le slide, è un problema di:", "o": ["Univariate regression", "Multivariate binary classification", "Multiclass classification univariata", "Unsupervised clustering"], "e": "un output per pixel (multivariate), due classi."}, "en": {"q": "According to the slides, image segmentation is a problem of:", "o": ["Univariate regression", "Multivariate binary classification", "Univariate multiclass classification", "Unsupervised clustering"], "e": "one output per pixel (multivariate), two classes."}}, {"id": 3, "ch": 1, "a": "A", "it": {"q": "La depth estimation è un problema di:", "o": ["Multivariate regression", "Binary classification", "Univariate regression", "Multiclass classification"], "e": "tanti output continui."}, "en": {"q": "Depth estimation is a problem of:", "o": ["Multivariate regression", "Binary classification", "Univariate regression", "Multiclass classification"], "e": "many continuous outputs."}}, {"id": 4, "ch": 1, "a": "D", "it": {"q": "Quale abbinamento esempio–rete è quello delle slide?", "o": ["Text classification – RNN", "Music genre classification – Transformer", "Graph regression – Convolutional network", "Image classification – Convolutional network"], "e": "text → Transformer, musica → RNN, grafi → GNN."}, "en": {"q": "Which example–network pairing is the one in the slides?", "o": ["Text classification – RNN", "Music genre classification – Transformer", "Graph regression – Convolutional network", "Image classification – Convolutional network"], "e": "text → Transformer, music → RNN, graphs → GNN."}}, {"id": 5, "ch": 1, "a": "B", "it": {"q": "L'unsupervised learning è usato tipicamente per:", "o": ["Classificazione binaria", "Clustering, noise reduction, dimension reduction", "Regressione multivariata", "Massimizzare un reward"], "e": "Senza label non si può fare classificazione né regressione; il reward appartiene al reinforcement learning."}, "en": {"q": "Unsupervised learning is typically used for:", "o": ["Binary classification", "Clustering, noise reduction, dimension reduction", "Multivariate regression", "Maximizing a reward"], "e": "Without labels you cannot do classification or regression; rewards belong to reinforcement learning."}}, {"id": 6, "ch": 1, "a": "C", "it": {"q": "Nel reinforcement learning:", "o": ["Si riceve un dataset etichettato", "Si riceve un dataset non etichettato", "Non si riceve un dataset: si esplora l'ambiente per raccogliere dati", "Non esistono reward"], "e": "Nessun dataset: l'agente esplora l'ambiente e raccoglie i dati mentre agisce."}, "en": {"q": "In reinforcement learning:", "o": ["You receive a labeled dataset", "You receive an unlabeled dataset", "You receive no dataset: you explore the environment to gather data", "There are no rewards"], "e": "No dataset: the agent explores the environment and gathers data as it goes."}}, {"id": 7, "ch": 1, "a": "B", "it": {"q": "Il \"temporal credit assignment problem\" riguarda:", "o": ["La scelta del batch size", "Capire quale azione passata ha causato il reward", "Il bilanciamento tra training e test set", "La scelta tra esplorare e sfruttare"], "e": "D descrive invece l'exploration-exploitation trade-off."}, "en": {"q": "The \"temporal credit assignment problem\" is about:", "o": ["Choosing the batch size", "Understanding which past action caused the reward", "Balancing training and test sets", "Choosing between exploring and exploiting"], "e": "D describes the exploration-exploitation trade-off instead."}}, {"id": 8, "ch": 1, "a": "C", "it": {"q": "Nel k-NN per la regressione l'output è:", "o": ["La classe più frequente tra i k vicini", "La mediana delle distanze", "La media dei valori dei k vicini", "Il valore del vicino più lontano"], "e": "A vale per la classificazione."}, "en": {"q": "In k-NN regression the output is:", "o": ["The most common class among the k neighbors", "The median of the distances", "The average of the values of the k neighbors", "The value of the farthest neighbor"], "e": "A holds for classification."}}, {"id": 9, "ch": 1, "a": "A", "it": {"q": "Il classificatore 1-NN valutato sui dati di training:", "o": ["Ha accuratezza perfetta", "Ha accuratezza casuale", "È sempre peggiore del 5-NN", "Non si può valutare"], "e": "ogni punto è il vicino più prossimo di sé stesso."}, "en": {"q": "The 1-NN classifier evaluated on the training data:", "o": ["Has perfect accuracy", "Has random accuracy", "Is always worse than 5-NN", "Cannot be evaluated"], "e": "each point is its own nearest neighbor."}}, {"id": 10, "ch": 1, "a": "B", "it": {"q": "Il k-NN è un metodo:", "o": ["Parametrico, con k appreso", "Non parametrico", "Di reinforcement learning", "Generativo"], "e": "Non impara pesi: memorizza i dati di training. `k` è un iperparametro scelto da te."}, "en": {"q": "k-NN is a method that is:", "o": ["Parametric, with k learned", "Non-parametric", "Reinforcement learning", "Generative"], "e": "It learns no weights: it stores the training data. `k` is a hyperparameter you set."}}, {"id": 11, "ch": 2, "a": "B", "it": {"q": "In CIFAR-10 un'immagine stirata in vettore ha quanti numeri?", "o": ["1024", "3072", "784", "10"], "e": "32·32·3."}, "en": {"q": "In CIFAR-10, an image stretched into a vector has how many numbers?", "o": ["1024", "3072", "784", "10"], "e": "32·32·3."}}, {"id": 12, "ch": 2, "a": "B", "it": {"q": "Per un classificatore lineare su CIFAR-10, W ha dimensione:", "o": ["3072 × 10", "10 × 3072", "32 × 32", "10 × 10"], "e": "10 righe (classi) × 3072 colonne."}, "en": {"q": "For a linear classifier on CIFAR-10, W has size:", "o": ["3072 × 10", "10 × 3072", "32 × 32", "10 × 10"], "e": "10 rows (classes) × 3072 columns."}}, {"id": 13, "ch": 2, "a": "B", "it": {"q": "Il \"bias trick\" consiste nel:", "o": ["Eliminare il bias", "Aggiungere un 1 al vettore dei dati e assorbire b in una colonna di W", "Inizializzare il bias a 0.01", "Sottrarre la media dai dati"], "e": "Con un 1 in più nel vettore dei dati, `b` diventa l'ultima colonna di `W` (nell'esempio `W` passa da 3×4 a 3×5)."}, "en": {"q": "The \"bias trick\" consists of:", "o": ["Removing the bias", "Adding a 1 to the data vector and absorbing b into a column of W", "Initializing the bias to 0.01", "Subtracting the mean from the data"], "e": "With an extra 1 in the data vector, `b` becomes the last column of `W` (in the example `W` goes from 3×4 to 3×5)."}}, {"id": 14, "ch": 2, "a": "A", "it": {"q": "Nel visual viewpoint un classificatore lineare:", "o": ["Impara un template per classe", "Impara più template per classe", "Taglia lo spazio con curve", "Non usa i pesi"], "e": "un solo template per classe: è il suo limite."}, "en": {"q": "In the visual viewpoint, a linear classifier:", "o": ["Learns one template per class", "Learns several templates per class", "Cuts the space with curves", "Does not use weights"], "e": "only one template per class: that is its limitation."}}, {"id": 15, "ch": 2, "a": "B", "it": {"q": "Quale caso NON è separabile da un classificatore lineare?", "o": ["Due nuvole di punti ben distanti", "Classe 1 nel primo e terzo quadrante, classe 2 negli altri", "Punti separati da una retta", "Punti separati da un iperpiano"], "e": "configurazione tipo XOR."}, "en": {"q": "Which case is NOT separable by a linear classifier?", "o": ["Two well-separated clouds of points", "Class 1 in the first and third quadrants, class 2 in the others", "Points separated by a line", "Points separated by a hyperplane"], "e": "XOR-like configuration."}}, {"id": 16, "ch": 2, "a": "C", "it": {"q": "Se `f(x,W)=Wx` e moltiplico l'immagine per 0.5, gli score:", "o": ["Restano uguali", "Raddoppiano", "Si dimezzano", "Diventano zero"], "e": "f(cx) = c·f(x)."}, "en": {"q": "If `f(x,W)=Wx` and I multiply the image by 0.5, the scores:", "o": ["Stay the same", "Double", "Halve", "Become zero"], "e": "f(cx) = c·f(x)."}}, {"id": 17, "ch": 2, "a": "B", "it": {"q": "Una loss function alta indica:", "o": ["Un buon classificatore", "Un cattivo classificatore", "Un learning rate basso", "Overfitting"], "e": "Loss bassa = buon classificatore, loss alta = cattivo. Da sola non dice nulla sull'overfitting."}, "en": {"q": "A high loss indicates:", "o": ["A good classifier", "A bad classifier", "A low learning rate", "Overfitting"], "e": "Low loss = good classifier, high loss = bad. On its own it says nothing about overfitting."}}, {"id": 18, "ch": 2, "a": "B", "it": {"q": "Rispetto alla linear regression, la logistic regression:", "o": ["Può predire valori oltre il range dei dati", "Garantisce predizioni in [0,1]", "Non ha una loss", "È non supervisionata"], "e": "La sigmoid schiaccia l'output in [0,1]; la linear regression può uscire dal range dei dati."}, "en": {"q": "Compared with linear regression, logistic regression:", "o": ["Can predict values beyond the range of the data", "Guarantees predictions within [0,1]", "Has no loss", "Is unsupervised"], "e": "The sigmoid squashes the output into [0,1]; linear regression can exceed the range of the data."}}, {"id": 19, "ch": 3, "a": "B", "it": {"q": "`f = W₂·W₁·x` senza attivazione:", "o": ["È una rete a 2 layer non lineare", "È ancora una funzione lineare", "È un universal approximator", "Non è calcolabile"], "e": "W₂W₁ è un'unica matrice."}, "en": {"q": "`f = W₂·W₁·x` with no activation:", "o": ["Is a non-linear 2-layer network", "Is still a linear function", "Is a universal approximator", "Cannot be computed"], "e": "W₂W₁ is a single matrix."}}, {"id": 20, "ch": 3, "a": "B", "it": {"q": "Il teorema di universal approximation dice che:", "o": ["Servono almeno 10 hidden layer", "Un solo hidden layer con abbastanza neuroni può approssimare qualsiasi funzione continua su un compatto", "Le reti profonde non servono", "La backprop trova sempre i pesi giusti"], "e": "ma imparare i pesi resta difficile e le reti profonde sono più compatte."}, "en": {"q": "The universal approximation theorem states that:", "o": ["At least 10 hidden layers are needed", "A single hidden layer with enough neurons can approximate any continuous function on a compact set", "Deep networks are useless", "Backprop always finds the right weights"], "e": "but learning the weights remains hard and deep networks are more compact."}}, {"id": 21, "ch": 3, "a": "C", "it": {"q": "Rete con 3 input, un hidden layer da 4 neuroni e 2 output (con bias): quanti parametri?", "o": ["20", "24", "26", "14"], "e": "(4·3+4) + (2·4+2) = 16 + 10."}, "en": {"q": "Network with 3 inputs, one hidden layer of 4 neurons and 2 outputs (with biases): how many parameters?", "o": ["20", "24", "26", "14"], "e": "(4·3+4) + (2·4+2) = 16 + 10."}}, {"id": 22, "ch": 3, "a": "B", "it": {"q": "Quale attivazione è zero-centered ma satura?", "o": ["Sigmoid", "tanh", "ReLU", "Leaky ReLU"], "e": "tanh è centrata in zero ma satura ai due estremi. La sigmoid satura e non è zero-centered; ReLU non satura per x>0."}, "en": {"q": "Which activation is zero-centered but saturates?", "o": ["Sigmoid", "tanh", "ReLU", "Leaky ReLU"], "e": "tanh is zero-centered but saturates at both ends. Sigmoid saturates and is not zero-centered; ReLU does not saturate for x>0."}}, {"id": 23, "ch": 3, "a": "A", "it": {"q": "Lo svantaggio dell'output sempre positivo della sigmoid è:", "o": ["I gradienti dei pesi hanno tutti lo stesso segno", "La rete diventa lineare", "La loss diventa negativa", "Il softmax non è applicabile"], "e": "update tutti nella stessa direzione (zig-zag)."}, "en": {"q": "The disadvantage of the sigmoid's always-positive output is:", "o": ["The weight gradients all have the same sign", "The network becomes linear", "The loss becomes negative", "Softmax cannot be applied"], "e": "updates all in the same direction (zig-zag)."}}, {"id": 24, "ch": 3, "a": "B", "it": {"q": "Il problema \"dead ReLU\" si verifica quando:", "o": ["La ReLU satura a 1", "Il neurone restituisce sempre 0 e il suo gradiente è 0", "Il learning rate è troppo basso", "Si usa il softmax"], "e": "Se l'input è sempre ≤ 0 la ReLU restituisce 0 e la sua derivata è 0: il neurone non si aggiorna più."}, "en": {"q": "The \"dead ReLU\" problem occurs when:", "o": ["ReLU saturates at 1", "The neuron always outputs 0 and its gradient is 0", "The learning rate is too low", "Softmax is used"], "e": "If the input is always ≤ 0, ReLU outputs 0 and its derivative is 0: the neuron stops updating."}}, {"id": 25, "ch": 3, "a": "A", "it": {"q": "Un rimedio suggerito per i dead ReLU è:", "o": ["Inizializzare i bias a un piccolo valore positivo (0.01)", "Inizializzare i pesi a zero", "Usare la sigmoid", "Aumentare il batch size"], "e": "Un bias leggermente positivo rende probabile che la ReLU resti attiva per la maggior parte degli input."}, "en": {"q": "A suggested remedy for dead ReLUs is:", "o": ["Initializing biases to a small positive value (0.01)", "Initializing weights to zero", "Using sigmoid", "Increasing the batch size"], "e": "A slightly positive bias makes it likely that the ReLU stays active for most inputs."}}, {"id": 26, "ch": 3, "a": "C", "it": {"q": "Lo svantaggio di Maxout è:", "o": ["Satura", "Muore", "Aumenta il numero di parametri", "Non è lineare a tratti"], "e": "Maxout prende il massimo tra più funzioni lineari, ognuna con i propri pesi: più parametri per neurone."}, "en": {"q": "The drawback of Maxout is:", "o": ["It saturates", "It dies", "It increases the number of parameters", "It is not piecewise linear"], "e": "Maxout takes the maximum of several linear functions, each with its own weights: more parameters per neuron."}}, {"id": 27, "ch": 3, "a": "C", "it": {"q": "Il softmax:", "o": ["Si applica a ciascun neurone indipendentemente", "È invariante per scala", "Produce valori in (0,1) che sommano a 1", "Si usa con classi non mutuamente esclusive"], "e": "agisce su tutti gli output insieme, non è invariante per scala, richiede classi mutuamente esclusive."}, "en": {"q": "Softmax:", "o": ["Is applied to each neuron independently", "Is scale invariant", "Produces values in (0,1) that sum to 1", "Is used with non-mutually-exclusive classes"], "e": "it acts on all outputs together, is not scale invariant, requires mutually exclusive classes."}}, {"id": 28, "ch": 3, "a": "B", "it": {"q": "Il softmax è un'approssimazione liscia di:", "o": ["max", "arg max", "ReLU", "media"], "e": "Il nome inganna: approssima l'arg max (quale indice ha il valore massimo), non il max."}, "en": {"q": "Softmax is a smooth approximation of:", "o": ["max", "arg max", "ReLU", "mean"], "e": "The name is misleading: it approximates arg max (which index holds the maximum), not max."}}, {"id": 29, "ch": 3, "a": "B", "it": {"q": "Il softmax è:", "o": ["Invariante per traslazione e per scala", "Invariante per traslazione ma non per scala", "Invariante per scala ma non per traslazione", "Nessuna delle due"], "e": "Sommare una costante a tutti gli score non cambia l'output; moltiplicarli per una costante sì."}, "en": {"q": "Softmax is:", "o": ["Invariant under translation and scaling", "Invariant under translation but not scaling", "Invariant under scaling but not translation", "Neither"], "e": "Adding a constant to all scores does not change the output; multiplying them by a constant does."}}, {"id": 30, "ch": 3, "a": "C", "it": {"q": "Secondo la \"quick guide\", la scelta standard per gli hidden layer è:", "o": ["Sigmoid", "tanh", "ReLU", "Softmax"], "e": "ReLU è lo standard; la sigmoid non si usa quasi più, tanh serve nelle reti ricorrenti, il softmax sta solo in output."}, "en": {"q": "According to the \"quick guide\", the standard choice for hidden layers is:", "o": ["Sigmoid", "tanh", "ReLU", "Softmax"], "e": "ReLU is the standard; sigmoid is not really used, tanh is for recurrent nets, softmax only sits at the output."}}, {"id": 31, "ch": 3, "a": "B", "it": {"q": "Rispetto al perceptron originale, il neurone moderno:", "o": ["Elimina i pesi", "Aggiunge il bias e sostituisce la soglia con un'activation function", "Usa solo output binari", "Non somma gli input"], "e": "Si aggiunge il bias come input in più e il passo soglia-e-output diventa una activation function a valori reali."}, "en": {"q": "Compared with the original perceptron, the modern neuron:", "o": ["Removes the weights", "Adds the bias and replaces the threshold with an activation function", "Uses only binary outputs", "Does not sum the inputs"], "e": "The bias is added as one more input and the test-and-output step becomes a real-valued activation function."}}, {"id": 32, "ch": 4, "a": "B", "it": {"q": "L'ottimo della L1 loss è:", "o": ["La media", "La mediana", "La moda", "Il massimo"], "e": "L2 → media, L1 → mediana."}, "en": {"q": "The optimum of the L1 loss is:", "o": ["The mean", "The median", "The mode", "The maximum"], "e": "L2 → mean, L1 → median."}}, {"id": 33, "ch": 4, "a": "B", "it": {"q": "Quale loss è più sensibile agli outlier?", "o": ["L1", "L2", "Sono uguali", "Hinge"], "e": "l'errore è elevato al quadrato."}, "en": {"q": "Which loss is more sensitive to outliers?", "o": ["L1", "L2", "They are the same", "Hinge"], "e": "the error is squared."}}, {"id": 34, "ch": 4, "a": "B", "it": {"q": "Classificazione multiclasse: output layer e loss tipici sono", "o": ["Sigmoid + MSE", "Softmax + cross-entropy", "ReLU + L1", "tanh + hinge"], "e": "Il softmax trasforma gli score in probabilità; la cross-entropy penalizza −log della probabilità della classe vera. Sigmoid + binary cross-entropy è il caso binario."}, "en": {"q": "Multiclass classification: typical output layer and loss are", "o": ["Sigmoid + MSE", "Softmax + cross-entropy", "ReLU + L1", "tanh + hinge"], "e": "Softmax turns scores into probabilities; cross-entropy penalizes −log of the true class probability. Sigmoid + binary cross-entropy is the binary case."}}, {"id": 35, "ch": 4, "a": "C", "it": {"q": "Score [3.2, 5.1, −1.7], classe vera la prima. La cross-entropy loss vale circa:", "o": ["0.13", "0.079", "2.04", "6.16"], "e": "−ln(e^3.2 / (e^3.2 + e^5.1 + e^−1.7)) = −ln(0.13) ≈ 2.04. (0.13 è la probabilità, non la loss.)"}, "en": {"q": "Scores [3.2, 5.1, −1.7], true class is the first. The cross-entropy loss is about:", "o": ["0.13", "0.079", "2.04", "6.16"], "e": "−ln(e^3.2 / (e^3.2 + e^5.1 + e^−1.7)) = −ln(0.13) ≈ 2.04. (0.13 is the probability, not the loss.)"}}, {"id": 36, "ch": 4, "a": "C", "it": {"q": "Con softmax e C classi, a inizio training la loss dovrebbe essere circa:", "o": ["0", "1", "log(C)", "C"], "e": "probabilità uniformi 1/C → −log(1/C) = log C."}, "en": {"q": "With softmax and C classes, at the start of training the loss should be about:", "o": ["0", "1", "log(C)", "C"], "e": "uniform probabilities 1/C → −log(1/C) = log C."}}, {"id": 37, "ch": 4, "a": "B", "it": {"q": "La full loss è:", "o": ["Data loss − regularization loss", "Data loss + regularization loss", "Solo la data loss", "Data loss × learning rate"], "e": "Full loss = data loss + regularization loss (per esempio `λ‖W‖²`)."}, "en": {"q": "The full loss is:", "o": ["Data loss − regularization loss", "Data loss + regularization loss", "Only the data loss", "Data loss × learning rate"], "e": "Full loss = data loss + regularization loss (for example `λ‖W‖²`)."}}, {"id": 38, "ch": 5, "a": "B", "it": {"q": "`f = (x+y)·z` con x=1, y=−3, z=4. Quanto vale ∂f/∂x?", "o": ["−2", "4", "−8", "1"], "e": "∂f/∂d · ∂d/∂x = z · 1 = 4."}, "en": {"q": "`f = (x+y)·z` with x=1, y=−3, z=4. What is ∂f/∂x?", "o": ["−2", "4", "−8", "1"], "e": "∂f/∂d · ∂d/∂x = z · 1 = 4."}}, {"id": 39, "ch": 5, "a": "A", "it": {"q": "Nello stesso esempio, ∂f/∂z vale:", "o": ["−2", "4", "−8", "1"], "e": "∂f/∂z = d = x+y = −2."}, "en": {"q": "In the same example, ∂f/∂z is:", "o": ["−2", "4", "−8", "1"], "e": "∂f/∂z = d = x+y = −2."}}, {"id": 40, "ch": 5, "a": "B", "it": {"q": "La backpropagation si basa su:", "o": ["Il metodo di Newton", "La chain rule", "La line search", "Il bias trick"], "e": "La backprop scompone il gradiente in derivate locali e le moltiplica con la chain rule lungo il grafo."}, "en": {"q": "Backpropagation is based on:", "o": ["Newton's method", "The chain rule", "Line search", "The bias trick"], "e": "Backprop breaks the gradient into local derivatives and multiplies them with the chain rule along the graph."}}, {"id": 41, "ch": 5, "a": "B", "it": {"q": "In un nodo, il gradiente che viene propagato all'indietro è:", "o": ["Upstream gradient + derivata locale", "Upstream gradient × derivata locale", "Solo la derivata locale", "Il valore del forward pass"], "e": "`∂L/∂x = ∂L/∂z · ∂z/∂x`: gradiente a monte per derivata locale."}, "en": {"q": "At a node, the gradient propagated backwards is:", "o": ["Upstream gradient + local derivative", "Upstream gradient × local derivative", "Only the local derivative", "The forward-pass value"], "e": "`∂L/∂x = ∂L/∂z · ∂z/∂x`: upstream gradient times local derivative."}}, {"id": 42, "ch": 5, "a": "B", "it": {"q": "Rete `ŷ = w₂·max(0, w₁x)`, L=(ŷ−y)², con x=1, y=0, w₁=1/3, w₂=2. ∂L/∂w₂ vale:", "o": ["4/3", "4/9", "8/3", "2/3"], "e": "∂L/∂ŷ = 2·(2/3) = 4/3; per l'input di w₂ (ReLU = 1/3) → 4/9."}, "en": {"q": "Network `ŷ = w₂·max(0, w₁x)`, L=(ŷ−y)², with x=1, y=0, w₁=1/3, w₂=2. ∂L/∂w₂ is:", "o": ["4/3", "4/9", "8/3", "2/3"], "e": "∂L/∂ŷ = 2·(2/3) = 4/3; times the input of w₂ (ReLU = 1/3) → 4/9."}}, {"id": 43, "ch": 5, "a": "C", "it": {"q": "Nello stesso esempio ∂L/∂w₁ vale:", "o": ["4/9", "4/3", "8/3", "0"], "e": "4/3 · w₂ = 8/3; ReLU attiva (·1); · x = 8/3."}, "en": {"q": "In the same example ∂L/∂w₁ is:", "o": ["4/9", "4/3", "8/3", "0"], "e": "4/3 · w₂ = 8/3; ReLU active (·1); · x = 8/3."}}, {"id": 44, "ch": 5, "a": "B", "it": {"q": "In un computational graph:", "o": ["Gli archi non hanno direzione", "I nodi sono variabili o operazioni e il grafo è direzionato", "Non si possono rappresentare le attivazioni", "Ogni nodo è un intero layer"], "e": "Grafo direzionato: i nodi sono variabili o operazioni, gli archi sono il flusso dei dati."}, "en": {"q": "In a computational graph:", "o": ["Edges have no direction", "Nodes are variables or operations and the graph is directional", "Activations cannot be represented", "Each node is an entire layer"], "e": "Directional graph: nodes are variables or operations, edges are the data flow."}}, {"id": 45, "ch": 6, "a": "B", "it": {"q": "L'update del gradient descent è:", "o": ["θ' = θ + α∇L", "θ' = θ − α∇L", "θ' = α∇L", "θ' = θ − ∇L/α"], "e": "Ci si muove contro il gradiente, che punta nella direzione di massima crescita."}, "en": {"q": "The gradient descent update is:", "o": ["θ' = θ + α∇L", "θ' = θ − α∇L", "θ' = α∇L", "θ' = θ − ∇L/α"], "e": "You step against the gradient, which points in the direction of greatest increase."}}, {"id": 46, "ch": 6, "a": "B", "it": {"q": "Un learning rate troppo grande causa:", "o": ["Convergenza lenta", "Salto del minimo e divergenza", "Overfitting garantito", "Dead ReLU"], "e": "Passi troppo lunghi scavalcano il minimo. La convergenza lenta è il caso del learning rate troppo piccolo."}, "en": {"q": "A learning rate that is too large causes:", "o": ["Slow convergence", "Jumping over the minimum and divergence", "Guaranteed overfitting", "Dead ReLU"], "e": "Steps that are too long jump over the minimum. Slow convergence is the too-small learning rate case."}}, {"id": 47, "ch": 6, "a": "B", "it": {"q": "In una funzione convessa:", "o": ["Non esistono minimi", "Tutti i minimi locali sono globali", "Ci sono molti minimi locali diversi", "Il gradiente è sempre zero"], "e": "È la proprietà chiave della convessità: non esistono minimi locali 'cattivi'."}, "en": {"q": "In a convex function:", "o": ["There are no minima", "All local minima are global", "There are many different local minima", "The gradient is always zero"], "e": "This is the key property of convexity: there are no 'bad' local minima."}}, {"id": 48, "ch": 6, "a": "B", "it": {"q": "Le loss delle reti neurali sono:", "o": ["Convesse", "Non convesse, con molti minimi locali", "Lineari", "Sempre a minimo unico"], "e": "Non convesse: molti minimi locali e regioni piatte. Buoni minimi locali sono spesso sufficienti."}, "en": {"q": "Neural network losses are:", "o": ["Convex", "Non-convex, with many local minima", "Linear", "Always with a unique minimum"], "e": "Non-convex: many local minima and flat regions. Good local minima are often sufficient."}}, {"id": 49, "ch": 6, "a": "C", "it": {"q": "1.000.000 di campioni, batch size 64: quante iterazioni circa in un'epoca?", "o": ["64", "1.000", "15.625", "156.250"], "e": "156.250 è il numero di update dopo 10 epoche."}, "en": {"q": "1,000,000 samples, batch size 64: about how many iterations in one epoch?", "o": ["64", "1,000", "15,625", "156,250"], "e": "156,250 is the number of updates after 10 epochs."}}, {"id": 50, "ch": 6, "a": "B", "it": {"q": "Un'epoch è:", "o": ["Un aggiornamento su un minibatch", "Un passaggio completo sul training set", "Un passaggio sul test set", "100 iterazioni"], "e": "A è la definizione di iteration."}, "en": {"q": "An epoch is:", "o": ["One update on a minibatch", "One complete pass through the training set", "One pass through the test set", "100 iterations"], "e": "A is the definition of an iteration."}}, {"id": 51, "ch": 6, "a": "C", "it": {"q": "Un batch piccolo comporta:", "o": ["Gradiente più stabile", "Più memoria", "Alta varianza del gradiente (update rumorosi)", "Nessuna differenza"], "e": "Meno campioni → stima del gradiente più rumorosa. In cambio è veloce e usa poca memoria."}, "en": {"q": "A small batch implies:", "o": ["A more stable gradient", "More memory", "High gradient variance (noisy updates)", "No difference"], "e": "Fewer samples → noisier gradient estimate. In exchange it is fast and uses little memory."}}, {"id": 52, "ch": 6, "a": "B", "it": {"q": "Il batch size è limitato soprattutto da:", "o": ["Il numero di classi", "La memoria della GPU", "Il learning rate", "Il numero di epoche"], "e": "Il batch deve stare nella memoria della GPU, soprattutto nel backward pass."}, "en": {"q": "Batch size is mostly limited by:", "o": ["The number of classes", "GPU memory", "The learning rate", "The number of epochs"], "e": "The batch has to fit in GPU memory, especially in the backward pass."}}, {"id": 53, "ch": 6, "a": "A", "it": {"q": "Un problema di SGD \"vanilla\" è che:", "o": ["Scala il gradiente allo stesso modo in tutte le dimensioni", "Richiede l'Hessiano", "Non funziona coi minibatch", "Non ha learning rate"], "e": "Stesso learning rate per tutte le direzioni → va tenuto prudente → più lento del necessario."}, "en": {"q": "A problem of \"vanilla\" SGD is that:", "o": ["It scales the gradient equally across all dimensions", "It requires the Hessian", "It does not work with minibatches", "It has no learning rate"], "e": "Same learning rate for all directions → it must be conservative → slower than necessary."}}, {"id": 54, "ch": 6, "a": "C", "it": {"q": "Nel momentum, β è tipicamente:", "o": ["0", "0.1", "0.9", "1"], "e": "β ≈ 0.9: un po' di attrito. Con 1 oscillerebbe all'infinito, con 0 non ci sarebbe momentum."}, "en": {"q": "In momentum, β is typically:", "o": ["0", "0.1", "0.9", "1"], "e": "β ≈ 0.9: a little friction. With 1 it would rock back and forth forever, with 0 there would be no momentum."}}, {"id": 55, "ch": 6, "a": "B", "it": {"q": "Con β = 0 il momentum diventa:", "o": ["Adam", "Gradient descent normale", "RMSProp", "Newton"], "e": "Senza accumulo della velocity resta solo `−α∇L`."}, "en": {"q": "With β = 0, momentum becomes:", "o": ["Adam", "Plain gradient descent", "RMSProp", "Newton"], "e": "With no velocity accumulation only `−α∇L` remains."}}, {"id": 56, "ch": 6, "a": "B", "it": {"q": "RMSProp divide il learning rate per:", "o": ["La media dei gradienti", "Una media esponenziale dei gradienti al quadrato (radice)", "L'Hessiano", "Il numero di epoche"], "e": "`s` accumula i gradienti al quadrato; si divide per `√s + ε`, smorzando le direzioni con gradienti grandi."}, "en": {"q": "RMSProp divides the learning rate by:", "o": ["The mean of the gradients", "(The square root of) an exponentially-decaying average of squared gradients", "The Hessian", "The number of epochs"], "e": "`s` accumulates squared gradients; you divide by `√s + ε`, damping the directions with large gradients."}}, {"id": 57, "ch": 6, "a": "B", "it": {"q": "Adam combina:", "o": ["SGD e Newton", "Momentum e RMSProp", "Adagrad e L-BFGS", "Dropout e weight decay"], "e": "First moment (media dei gradienti, come Momentum) + second moment (gradienti al quadrato, come RMSProp)."}, "en": {"q": "Adam combines:", "o": ["SGD and Newton", "Momentum and RMSProp", "Adagrad and L-BFGS", "Dropout and weight decay"], "e": "First moment (mean of gradients, like Momentum) + second moment (squared gradients, like RMSProp)."}}, {"id": 58, "ch": 6, "a": "B", "it": {"q": "La bias correction in Adam serve perché:", "o": ["Il learning rate è troppo alto", "m e v sono inizializzati a zero e quindi sbilanciati verso zero", "I pesi sono inizializzati a zero", "Il batch è troppo piccolo"], "e": "Partendo da zero, nei primi passi `m` e `v` sono sottostimati: si dividono per `(1−β^k)`."}, "en": {"q": "Bias correction in Adam is needed because:", "o": ["The learning rate is too high", "m and v are initialized to zero and therefore biased towards zero", "The weights are initialized to zero", "The batch is too small"], "e": "Starting from zero, `m` and `v` are underestimated in the first steps: they are divided by `(1−β^k)`."}}, {"id": 59, "ch": 6, "a": "B", "it": {"q": "I default tipici di Adam sono:", "o": ["β₁=0.999, β₂=0.9", "β₁=0.9, β₂=0.999, ε=10⁻⁸", "β₁=0.5, β₂=0.5", "β₁=0.9, β₂=0.9, ε=0.1"], "e": "β₁=0.9, β₂=0.999, ε=10⁻⁸; il learning rate α va tarato."}, "en": {"q": "Adam's typical defaults are:", "o": ["β₁=0.999, β₂=0.9", "β₁=0.9, β₂=0.999, ε=10⁻⁸", "β₁=0.5, β₂=0.5", "β₁=0.9, β₂=0.9, ε=0.1"], "e": "β₁=0.9, β₂=0.999, ε=10⁻⁸; the learning rate α needs tuning."}}, {"id": 60, "ch": 6, "a": "B", "it": {"q": "Nel metodo di Newton:", "o": ["Il learning rate va tarato con cura", "Non c'è learning rate; si usa l'inversa dell'Hessiano", "Si usa solo il gradiente", "Si lavora bene coi minibatch"], "e": "`θ* = θ − H⁻¹∇L`: la curvatura prende il posto del learning rate. Funziona solo in full batch."}, "en": {"q": "In Newton's method:", "o": ["The learning rate must be tuned carefully", "There is no learning rate; the inverse of the Hessian is used", "Only the gradient is used", "It works well with minibatches"], "e": "`θ* = θ − H⁻¹∇L`: curvature takes the place of the learning rate. It only works with full batch."}}, {"id": 61, "ch": 6, "a": "B", "it": {"q": "Perché Newton non si usa nel deep learning?", "o": ["Converge troppo lentamente", "L'Hessiano ha (#parametri)² elementi e va invertito", "Non usa derivate", "Funziona solo con ReLU"], "e": "Con milioni di parametri l'Hessiano ha (#parametri)² elementi e invertirlo è proibitivo. In teoria convergerebbe più in fretta."}, "en": {"q": "Why is Newton not used in deep learning?", "o": ["It converges too slowly", "The Hessian has (#parameters)² elements and must be inverted", "It does not use derivatives", "It only works with ReLU"], "e": "With millions of parameters the Hessian has (#parameters)² elements and inverting it is prohibitive. In theory it would converge faster."}}, {"id": 62, "ch": 6, "a": "A", "it": {"q": "L-BFGS è:", "o": ["Un metodo quasi-Newton che approssima l'inversa dell'Hessiano", "Una variante di dropout", "Un metodo del primo ordine", "Uno schema di learning rate decay"], "e": "Quasi-Newton: approssima l'inversa dell'Hessiano; la L sta per limited memory."}, "en": {"q": "L-BFGS is:", "o": ["A quasi-Newton method approximating the inverse of the Hessian", "A variant of dropout", "A first-order method", "A learning rate decay schedule"], "e": "Quasi-Newton: it approximates the inverse of the Hessian; the L stands for limited memory."}}, {"id": 63, "ch": 6, "a": "B", "it": {"q": "In Levenberg, con λ grande il metodo si comporta come:", "o": ["Gauss-Newton", "Gradient descent", "Adam", "Newton puro"], "e": "λ piccolo → Gauss-Newton."}, "en": {"q": "In Levenberg, with large λ the method behaves like:", "o": ["Gauss-Newton", "Gradient descent", "Adam", "Pure Newton"], "e": "small λ → Gauss-Newton."}}, {"id": 64, "ch": 6, "a": "B", "it": {"q": "Secondo le slide, la scelta standard e il fallback sono:", "o": ["Newton; L-BFGS", "Adam; SGD con momentum", "SGD; Adagrad", "RMSProp; Newton"], "e": "Adam è lo standard, SGD con momentum il fallback; i metodi del secondo ordine richiedono il full batch."}, "en": {"q": "According to the slides, the standard choice and the fallback are:", "o": ["Newton; L-BFGS", "Adam; SGD with momentum", "SGD; Adagrad", "RMSProp; Newton"], "e": "Adam is the standard, SGD with momentum the fallback; second-order methods need full batch."}}, {"id": 65, "ch": 6, "a": "B", "it": {"q": "L'Hessiano è:", "o": ["Il vettore delle derivate prime", "La matrice delle derivate seconde", "La matrice dei pesi", "Il gradiente del minibatch"], "e": "il Jacobiano è la matrice delle derivate prime."}, "en": {"q": "The Hessian is:", "o": ["The vector of first derivatives", "The matrix of second derivatives", "The weight matrix", "The minibatch gradient"], "e": "the Jacobian is the matrix of first derivatives."}}, {"id": 66, "ch": 7, "a": "C", "it": {"q": "Con α₀ = 0.1 e decay_rate = 1 (α = α₀/(1+decay·epoch)), all'epoca 3 α vale:", "o": ["0.05", "0.033", "0.025", "0.0125"], "e": "0.1 / (1+3)."}, "en": {"q": "With α₀ = 0.1 and decay_rate = 1 (α = α₀/(1+decay·epoch)), at epoch 3 α is:", "o": ["0.05", "0.033", "0.025", "0.0125"], "e": "0.1 / (1+3)."}}, {"id": 67, "ch": 7, "a": "B", "it": {"q": "Il validation set serve a:", "o": ["Addestrare i pesi", "Scegliere gli iperparametri e monitorare la generalizzazione", "Dare il risultato finale", "Fare data augmentation"], "e": "Train → pesi; validation → iperparametri e controllo della generalizzazione; test → solo alla fine."}, "en": {"q": "The validation set is used to:", "o": ["Train the weights", "Choose hyperparameters and monitor generalization", "Report the final result", "Do data augmentation"], "e": "Train → weights; validation → hyperparameters and generalization check; test → only at the very end."}}, {"id": 68, "ch": 7, "a": "C", "it": {"q": "Il test set:", "o": ["Si usa per il tuning", "Si usa per il debug", "Non va toccato durante sviluppo e training", "Deve stare dentro il training set"], "e": "Se lo usi per tuning o debug, la stima finale non è più affidabile."}, "en": {"q": "The test set:", "o": ["Is used for tuning", "Is used for debugging", "Must not be touched during development and training", "Must be inside the training set"], "e": "If you use it for tuning or debugging, the final estimate is no longer reliable."}}, {"id": 69, "ch": 7, "a": "B", "it": {"q": "Errore ground truth 1%, training 5%, validation 8%. Il gap 1% → 5% rappresenta:", "o": ["Variance (overfitting)", "Bias (underfitting)", "Rumore", "Data leakage"], "e": "il gap training ↔ validation (5% → 8%) è invece variance/overfitting."}, "en": {"q": "Ground truth error 1%, training 5%, validation 8%. The 1% → 5% gap represents:", "o": ["Variance (overfitting)", "Bias (underfitting)", "Noise", "Data leakage"], "e": "the training ↔ validation gap (5% → 8%) is variance/overfitting instead."}}, {"id": 70, "ch": 7, "a": "B", "it": {"q": "Training loss che scende mentre la validation loss risale indica:", "o": ["Underfitting", "Overfitting", "Training ideale", "Learning rate troppo basso"], "e": "Il modello sta memorizzando il training set: è il segnale classico dell'overfitting."}, "en": {"q": "Training loss decreasing while validation loss increases indicates:", "o": ["Underfitting", "Overfitting", "Ideal training", "Learning rate too low"], "e": "The model is memorizing the training set: the classic sign of overfitting."}}, {"id": 71, "ch": 7, "a": "B", "it": {"q": "Training e validation loss entrambe ancora in discesa a fine training indicano:", "o": ["Overfitting", "Underfitting", "Divergenza", "Dead ReLU"], "e": "c'è ancora margine: il modello non ha finito di imparare."}, "en": {"q": "Training and validation loss both still decreasing at the end of training indicate:", "o": ["Overfitting", "Underfitting", "Divergence", "Dead ReLU"], "e": "there is still room: the model has not finished learning."}}, {"id": 72, "ch": 7, "a": "B", "it": {"q": "La random search rispetto alla grid search:", "o": ["Prova tutte le combinazioni", "Sceglie punti a caso nei range predefiniti", "Non richiede range", "È il metodo manuale"], "e": "La grid search prova tutte le combinazioni di una griglia; la random search pesca punti a caso negli stessi range."}, "en": {"q": "Random search, compared with grid search:", "o": ["Tries all combinations", "Picks points at random in the predefined ranges", "Needs no ranges", "Is the manual method"], "e": "Grid search tries every combination on a grid; random search picks random points in the same ranges."}}, {"id": 73, "ch": 7, "a": "B", "it": {"q": "Il primo passo consigliato per iniziare il training è:", "o": ["Usare la rete più grande per due settimane", "Fare overfit su un singolo campione", "Partire dal test set", "Applicare subito il dropout massimo"], "e": "Se la rete non riesce nemmeno a memorizzare un campione, c'è un bug. Poi si aumentano i dati poco alla volta."}, "en": {"q": "The recommended first step to start training is:", "o": ["Use the biggest network for two weeks", "Overfit a single sample", "Start from the test set", "Apply maximum dropout straight away"], "e": "If the network cannot even memorize one sample, there is a bug. Then you increase the data gradually."}}, {"id": 74, "ch": 7, "a": "B", "it": {"q": "Lo strumento di debug più importante secondo le slide:", "o": ["La matrice di confusione", "Le loss curves", "Il numero di parametri", "Il tempo per iterazione"], "e": "Le slide lo dicono esplicitamente: le loss curves sono lo strumento di debug più importante."}, "en": {"q": "The most important debugging tool according to the slides:", "o": ["The confusion matrix", "The loss curves", "The number of parameters", "The time per iteration"], "e": "The slides say so explicitly: loss curves are the most important debugging tool."}}, {"id": 75, "ch": 7, "a": "B", "it": {"q": "Quale di questi è un \"bad sign\"?", "o": ["Gap piccolo tra training e validation", "Performance su validation migliore che su training", "Loss che scende in modo stabile", "Generalizzazione che compare aumentando i dati"], "e": "Validation migliore del training indica che qualcosa non torna, per esempio un validation set più facile del training set."}, "en": {"q": "Which of these is a \"bad sign\"?", "o": ["Small gap between training and validation", "Validation performance better than training", "Loss decreasing steadily", "Generalization appearing as data increases"], "e": "Validation better than training means something is off, for example a validation set easier than the training set."}}, {"id": 76, "ch": 8, "a": "B", "it": {"q": "Inizializzare tutti i pesi a zero:", "o": ["È la scelta migliore", "Impedisce il symmetry breaking", "Causa exploding gradient", "Satura la tanh"], "e": "Tutti i neuroni calcolano la stessa funzione e ricevono lo stesso gradiente: restano identici."}, "en": {"q": "Initializing all weights to zero:", "o": ["Is the best choice", "Prevents symmetry breaking", "Causes exploding gradients", "Saturates tanh"], "e": "All neurons compute the same function and get the same gradient: they stay identical."}}, {"id": 77, "ch": 8, "a": "A", "it": {"q": "Pesi gaussiani con std 0.01 in una rete tanh a 10 layer:", "o": ["Output che vanno a zero e vanishing gradient", "Output saturati a ±1", "Varianza costante", "Exploding gradient"], "e": "Con pesi minuscoli gli output si rimpiccioliscono layer dopo layer fino a zero, e con loro i gradienti dei pesi."}, "en": {"q": "Gaussian weights with std 0.01 in a 10-layer tanh network:", "o": ["Outputs go to zero and vanishing gradient", "Outputs saturated at ±1", "Constant variance", "Exploding gradient"], "e": "With tiny weights the outputs shrink layer after layer down to zero, and the weight gradients with them."}}, {"id": 78, "ch": 8, "a": "B", "it": {"q": "Pesi gaussiani con std 1 in una rete tanh profonda:", "o": ["Output a zero", "Output saturati a ±1 e vanishing gradient per saturazione", "Nessun problema", "Dead ReLU"], "e": "Con pesi grandi tanh satura a ±1, dove la sua derivata è circa 0."}, "en": {"q": "Gaussian weights with std 1 in a deep tanh network:", "o": ["Outputs at zero", "Outputs saturated at ±1 and vanishing gradient from saturation", "No problem", "Dead ReLU"], "e": "With big weights tanh saturates at ±1, where its derivative is about 0."}}, {"id": 79, "ch": 8, "a": "A", "it": {"q": "Nella Xavier initialization la varianza dei pesi è:", "o": ["1/n", "2/n", "n", "0.01"], "e": "`Var(w) = 1/n` mantiene la varianza dell'output uguale a quella dell'input. `2/n` è He, per ReLU."}, "en": {"q": "In Xavier initialization the variance of the weights is:", "o": ["1/n", "2/n", "n", "0.01"], "e": "`Var(w) = 1/n` keeps the output variance equal to the input variance. `2/n` is He, for ReLU."}}, {"id": 80, "ch": 8, "a": "B", "it": {"q": "Nella formula di Xavier, n è:", "o": ["Il numero di campioni del dataset", "Il numero di neuroni di input del layer", "Il numero di classi", "Il numero di layer"], "e": "per il primo layer n = D."}, "en": {"q": "In the Xavier formula, n is:", "o": ["The number of samples in the dataset", "The number of input neurons of the layer", "The number of classes", "The number of layers"], "e": "for the first layer n = D."}}, {"id": 81, "ch": 8, "a": "B", "it": {"q": "Con ReLU si usa:", "o": ["Xavier con Var = 1/n", "He (\"Xavier/2\") con Var = 2/n", "Tutti zeri", "std = 1"], "e": "ReLU azzera metà dei valori: si raddoppia la varianza, `Var(w) = 2/n`."}, "en": {"q": "With ReLU you use:", "o": ["Xavier with Var = 1/n", "He (\"Xavier/2\") with Var = 2/n", "All zeros", "std = 1"], "e": "ReLU zeroes half of the values: the variance is doubled, `Var(w) = 2/n`."}}, {"id": 82, "ch": 9, "a": "B", "it": {"q": "La data augmentation serve principalmente a:", "o": ["Velocizzare l'inferenza", "Ridurre l'overfitting", "Ridurre i parametri", "Eliminare il bias del dataset"], "e": "Copie leggermente modificate dei dati rendono il modello invariante alle trasformazioni e riducono l'overfitting."}, "en": {"q": "Data augmentation is mainly used to:", "o": ["Speed up inference", "Reduce overfitting", "Reduce the parameters", "Remove dataset bias"], "e": "Slightly modified copies of the data make the model invariant to transformations and reduce overfitting."}}, {"id": 83, "ch": 9, "a": "B", "it": {"q": "Se il dataset originale contiene bias, i dati aumentati:", "o": ["Sono privi di bias", "Contengono gli stessi bias", "Hanno bias opposti", "Non sono utilizzabili"], "e": "L'augmentation trasforma i dati esistenti: i bias del dataset di partenza si ereditano."}, "en": {"q": "If the original dataset contains biases, the augmented data:", "o": ["Are bias-free", "Contain the same biases", "Have opposite biases", "Cannot be used"], "e": "Augmentation transforms existing data: the biases of the original dataset are inherited."}}, {"id": 84, "ch": 9, "a": "B", "it": {"q": "Nel test con crop fissi (stile ImageNet) si usano:", "o": ["5 crop", "10 crop = (4 angoli + centro) × 2 flip", "224 crop", "Crop casuali"], "e": "A test time i crop sono fissi: 4 angoli + centro, ognuno anche specchiato = 10. I crop casuali si usano in training."}, "en": {"q": "In testing with fixed crops (ImageNet style) you use:", "o": ["5 crops", "10 crops = (4 corners + center) × 2 flips", "224 crops", "Random crops"], "e": "At test time crops are fixed: 4 corners + center, each also flipped = 10. Random crops are used in training."}}, {"id": 85, "ch": 9, "a": "B", "it": {"q": "Il weight decay:", "o": ["Premia i pesi grandi", "Penalizza i pesi grandi (L2)", "Riduce il learning rate nel tempo", "Spegne neuroni"], "e": "C descrive il learning rate decay: nomi simili, cose diverse."}, "en": {"q": "Weight decay:", "o": ["Rewards large weights", "Penalizes large weights (L2)", "Reduces the learning rate over time", "Turns neurons off"], "e": "C describes learning rate decay: similar names, different things."}}, {"id": 86, "ch": 9, "a": "B", "it": {"q": "L'early stopping consiste nel:", "o": ["Fermarsi quando la training loss arriva a zero", "Fermarsi quando la validation loss inizia a peggiorare", "Fermarsi dopo un'epoca", "Ridurre il batch size"], "e": "Ci si ferma quando la validation loss inizia a risalire: è una forma semplice di regolarizzazione."}, "en": {"q": "Early stopping consists of:", "o": ["Stopping when the training loss reaches zero", "Stopping when the validation loss starts getting worse", "Stopping after one epoch", "Reducing the batch size"], "e": "You stop when the validation loss starts going up: an easy form of regularization."}}, {"id": 87, "ch": 9, "a": "B", "it": {"q": "In un ensemble, l'errore combinato diminuisce con la dimensione dell'ensemble se gli errori dei modelli sono:", "o": ["Identici", "Non correlati", "Perfettamente correlati", "Nulli"], "e": "Se i modelli sbagliano in modo indipendente, facendo la media gli errori si compensano."}, "en": {"q": "In an ensemble, the combined error decreases with the ensemble size if the models' errors are:", "o": ["Identical", "Uncorrelated", "Perfectly correlated", "Zero"], "e": "If the models make independent errors, averaging makes the errors cancel out."}}, {"id": 88, "ch": 9, "a": "B", "it": {"q": "Il dropout in training:", "o": ["Azzera pesi a caso in modo permanente", "Disattiva un insieme casuale di neuroni (tipicamente 50%)", "Rimuove layer", "Riduce il learning rate"], "e": "A ogni passo si spegne a caso un sottoinsieme di neuroni (tipicamente il 50%), diverso ogni volta."}, "en": {"q": "Dropout during training:", "o": ["Permanently zeroes random weights", "Disables a random set of neurons (typically 50%)", "Removes layers", "Reduces the learning rate"], "e": "At each step a random subset of neurons (typically 50%) is turned off, different every time."}}, {"id": 89, "ch": 9, "a": "B", "it": {"q": "A test time, con dropout:", "o": ["Si spengono il 50% dei neuroni", "Tutti i neuroni sono attivi e si applica il weight scaling", "Si riaddestra la rete", "Si usa solo metà rete"], "e": "Tutti i neuroni accesi; gli output si riscalano con la probabilità `p` (weight scaling inference rule)."}, "en": {"q": "At test time, with dropout:", "o": ["50% of neurons are turned off", "All neurons are active and weight scaling is applied", "The network is retrained", "Only half the network is used"], "e": "All neurons on; outputs are rescaled by the probability `p` (weight scaling inference rule)."}}, {"id": 90, "ch": 9, "a": "B", "it": {"q": "Il dropout può essere visto come:", "o": ["Un metodo del secondo ordine", "Un bagging efficiente con parametri condivisi", "Una data augmentation", "Un'inizializzazione"], "e": "Ogni minibatch addestra una sotto-rete diversa, ma tutte condividono gli stessi pesi."}, "en": {"q": "Dropout can be seen as:", "o": ["A second-order method", "An efficient bagging method with parameter sharing", "A data augmentation", "An initialization"], "e": "Each minibatch trains a different sub-network, but they all share the same weights."}}, {"id": 91, "ch": 9, "a": "B", "it": {"q": "Un effetto collaterale del dropout:", "o": ["Aumenta la capacità effettiva", "Riduce la capacità effettiva → modelli più grandi e più tempo di training", "Elimina la validation", "Rende la rete lineare"], "e": "Usando metà rete alla volta la capacità effettiva cala: servono modelli più grandi e più tempo di training."}, "en": {"q": "A side effect of dropout:", "o": ["It increases effective capacity", "It reduces effective capacity → larger models and more training time", "It removes the need for validation", "It makes the network linear"], "e": "Using half the network at a time lowers effective capacity: larger models and more training time are needed."}}, {"id": 92, "ch": 9, "a": "B", "it": {"q": "Un \"common mistake\" legato al dropout è:", "o": ["Usare un batch troppo grande", "Dimenticare di passare tra train mode ed eval mode", "Usare Adam", "Usare ReLU"], "e": "Il dropout si comporta in modo diverso in training e in test: bisogna impostare la modalità giusta."}, "en": {"q": "A \"common mistake\" related to dropout is:", "o": ["Using too large a batch", "Forgetting to toggle between train mode and eval mode", "Using Adam", "Using ReLU"], "e": "Dropout behaves differently in training and at test time: the right mode must be set."}}, {"id": 93, "ch": 10, "a": "B", "it": {"q": "L'internal covariate shift è:", "o": ["Il cambiamento della distribuzione dei dati tra train e test", "Il cambiamento della distribuzione degli input di un layer durante il training, perché cambiano i parametri dei layer precedenti", "La variazione del learning rate nel tempo", "La correlazione tra le feature d function startSession(items, mode, timed) {
  if (S && S.timer) clearInterval(S.timer);
  S = { mode, items, ans: items.map(() => null), idx: 0, t0: Date.now(), left: timed ? items.length * 60 : null, timer: null, confirm: false, timeout: false };
  if (timed) S.timer = setInterval(() => { S.left--; const el = $('timer'); if (el) { el.textContent = clock(Math.max(S.left, 0)); el.classList.toggle('low', S.left <= 60); } if (S.left <= 0) { S.timeout = true; finish(); } }, 1000);
  show('quiz'); renderQuiz();
}
function begin() {
  let p = shuffle(pool());
  if (setup.mode === 'prac') { const pr = q => wrongLast(q) ? 0 : !stat(q) ? 1 : 2; p.sort((a, b) => pr(a) - pr(b)); }
  if (setup.count) p = p.slice(0, setup.count);
  if (setup.mode !== 'sim') p = shuffle(p);
  startSession(p, setup.mode === 'sim' ? 'sim' : 'prac', setup.mode === 'sim' && setup.timed);
}
function record(q, ok) { const s = store.stats[q.id] || { n: 0, ok: 0 }; s.n++; if (ok) s.ok++; s.last = ok; store.stats[q.id] = s; save(); }

function renderQuiz() {
  const T = t(), q = S.items[S.idx], c = q[store.lang], a = S.ans[S.idx], sim = S.mode === 'sim', locked = !sim && a !== null, last = S.idx === S.items.length - 1;
  const opts = c.o.map((o, i) => { const l = LET[i]; let cls = '';
    if (locked) cls = l === q.a ? 'right' : l === a ? 'wrong' : ''; else if (a === l) cls = 'sel';
    return `<button type="button" class="opt ${cls}" data-l="${l}" ${locked ? 'disabled' : ''}><span class="bubble">${l}</span><span>${fmt(o)}</span></button>`; }).join('');
  const sheet = S.items.map((it, i) => { const x = S.ans[i]; let cls = x === null ? '' : sim ? 'done' : x === it.a ? 'ok' : 'ko';
    return `<button type="button" class="${cls} ${i === S.idx ? 'cur' : ''}" data-go="${i}" aria-label="${T.q} ${i + 1}">${i + 1}</button>`; }).join('');
  const un = S.ans.filter(x => x === null).length;
  $('view-quiz').innerHTML = `
    <div class="qhead"><span class="label">${T.q} <span class="num">${S.idx + 1}</span> ${T.of} <span class="num">${S.items.length}</span> · ${q.ch}. ${esc(D.chapters[q.ch - 1][store.lang])}</span>
      <span class="row">${S.left !== null ? `<span class="timer num ${S.left <= 60 ? 'low' : ''}" id="timer">${clock(Math.max(S.left, 0))}</span>` : ''}<button type="button" class="btn link" id="quit">${T.quit}</button></span></div>
    <div class="qtext">${fmt(c.q)}</div>
    <div class="opts">${opts}</div>
    ${locked ? `<div class="explain ${a === q.a ? 'ok' : 'ko'}"><b>${a === q.a ? T.right : T.wrong(q.a)}</b> ${fmt(c.e)}</div>` : ''}
    ${S.confirm ? `<div class="confirm"><span>${T.unans(un)}</span><span class="row"><button type="button" class="btn" id="deliver">${T.deliver}</button><button type="button" class="btn" id="stay">${T.back}</button></span></div>` : ''}
    <div class="nav"><button type="button" class="btn" id="prev" ${S.idx === 0 ? 'disabled' : ''}>${T.prev}</button>
      ${sim ? `<span class="row">${last ? '' : `<button type="button" class="btn" id="next">${T.next}</button>`}<button type="button" class="btn primary" id="finish">${T.finish}</button></span>`
            : `<button type="button" class="btn primary" id="${last ? 'finish' : 'next'}" ${locked ? '' : 'disabled'}>${last ? T.end : T.next}</button>`}</div>
    <div class="sheet">${sheet}</div>
    <div class="muted" style="font-size:.8rem">${T.keys}</div>`;
}
function answer(l) {
  const q = S.items[S.idx], sim = S.mode === 'sim';
  if (!sim && S.ans[S.idx] !== null) return;
  S.ans[S.idx] = l; S.confirm = false;
  if (!sim) record(q, l === q.a);
  renderQuiz();
}
function go(i) { if (i < 0 || i >= S.items.length) return; S.idx = i; S.confirm = false; renderQuiz(); }
function tryFinish() { const un = S.ans.filter(x => x === null).length; if (S.mode === 'sim' && un && !S.confirm) { S.confirm = true; renderQuiz(); } else finish(); }
function finish() {
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  S.secs = Math.round((Date.now() - S.t0) / 1000);
  if (S.mode === 'sim') { S.items.forEach((q, i) => record(q, S.ans[i] === q.a));
    store.history.push({ d: Date.now(), s: S.items.filter((q, i) => S.ans[i] === q.a).length, n: S.items.length }); store.history = store.history.slice(-30); save(); }
  onlyWrong = false; show('results'); renderResults();
}
function renderResults() {
  const T = t(), n = S.items.length, okN = S.items.filter((q, i) => S.ans[i] === q.a).length, pct = n ? okN / n : 0;
  const chs = [...new Set(S.items.map(q => q.ch))].sort((a, b) => a - b).map(ch => { const idx = S.items.map((q, i) => i).filter(i => S.items[i].ch === ch), ok = idx.filter(i => S.ans[i] === S.items[i].a).length;
    return `<div class="chrow"><span>${ch}. ${esc(D.chapters[ch - 1][store.lang])}</span><span class="num muted">${ok}/${idx.length}</span><div class="bar"><i class="ok" style="width:${ok / idx.length * 100}%"></i><i class="ko" style="width:${(idx.length - ok) / idx.length * 100}%"></i></div></div>`; }).join('');
  const rev = S.items.map((q, i) => { const c = q[store.lang], a = S.ans[i], ok = a === q.a; if (onlyWrong && ok) return '';
    return `<div class="ritem"><div><span class="tag ${ok ? 'ok' : 'ko'}">${ok ? T.ok : T.ko}</span> <span class="label">${i + 1} · ${esc(D.chapters[q.ch - 1][store.lang])}</span></div>
      <div class="q">${fmt(c.q)}</div>
      ${ok ? '' : `<div class="a muted">${T.yours}: ${a ? `${a}) ${fmt(c.o[LET.indexOf(a)])}` : T.noAns}</div>`}
      <div class="a"><strong>${T.corr}: ${q.a})</strong> ${fmt(c.o[LET.indexOf(q.a)])}</div>
      ${c.e ? `<div class="a muted">${fmt(c.e)}</div>` : ''}</div>`; }).join('');
  $('view-results').innerHTML = `<div class="wrap" style="gap:20px">
    <section class="panel"><span class="label">${T.result}${S.timeout ? ' · ' + T.timeout : ''}</span>
      <div class="score"><div class="big num">${okN}<small>/${n} ${T.correct}</small></div>
        <div class="stat"><span class="label">${T.pct}</span><b class="num">${Math.round(pct * 100)}%</b></div>
        <div class="stat"><span class="label">${T.grade}</span><b class="num">${Math.round(pct * 30)}/30</b></div>
        <div class="stat"><span class="label">${T.time}</span><b class="num">${clock(S.secs)}</b></div></div>
      <div class="row"><button type="button" class="btn primary" id="again">${T.again}</button>
        <button type="button" class="btn" id="retry" ${okN === n ? 'disabled' : ''}>${T.retry}</button></div></section>
    <section class="panel"><h2>${T.byCh}</h2><div class="chlist">${chs}</div></section>
    <section class="panel"><div class="row" style="justify-content:space-between"><h2>${T.review}</h2>
      <label class="check" for="only-wrong"><input type="checkbox" id="only-wrong" ${onlyWrong ? 'checked' : ''}>${T.onlyWrong}</label></div>
      <div class="review">${rev}</div></section></div>`;
}
function rerender() { renderHome(); if (S && !$('view-quiz').hidden) renderQuiz(); if (S && !$('view-results').hidden) renderResults(); }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'lang-it' || b.id === 'lang-en') { store.lang = b.id.slice(5); save(); rerender(); }
  else if (b.dataset.mode) { setup.mode = b.dataset.mode; renderHome(); }
  else if (b.dataset.ch) { const all = D.chapters.map((_, i) => i + 1), c = b.dataset.ch;
    if (c === 'all') setup.chapters = new Set(all);
    else { const n = +c; if (setup.chapters.size === all.length) setup.chapters = new Set([n]); else if (setup.chapters.has(n)) { setup.chapters.delete(n); if (!setup.chapters.size) setup.chapters = new Set(all); } else setup.chapters.add(n); }
    renderHome(); }
  else if (b.id === 'start') begin();
  else if (b.id === 'reset') { confirmReset = true; renderHome(); }
  else if (b.id === 'reset-no') { confirmReset = false; renderHome(); }
  else if (b.id === 'reset-yes') { store.stats = {}; store.history = []; save(); confirmReset = false; renderHome(); }
  else if (b.dataset.l) answer(b.dataset.l);
  else if (b.dataset.go) go(+b.dataset.go);
  else if (b.id === 'prev') go(S.idx - 1);
  else if (b.id === 'next') go(S.idx + 1);
  else if (b.id === 'finish') tryFinish();
  else if (b.id === 'deliver') finish();
  else if (b.id === 'stay') { S.confirm = false; renderQuiz(); }
  else if (b.id === 'quit' || b.id === 'again') { if (S && S.timer) clearInterval(S.timer); S = null; show('home'); renderHome(); }
  else if (b.id === 'retry') { const w = S.items.filter((q, i) => S.ans[i] !== q.a); startSession(shuffle(w), 'prac', false); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'count') { setup.count = +e.target.value; }
  else if (e.target.id === 'timed') setup.timed = e.target.checked;
  else if (e.target.id === 'only-wrong') { onlyWrong = e.target.checked; renderResults(); }
});
document.addEventListener('keydown', e => {
  if (!S || $('view-quiz').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), i = 'abcd'.indexOf(k) >= 0 && k.length === 1 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (k.length === 1 && i >= 0) { answer(LET[i]); e.preventDefault(); }
  else if (k === 'enter' || k === 'arrowright') { const sim = S.mode === 'sim', last = S.idx === S.items.length - 1;
    if (!sim && S.ans[S.idx] === null) return; e.preventDefault(); if (last) { if (k === 'enter') tryFinish(); } else go(S.idx + 1); }
  else if (k === 'arrowleft') go(S.idx - 1);
});
renderHome();
</script>
