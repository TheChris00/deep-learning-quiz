ne diventa difficile e le prestazioni si stabilizzano o calano", "Più layer riducono il numero di parametri", "La GPU non supporta più di 10 layer", "La batch normalization lo impedisce", "Più layer causano sempre dead ReLU"], "e": "nessuna struttura, solo forza bruta."}, "en": {"q": "Why is adding more layers not enough to improve a network?", "o": ["Optimization becomes hard and performance plateaus or drops", "More layers reduce the number of parameters", "GPUs do not support more than 10 layers", "Batch normalization prevents it", "More layers always cause dead ReLUs"], "e": "no structure, just brute force."}}, {"id": 211, "ch": 10, "a": "D", "it": {"q": "Qual è il passo di normalizzazione della batch normalization per la feature k?", "o": ["$\\hat{x} = x - 1$", "$\\hat{x} = x/\\max(x)$", "$\\hat{x} = \\log(x)$", "$\\hat{x} = \\dfrac{x - E[x]}{\\sqrt{\\mathrm{Var}[x]}}$, con media e varianza del minibatch", "$\\hat{x} = x\\cdot\\mathrm{Var}[x]$"], "e": "Si sottrae la media e si divide per la deviazione standard, calcolate sugli N esempi del minibatch per quella feature."}, "en": {"q": "What is batch normalization's normalization step for feature k?", "o": ["$\\hat{x} = x - 1$", "$\\hat{x} = x/\\max(x)$", "$\\hat{x} = \\log(x)$", "$\\hat{x} = \\dfrac{x - E[x]}{\\sqrt{\\mathrm{Var}[x]}}$, with minibatch mean and variance", "$\\hat{x} = x\\cdot\\mathrm{Var}[x]$"], "e": "Subtract the mean and divide by the standard deviation, computed over the N minibatch examples for that feature."}}, {"id": 212, "ch": 10, "a": "A", "it": {"q": "Dopo il passo di normalizzazione (prima di $\\gamma$ e $\\beta$), ogni feature del minibatch ha:", "o": ["Media 0 e varianza 1 (unit gaussian)", "Valori tra 0 e 1", "Valori interi", "Media 1 e varianza 0", "Media uguale al batch size"], "e": "È l'obiettivo dichiarato: unit gaussian activations. Poi $\\gamma$ e $\\beta$ possono cambiare il range."}, "en": {"q": "After the normalization step (before $\\gamma$ and $\\beta$), each minibatch feature has:", "o": ["Mean 0 and variance 1 (unit Gaussian)", "Values between 0 and 1", "Integer values", "Mean 1 and variance 0", "Mean equal to the batch size"], "e": "That is the stated goal: unit Gaussian activations. Then $\\gamma$ and $\\beta$ can change the range."}}, {"id": 213, "ch": 10, "a": "B", "it": {"q": "Nella running average della batch norm, $\\beta_{m}$ è:", "o": ["Il bias appreso dal layer", "Un iperparametro di momentum", "Il batch size", "Il learning rate", "La probabilità di dropout"], "e": "$\\mathrm{Var}_{\\text{running}} = \\beta_m\\mathrm{Var}_{\\text{running}} + (1-\\beta_m)\\mathrm{Var}_{\\text{minibatch}}$, idem per la media. $\\beta_{m}$ è il momentum, un iperparametro."}, "en": {"q": "In batch norm's running average, $\\beta_{m}$ is:", "o": ["The bias learned by the layer", "A momentum hyperparameter", "The batch size", "The learning rate", "The dropout probability"], "e": "$\\mathrm{Var}_{\\text{running}} = \\beta_m\\mathrm{Var}_{\\text{running}} + (1-\\beta_m)\\mathrm{Var}_{\\text{minibatch}}$, same for the mean. $\\beta_{m}$ is the momentum, a hyperparameter."}}, {"id": 214, "ch": 10, "a": "C", "it": {"q": "Quale NON è un effetto della batch normalization indicato nelle slide?", "o": ["Reti molto profonde più facili da addestrare", "Un range più ampio di iperparametri funziona in modo simile", "Rende la rete indipendente dal batch size", "Gradienti più stabili", "Riduce l'internal covariate shift"], "e": "È il contrario: BN dipende dal batch size e peggiora con batch piccoli. Per questo esistono Group Norm e simili."}, "en": {"q": "Which is NOT an effect of batch normalization given in the slides?", "o": ["Very deep nets are easier to train", "A wider range of hyperparameters works similarly", "It makes the network independent of the batch size", "More stable gradients", "It reduces internal covariate shift"], "e": "It is the opposite: BN depends on the batch size and gets worse with small batches. That is why Group Norm and similar exist."}}, {"id": 215, "ch": 10, "a": "D", "it": {"q": "Layer Norm normalizza:", "o": ["Sull'intero dataset", "Su H, W per ogni campione e canale", "Su N, H, W per ogni canale", "Su C, H, W per ogni campione", "Su N per canale"], "e": "Batch Norm: N, H, W per canale. Layer Norm: C, H, W per campione. Instance Norm: H, W per campione e canale. Group Norm: gruppi di canali + H, W per campione."}, "en": {"q": "Layer Norm normalizes:", "o": ["Over the whole dataset", "Over H, W per sample and channel", "Over N, H, W per channel", "Over C, H, W per sample", "Over N per channel"], "e": "Batch Norm: N, H, W per channel. Layer Norm: C, H, W per sample. Instance Norm: H, W per sample and channel. Group Norm: groups of channels + H, W per sample."}}, {"id": 216, "ch": 10, "a": "A", "it": {"q": "Batch Norm normalizza:", "o": ["Su N, H, W per ogni canale", "Su un gruppo di canali per ogni campione", "Su C, H, W per ogni campione", "Su H, W per ogni campione e canale", "Sull'intero dataset"], "e": "È l'unica delle quattro che include N (gli elementi del batch): per questo dipende dal batch size."}, "en": {"q": "Batch Norm normalizes:", "o": ["Over N, H, W per channel", "Over a group of channels per sample", "Over C, H, W per sample", "Over H, W per sample and channel", "Over the whole dataset"], "e": "It is the only one of the four that includes N (the batch elements): that is why it depends on the batch size."}}, {"id": 217, "ch": 10, "a": "B", "it": {"q": "Esperimento di double descent su MNIST-1D senza rumore nelle label: come si comporta il test error all'aumentare della capacità?", "o": ["Va a zero", "Continua a scendere, invece di risalire come prevede il bias-variance trade-off", "Risale sempre dopo la linea tratteggiata", "Resta costante", "Oscilla senza tendenza"], "e": "Senza rumore il picco non si vede; con il 15% di label noise il test error risale vicino al punto critico e poi riscende (double descent)."}, "en": {"q": "Double descent experiment on MNIST-1D without label noise: how does test error behave as capacity grows?", "o": ["It goes to zero", "It keeps decreasing, instead of rising as the bias-variance trade-off predicts", "It always rises after the dashed line", "It stays constant", "It oscillates without trend"], "e": "Without noise there is no peak; with 15% label noise test error rises near the critical point and then falls again (double descent)."}}, {"id": 218, "ch": 10, "a": "C", "it": {"q": "Nei grafici del double descent, la linea verticale tratteggiata indica:", "o": ["Il punto in cui il learning rate si azzera", "Il 50% di errore", "La capacità in cui il numero di parametri è uguale al numero di esempi di training", "La fine del training", "Il minimo del training error"], "e": "Vicino a quella linea il modello riesce a memorizzare esattamente i dati: è il critical regime."}, "en": {"q": "In the double descent plots, the vertical dashed line marks:", "o": ["The point where the learning rate reaches zero", "50% error", "The capacity where the number of parameters equals the number of training examples", "The end of training", "The minimum of the training error"], "e": "Near that line the model can exactly memorize the data: it is the critical regime."}}, {"id": 219, "ch": 10, "a": "D", "it": {"q": "Nell'esperimento MNIST-1D il training error è ~0 eppure il test error cambia con la capacità. Cosa ne deducono le slide?", "o": ["Il test set è sbagliato", "Il learning rate è troppo alto", "La rete non sta imparando nulla", "Quello che succede non avviene sui punti di training, ma tra i punti", "Il modello è in underfitting"], "e": "Con training error nullo, le differenze tra modelli stanno in come si comportano tra un punto di training e l'altro."}, "en": {"q": "In the MNIST-1D experiment training error is ~0, yet test error changes with capacity. What do the slides conclude?", "o": ["The test set is wrong", "The learning rate is too high", "The network is learning nothing", "Whatever happens is not happening at the training points, but between them", "The model is underfitting"], "e": "With zero training error, the differences between models lie in how they behave between training points."}}, {"id": 220, "ch": 10, "a": "A", "it": {"q": "In uno spazio ad alta dimensione, il volume di un'ipersfera di diametro 1:", "o": ["Tende a zero", "Tende a infinito", "È uguale a quello del cubo che la contiene", "Vale sempre 1", "Vale 1/2"], "e": "È una delle \"weird properties\": con tante dimensioni quasi tutto il volume sta negli angoli e nella \"buccia\"."}, "en": {"q": "In a high-dimensional space, the volume of a hypersphere of diameter one:", "o": ["Goes to zero", "Goes to infinity", "Equals that of the enclosing cube", "Is always 1", "Equals 1/2"], "e": "It is one of the \"weird properties\": with many dimensions almost all the volume is in the corners and the \"peel\"."}}, {"id": 221, "ch": 10, "a": "B", "it": {"q": "Perché l'internal covariate shift è particolarmente grave nelle reti profonde?", "o": ["Perché hanno meno parametri", "Piccoli cambiamenti nei primi layer si amplificano propagandosi e spostano molto i layer profondi", "Perché usano solo la sigmoid", "Perché le reti profonde non hanno bias", "Perché usano batch più grandi"], "e": "Ogni layer deve riadattarsi alla nuova distribuzione dei suoi input; più layer ci sono, più l'effetto si accumula."}, "en": {"q": "Why is internal covariate shift especially severe in deep networks?", "o": ["Because they have fewer parameters", "Small changes in shallow layers are amplified as they propagate and shift deep layers a lot", "Because they only use sigmoid", "Because deep networks have no biases", "Because they use larger batches"], "e": "Each layer must readjust to the new distribution of its inputs; the more layers, the more the effect accumulates."}}, {"id": 222, "ch": 10, "a": "C", "it": {"q": "Nella batch normalization, per quali valori di $\\gamma$ e $\\beta$ la rete annulla del tutto la normalizzazione?", "o": ["$\\gamma = 0$ e $\\beta = 0$", "$\\gamma = 1$ e $\\beta = 0$", "$\\gamma = \\sqrt{\\mathrm{Var}[x]}$ e $\\beta = E[x]$", "$\\gamma = E[x]$ e $\\beta = \\mathrm{Var}[x]$", "$\\gamma = \\mathrm{Var}[x]$ e $\\beta = 1$"], "e": "$y = \\gamma\\hat{x} + \\beta$: con $\\gamma$ = deviazione standard e $\\beta$ = media si ritrova l'x originale. Così la normalizzazione non toglie potere espressivo."}, "en": {"q": "In batch normalization, for which values of $\\gamma$ and $\\beta$ does the network fully undo the normalization?", "o": ["$\\gamma = 0$ and $\\beta = 0$", "$\\gamma = 1$ and $\\beta = 0$", "$\\gamma = \\sqrt{\\mathrm{Var}[x]}$ and $\\beta = E[x]$", "$\\gamma = E[x]$ and $\\beta = \\mathrm{Var}[x]$", "$\\gamma = \\mathrm{Var}[x]$ and $\\beta = 1$"], "e": "$y = \\gamma\\hat{x} + \\beta$: with $\\gamma$ = standard deviation and $\\beta$ = mean you get the original x back. So normalization does not remove expressive power."}}, {"id": 223, "ch": 10, "a": "D", "it": {"q": "Nell'esperimento MNIST-1D (2 hidden layer da 100 unità, 4000 esempi), dove si ferma il test error?", "o": ["Al 10%", "A 0%, come il training error", "Al 90%", "Intorno al 40%, mentre il training error va a 0", "Intorno al 70%"], "e": "Il modello memorizza il training set ma non generalizza: serve un test set separato per accorgersene."}, "en": {"q": "In the MNIST-1D experiment (2 hidden layers of 100 units, 4000 examples), where does test error stop?", "o": ["At 10%", "At 0%, like training error", "At 90%", "Around 40%, while training error goes to 0", "Around 70%"], "e": "The model memorizes the training set but does not generalize: you need a separate test set to notice."}}, {"id": 224, "ch": 11, "a": "B", "it": {"q": "In un layer fully connected con vettore di input x di dimensione n e matrice dei pesi W di dimensione m × n, che dimensione ha l'output y?", "o": ["$m \\times n$", "$m$", "$n$", "$n \\times m$", "$1 \\times m$"], "e": "$y = Wx$: una matrice (m × n) per un vettore di n elementi dà un vettore di m elementi, uno per neurone. Come in CIFAR-10: W è 10×3072, x ha 3072 valori, y ha 10 score."}, "en": {"q": "In a fully connected layer with input vector x of size n and weight matrix W of size m × n, what is the size of the output vector y?", "o": ["$m \\times n$", "$m$", "$n$", "$n \\times m$", "$1 \\times m$"], "e": "$y = Wx$: an (m × n) matrix times an n-vector gives an m-vector, one value per neuron. Same as CIFAR-10: W is 10×3072, x has 3072 values, y has 10 scores."}}, {"id": 225, "ch": 11, "a": "C", "it": {"q": "Qual è il termine di regolarizzazione L2 per una matrice dei pesi W?", "o": ["$\\frac{\\lambda}{2}\\sum_{ij} W_{ij}$", "$\\lambda\\sum_{ij} W_{ij}^2$", "$\\frac{\\lambda}{2}\\sum_{ij} W_{ij}^2$", "$\\lambda\\sum_{ij} |W_{ij}|$", "$\\lambda\\max(W_{ij})$"], "e": "L2 = somma dei quadrati dei pesi. Il fattore 1/2 è la convenzione che rende il gradiente esattamente $\\lambda W$ (il termine di weight decay). Anche $\\lambda\\sum W^2$ è L2 a meno di una costante, quindi l'esempio è un po' ambiguo: scegli la forma con $\\lambda$/2. $\\lambda\\sum |W|$ è la L1."}, "en": {"q": "What is the L2 regularization term for a weight matrix W in a neural network?", "o": ["$\\frac{\\lambda}{2}\\sum_{ij} W_{ij}$", "$\\lambda\\sum_{ij} W_{ij}^2$", "$\\frac{\\lambda}{2}\\sum_{ij} W_{ij}^2$", "$\\lambda\\sum_{ij} |W_{ij}|$", "$\\lambda\\max(W_{ij})$"], "e": "L2 = sum of squared weights. The 1/2 is the usual convention so the gradient is exactly $\\lambda W$ (the weight decay term). $\\lambda\\sum W^2$ is also L2 up to a constant, so this example is a little ambiguous: pick the form with $\\lambda$/2. $\\lambda\\sum |W|$ is L1."}}, {"id": 226, "ch": 11, "a": "A", "it": {"q": "Nel gradient descent, se il learning rate è troppo piccolo, qual è una conseguenza probabile?", "o": ["L'algoritmo può convergere molto lentamente.", "L'algoritmo converge immediatamente.", "L'algoritmo salta il minimo globale.", "Il learning rate aumenta automaticamente.", "L'algoritmo non usa gradienti."], "e": "Troppo piccolo → passi minuscoli, apprendimento lentissimo. Saltare il minimo e divergere è l'effetto di un learning rate troppo grande."}, "en": {"q": "In the gradient descent algorithm, if the learning rate is too small, what is a likely consequence?", "o": ["The algorithm may converge very slowly.", "The algorithm will converge immediately.", "The algorithm will skip the global minimum.", "The learning rate will automatically increase.", "The algorithm will not use any gradients."], "e": "Too small → tiny steps, very slow learning. Jumping over the minimum and diverging is what happens with a learning rate that is too large."}}, {"id": 227, "ch": 11, "a": "A", "it": {"q": "Nel mini-batch gradient descent, che effetto ha usare un batch size più grande?", "o": ["Aumenta velocità e stabilità del training, ma può richiedere più memoria.", "Riduce molto il tempo di training qualunque sia l'hardware.", "Garantisce la convergenza al minimo globale.", "Riduce l'accuratezza complessiva del modello.", "Elimina la necessità della backpropagation."], "e": "Un batch più grande dà un gradiente più stabile (meno rumoroso) e richiede più memoria GPU. Attenzione: le slide dicono che un batch grande è più lento per aggiornamento; qui \"velocità\" va intesa come meno aggiornamenti per epoca, più regolari. Resta comunque l'unica opzione sensata."}, "en": {"q": "In mini-batch gradient descent, what is the impact of using a larger batch size?", "o": ["Increases training speed and stability, but may require more memory.", "Reduces training time significantly regardless of hardware.", "Ensures convergence to the global minimum.", "Reduces the overall accuracy of the model.", "Eliminates the need for backpropagation."], "e": "A larger batch gives a more stable (less noisy) gradient and needs more GPU memory. Careful: the slides say a large batch is slower per update; here 'training speed' is meant as fewer, steadier updates per epoch. It is still the only reasonable option."}}, {"id": 228, "ch": 11, "a": "A", "it": {"q": "In un layer convolutional, un kernel 3×3 è applicato a un input 5×5. Che dimensione ha la feature map in uscita, senza padding e con stride 1?", "o": ["3×3", "5×5", "7×7", "4×4", "6×6"], "e": "Dimensione output = $(N-K)/\\text{stride} + 1 = (5-3)/1 + 1 = 3$, quindi 3×3. (Argomento non presente nelle slide fino al 17/11.)"}, "en": {"q": "In a convolutional layer, a 3×3 kernel is applied to a 5×5 input. What is the size of the output feature map with no padding and stride 1?", "o": ["3×3", "5×5", "7×7", "4×4", "6×6"], "e": "Output size = $(N-K)/\\text{stride} + 1 = (5-3)/1 + 1 = 3$, so 3×3. (Topic not in the slides up to 17/11.)"}}, {"id": 229, "ch": 11, "a": "B", "it": {"q": "Perché una corretta inizializzazione dei pesi è importante?", "o": ["Determina l'accuratezza finale del modello.", "Evita che le attivazioni diventino troppo piccole o troppo grandi.", "Accelera il training impostando tutti i pesi allo stesso valore.", "Permette di usare batch più grandi.", "Sostituisce la funzione di attivazione."], "e": "Pesi troppo piccoli → attivazioni a zero; troppo grandi → la tanh satura a ±1; in entrambi i casi vanishing gradient. Pesi tutti uguali sono anzi un errore (niente symmetry breaking)."}, "en": {"q": "Why is proper weight initialization important in deep learning models?", "o": ["It determines the final accuracy of the model.", "It prevents the activation values from becoming too small or too large.", "It accelerates the training by setting all weights to the same value.", "It enables the use of larger batch sizes.", "It replaces the need for an activation function."], "e": "Too small weights → activations go to zero; too large → tanh saturates at ±1; both give vanishing gradients. All-equal weights are actually a mistake (no symmetry breaking)."}}, {"id": 230, "ch": 11, "a": "B", "it": {"q": "A cosa serve il max pooling in una rete convolutional?", "o": ["Ad aumentare la profondità della rete.", "A ridurre le dimensioni spaziali della feature map.", "Ad aggiungere non-linearità al modello.", "A sostituire i layer convolutional.", "A fare da funzione di attivazione."], "e": "Il max pooling tiene il massimo di ogni piccola finestra (per esempio 2×2) e riduce altezza e larghezza della feature map. (Argomento non presente nelle slide fino al 17/11.)"}, "en": {"q": "What is the purpose of max pooling in a convolutional neural network?", "o": ["To increase the depth of the network.", "To reduce the spatial dimensions of the feature map.", "To add non-linearity to the model.", "To replace the need for convolutional layers.", "To serve as an activation function."], "e": "Max pooling keeps the maximum of each small window (e.g. 2×2), shrinking height and width of the feature map. (Topic not in the slides up to 17/11.)"}}, {"id": 231, "ch": 11, "a": "C", "it": {"q": "Qual è lo scopo principale di tecniche di normalizzazione come la batch normalization?", "o": ["Aumentare il numero di parametri.", "Rendere binari tutti gli input.", "Migliorare stabilità e velocità del training normalizzando gli input dei layer.", "Ridurre la dimensione della rete.", "Eliminare le funzioni di attivazione."], "e": "La batch norm rende il training più veloce e stabile ricentrando e riscalando gli input dei layer (Ioffe & Szegedy)."}, "en": {"q": "What is the primary purpose of normalization techniques like batch normalization?", "o": ["To increase the number of parameters in the model.", "To ensure all inputs are binary.", "To improve the stability and speed of training by normalizing layer inputs.", "To reduce the size of the network.", "To eliminate the need for activation functions."], "e": "Batch norm makes training faster and more stable by re-centering and re-scaling the layers' inputs (Ioffe & Szegedy)."}}, {"id": 232, "ch": 11, "a": "B", "it": {"q": "Qual è l'equazione della funzione di attivazione ReLU?", "o": ["$f(x) = \\dfrac{1}{1+e^{-x}}$", "$f(x) = \\max(0, x)$", "$f(x) = x^2$", "$f(x) = \\tanh(x)$", "$f(x) = \\dfrac{x}{1+|x|}$"], "e": "ReLU = $\\max(0, x)$. $1/(1+e^{-x})$ è la sigmoid; $\\tanh(x)$ è la tanh."}, "en": {"q": "What is the equation for the ReLU activation function?", "o": ["$f(x) = \\dfrac{1}{1+e^{-x}}$", "$f(x) = \\max(0, x)$", "$f(x) = x^2$", "$f(x) = \\tanh(x)$", "$f(x) = \\dfrac{x}{1+|x|}$"], "e": "ReLU = $\\max(0, x)$. $1/(1+e^{-x})$ is the sigmoid; $\\tanh(x)$ is tanh."}}, {"id": 233, "ch": 11, "a": "C", "it": {"q": "Data una loss L e un peso w, quale formula dà il gradiente calcolato dalla backpropagation (con y l'output che dipende da w)?", "o": ["$\\dfrac{\\partial L}{\\partial w} = \\dfrac{\\partial L}{\\partial y}\\cdot\\dfrac{\\partial y}{\\partial x}$", "$\\dfrac{\\partial L}{\\partial w} = \\dfrac{\\partial L}{\\partial x}\\cdot\\dfrac{\\partial x}{\\partial w}$", "$\\dfrac{\\partial L}{\\partial w} = \\dfrac{\\partial L}{\\partial y}\\cdot\\dfrac{\\partial y}{\\partial w}$", "$\\dfrac{\\partial L}{\\partial w} = \\dfrac{1}{\\partial w}$", "$\\dfrac{\\partial L}{\\partial w} = \\dfrac{\\partial x}{\\partial w}\\cdot\\dfrac{\\partial y}{\\partial x}$"], "e": "Chain rule: da L all'output y, poi da y a w. Controlla che le variabili intermedie si \"semplifichino\" e resti $\\dfrac{\\partial L}{\\partial w}$."}, "en": {"q": "For a loss L and a weight w, which formula gives the gradient computed by backpropagation (with y the output that depends on w)?", "o": ["$\\dfrac{\\partial L}{\\partial w} = \\dfrac{\\partial L}{\\partial y}\\cdot\\dfrac{\\partial y}{\\partial x}$", "$\\dfrac{\\partial L}{\\partial w} = \\dfrac{\\partial L}{\\partial x}\\cdot\\dfrac{\\partial x}{\\partial w}$", "$\\dfrac{\\partial L}{\\partial w} = \\dfrac{\\partial L}{\\partial y}\\cdot\\dfrac{\\partial y}{\\partial w}$", "$\\dfrac{\\partial L}{\\partial w} = \\dfrac{1}{\\partial w}$", "$\\dfrac{\\partial L}{\\partial w} = \\dfrac{\\partial x}{\\partial w}\\cdot\\dfrac{\\partial y}{\\partial x}$"], "e": "Chain rule: go from L to the output y, then from y to w. Check that the intermediate variables 'cancel' and you end up with $\\dfrac{\\partial L}{\\partial w}$."}}, {"id": 234, "ch": 11, "a": "A", "it": {"q": "Qual è la formula del Softmax per un vettore z?", "o": ["$\\mathrm{softmax}(z_i) = \\dfrac{e^{z_i}}{\\sum_j e^{z_j}}$", "$\\mathrm{softmax}(z_i) = \\dfrac{1}{1+e^{-z_i}}$", "$\\mathrm{softmax}(z_i) = \\max(0, z_i)$", "$\\mathrm{softmax}(z_i) = \\dfrac{e^{z_i^2}}{\\sum_j e^{z_j^2}}$", "$\\mathrm{softmax}(z_i) = \\dfrac{1}{\\sum_j z_j}$"], "e": "Esponenziale di ogni score diviso la somma di tutti gli esponenziali: valori positivi che sommano a 1. $1/(1+e^{-z})$ è la sigmoid, $\\max(0, z)$ è la ReLU."}, "en": {"q": "What is the formula of the Softmax function for a vector z?", "o": ["$\\mathrm{softmax}(z_i) = \\dfrac{e^{z_i}}{\\sum_j e^{z_j}}$", "$\\mathrm{softmax}(z_i) = \\dfrac{1}{1+e^{-z_i}}$", "$\\mathrm{softmax}(z_i) = \\max(0, z_i)$", "$\\mathrm{softmax}(z_i) = \\dfrac{e^{z_i^2}}{\\sum_j e^{z_j^2}}$", "$\\mathrm{softmax}(z_i) = \\dfrac{1}{\\sum_j z_j}$"], "e": "Exponential of each score divided by the sum of all exponentials: positive values that sum to 1. $1/(1+e^{-z})$ is the sigmoid, $\\max(0, z)$ is ReLU."}}, {"id": 235, "ch": 11, "a": "A", "it": {"q": "Qual è la binary cross-entropy con probabilità predetta p e label vera y?", "o": ["$L = -[y\\log(p) + (1-y)\\log(1-p)]$", "$L = -[y\\log(1-p) + (1-y)\\log(p)]$", "$L = \\tfrac12 (y-p)^2$", "$L = \\dfrac{1}{1+e^{-yp}}$", "$L = p(1-y) + (1-p)y$"], "e": "Se $y = 1$ resta solo $-\\log p$; se $y = 0$ solo $-\\log(1-p)$. La versione con i termini scambiati premierebbe le predizioni sbagliate; $\\tfrac12(y-p)^2$ è la MSE."}, "en": {"q": "What is the binary cross-entropy loss with predicted probability p and true label y?", "o": ["$L = -[y\\log(p) + (1-y)\\log(1-p)]$", "$L = -[y\\log(1-p) + (1-y)\\log(p)]$", "$L = \\tfrac12 (y-p)^2$", "$L = \\dfrac{1}{1+e^{-yp}}$", "$L = p(1-y) + (1-p)y$"], "e": "If $y = 1$ only $-\\log p$ remains; if $y = 0$ only $-\\log(1-p)$. The swapped version would reward wrong predictions; $\\tfrac12(y-p)^2$ is MSE."}}, {"id": 236, "ch": 11, "a": "B", "it": {"q": "Qual è lo scopo principale del dropout?", "o": ["Aumentare la velocità di training", "Ridurre l'overfitting", "Aumentare il numero di layer", "Ridurre la dimensione dei dati di input", "Migliorare la normalizzazione dei dati"], "e": "Il dropout è una regolarizzazione: spegnere neuroni a caso riduce la co-adaptation e l'overfitting. Anzi, richiede più tempo di training."}, "en": {"q": "What is the primary purpose of using dropout in a neural network?", "o": ["To increase the training speed", "To reduce overfitting", "To increase the number of layers in the network", "To reduce the size of the input data", "To improve data normalization"], "e": "Dropout is a regularizer: switching random neurons off reduces co-adaptation and overfitting. It actually needs more training time, not less."}}, {"id": 237, "ch": 11, "a": "B", "it": {"q": "Nelle reti neurali, a cosa si riferisce la 'Backpropagation'?", "o": ["Al passaggio in avanti degli input fino all'output layer", "Alla trasmissione dell'errore all'indietro nella rete per aggiustare i pesi", "All'inizializzazione dei pesi", "Al dropout dei neuroni durante il training", "All'aumento della profondità della rete"], "e": "Backward pass: il gradiente della loss scorre dall'output a ogni peso con la chain rule. Far scorrere gli input in avanti è il forward pass."}, "en": {"q": "In the context of neural networks, what does 'Backpropagation' refer to?", "o": ["The process of feeding forward the inputs to the output layer", "The transmission of error back through the network to adjust the weights", "The initialization of weights before training", "The dropout of neurons during training", "The process of increasing the depth of the network"], "e": "Backward pass: the gradient of the loss flows from the output back to every weight with the chain rule. Feeding inputs forward is the forward pass."}}, {"id": 238, "ch": 11, "a": "A", "it": {"q": "Cosa indica il termine 'minibatch'?", "o": ["Un piccolo sottoinsieme dei dati di training usato per aggiornare i parametri", "Un tipo di architettura", "Una tecnica per ridurre il modello", "Un tipo di funzione di attivazione", "Una tecnica di regolarizzazione"], "e": "SGD stima il gradiente su m ≪ n campioni e aggiorna i pesi: un aggiornamento per minibatch = una iteration."}, "en": {"q": "What does the term 'minibatch' refer to in deep learning?", "o": ["A small subset of the training data, used to update model parameters", "A type of neural network architecture", "A technique for reducing the model size", "A specific type of activation function", "A regularization technique"], "e": "SGD estimates the gradient on m ≪ n samples and updates the weights: one update per minibatch = one iteration."}}, {"id": 239, "ch": 11, "a": "A", "it": {"q": "A cosa serve principalmente la Xavier initialization?", "o": ["A prevenire il vanishing gradient", "Ad aumentare il learning rate", "Ad aggiungere layer di dropout", "Ad aumentare il batch size", "A ridurre la complessità del modello"], "e": "Xavier ($\\mathrm{Var} = 1/n$) mantiene la varianza dell'output uguale a quella dell'input: le attivazioni non muoiono né saturano e i gradienti non svaniscono."}, "en": {"q": "What is the Xavier initialization primarily used for?", "o": ["To prevent the vanishing gradient problem", "To increase the learning rate", "To add dropout layers", "To increase the batch size", "To decrease the model's complexity"], "e": "Xavier ($\\mathrm{Var} = 1/n$) keeps the output variance equal to the input variance, so activations neither die out nor saturate and gradients do not vanish."}}, {"id": 240, "ch": 11, "a": "C", "it": {"q": "In cosa aiuta il 'Momentum'?", "o": ["Riduce il tempo di calcolo", "Previene l'overfitting", "Accelera il gradient descent nella direzione giusta", "Aumenta il numero di layer", "Diminuisce il learning rate"], "e": "La velocity accumula i gradienti: i passi crescono quando i gradienti puntano sempre nella stessa direzione e le oscillazioni si cancellano."}, "en": {"q": "In neural networks, what does 'Momentum' help with?", "o": ["Reducing the computation time", "Preventing overfitting", "Accelerating the gradient descent in the right direction", "Increasing the number of layers in the network", "Decreasing the learning rate"], "e": "Velocity accumulates gradients: steps grow when gradients keep pointing the same way and oscillations cancel out."}}, {"id": 241, "ch": 11, "a": "C", "it": {"q": "Qual è la funzione principale di una Convolutional Neural Network (CNN)?", "o": ["Previsione di serie temporali", "Clustering non supervisionato", "Riconoscimento ed elaborazione di immagini", "Generazione di testo", "Elaborazione di segnali audio"], "e": "Nelle slide la classificazione di immagini è l'esempio della CNN; segmentation, depth e pose usano encoder-decoder convolutional."}, "en": {"q": "What is the main function of a Convolutional Neural Network (CNN)?", "o": ["Time series prediction", "Unsupervised clustering", "Image recognition and processing", "Text generation", "Audio signal processing"], "e": "In the slides image classification is the CNN example (multiclass, convolutional network); segmentation, depth and pose use convolutional encoder-decoders."}}, {"id": 242, "ch": 11, "a": "C", "it": {"q": "Quale di queste è una caratteristica dell'architettura ResNet?", "o": ["Uso di cicli ricorrenti", "Layer poco profondi", "Uso di residual connection per addestrare reti più profonde", "Uso esclusivo di layer fully connected", "Assenza di funzioni di attivazione"], "e": "ResNet aggiunge connessioni residue (skip) che permettono di addestrare reti molto profonde. Nelle slide compare nel grafico \"BN: A Milestone\". (Argomento non presente nelle slide fino al 17/11.)"}, "en": {"q": "Which of the following is a characteristic of the ResNet architecture?", "o": ["Usage of recurrent loops", "Shallow network layers", "Use of residual connections to facilitate training of deeper networks", "Exclusive use of fully connected layers", "Absence of activation functions"], "e": "ResNet adds skip (residual) connections that let very deep networks train. In the slides ResNet appears in the batch-norm 'milestone' chart. (Topic not in the slides up to 17/11.)"}}, {"id": 243, "ch": 11, "a": "B", "it": {"q": "Cosa indica il 'Vanishing Gradient'?", "o": ["Gradienti che crescono esponenzialmente durante la backpropagation", "Gradienti che diventano insignificanti e bloccano l'apprendimento", "Un aumento improvviso dell'accuratezza", "Pesi che spariscono durante il training", "Dati di input che perdono importanza"], "e": "I gradienti si rimpiccioliscono moltiplicandosi all'indietro (attivazioni sature, output troppo piccoli) e i primi layer smettono di imparare. Gradienti che crescono sarebbero \"exploding\"."}, "en": {"q": "The term 'Vanishing Gradient' refers to what issue in training deep neural networks?", "o": ["Gradients growing exponentially larger as backpropagation progresses", "Gradients becoming insignificantly small, hindering learning", "The sudden increase in network accuracy", "The network weights vanishing during training", "The input data losing significance"], "e": "Gradients shrink as they are multiplied backwards (saturated activations, too-small outputs) and early layers stop learning. Growing gradients would be 'exploding'."}}, {"id": 244, "ch": 11, "a": "A", "it": {"q": "Cos'è un layer 'Fully Connected'?", "o": ["Un layer in cui ogni neurone è collegato a tutti i neuroni del layer successivo", "Un layer completamente addestrato", "Un layer di dropout", "Un layer con pesi fissi", "Un layer collegato solo ai dati di input"], "e": "Ogni input è collegato a ogni neurone: per questo W ha (#neuroni × #input) pesi."}, "en": {"q": "What is a 'Fully Connected Layer' in a neural network?", "o": ["A layer where each neuron is connected to every neuron in the next layer", "A layer that is fully trained", "A dropout layer", "A layer with fixed weights", "A layer that connects to the input data only"], "e": "Every input is connected to every neuron: that is why W has (#neurons × #inputs) weights."}}, {"id": 245, "ch": 11, "a": "D", "it": {"q": "Quale funzione di attivazione è nota per risolvere in parte il vanishing gradient?", "o": ["Sigmoid", "SoftMax", "Lineare", "ReLU", "Tanh"], "e": "La ReLU non satura per x > 0 e dà gradienti grandi e costanti. Sigmoid e tanh saturano."}, "en": {"q": "Which activation function is known for solving the vanishing gradient problem to some extent?", "o": ["Sigmoid", "SoftMax", "Linear", "ReLU", "Tanh"], "e": "ReLU does not saturate for x > 0 and gives large, consistent gradients. Sigmoid and tanh saturate."}}, {"id": 246, "ch": 11, "a": "A", "it": {"q": "In deep learning, cos'è il 'Receptive Field'?", "o": ["L'area dell'input che un certo filtro della CNN osserva", "L'ambito da cui la rete riceve i dati", "La parte dell'output layer che decide", "Il range di valori di un'attivazione", "La dimensione del minibatch"], "e": "La regione dell'immagine di input che influenza un'unità di un layer convolutional; cresce con la profondità. (Argomento non presente nelle slide fino al 17/11.)"}, "en": {"q": "In deep learning, what is the 'Receptive Field'?", "o": ["The area of the input data that a particular CNN filter looks at", "The field in which the network receives its training data", "The section of the output layer that determines the final decision", "The range of values an activation function can output", "The size of the minibatch"], "e": "The region of the input image that influences one unit of a convolutional layer; it grows with depth. (Topic not in the slides up to 17/11.)"}}, {"id": 247, "ch": 11, "a": "D", "it": {"q": "Cosa indica 'Composite Function' nelle reti neurali?", "o": ["La combinazione di più loss", "La funzione che combina gli output di tutti i neuroni di un layer", "Una funzione di regolarizzazione", "La sequenza di operazioni dall'input all'output della rete", "Un tipo di attivazione"], "e": "Una rete neurale è un annidamento di funzioni, per esempio $f = W_3\\max(0, W_2\\max(0, W_1x))$: una composizione dall'input all'output. Per questo la backprop usa la chain rule."}, "en": {"q": "The term 'Composite Function' in neural networks refers to what?", "o": ["The combination of multiple loss functions", "The function combining the outputs of all neurons in a layer", "A function used for regularization", "The sequence of operations from input to output in a network", "A type of activation function"], "e": "A neural network is a nesting of functions, e.g. $f = W_3\\max(0, W_2\\max(0, W_1x))$: a composition from input to output. That is also why backprop uses the chain rule."}}, {"id": 248, "ch": 11, "a": "D", "it": {"q": "Cosa fa tipicamente la funzione 'SoftMax'?", "o": ["Normalizza le feature di input", "Fa da attivazione negli hidden layer", "Inizializza i pesi", "Converte l'output in distribuzioni di probabilità", "Accelera il training"], "e": "Il softmax si applica in uscita a un classificatore e trasforma gli score in probabilità che sommano a 1. Non si usa negli hidden layer."}, "en": {"q": "In the context of neural networks, what does the 'SoftMax' function typically do?", "o": ["It normalizes the input features", "It acts as an activation function for hidden layers", "It is used to initialize network weights", "It converts the output to probability distributions", "It speeds up the training process"], "e": "Softmax is applied at the output of a classifier and turns scores into probabilities that sum to 1. It is not used in hidden layers."}}, {"id": 249, "ch": 11, "a": "C", "it": {"q": "In quale tipo di problema si usa più spesso la cross-entropy loss?", "o": ["Regressione", "Classificazione binaria", "Classificazione multiclasse", "Unsupervised learning", "Reinforcement learning"], "e": "Softmax + cross-entropy è lo standard per il multiclasse. La classificazione binaria usa il suo caso particolare, la binary cross-entropy: la risposta attesa è multiclasse."}, "en": {"q": "Cross-entropy loss is most commonly used in which type of task?", "o": ["Regression", "Binary classification", "Multi-class classification", "Unsupervised learning", "Reinforcement learning"], "e": "Softmax + cross-entropy is the standard for multiclass. Binary classification uses its special case, binary cross-entropy, so 'multi-class' is the intended answer."}}, {"id": 250, "ch": 11, "a": "C", "it": {"q": "Cosa distingue una Support Vector Machine (SVM) da una rete neurale?", "o": ["Le SVM non gestiscono dataset grandi", "Le SVM superano sempre le reti neurali", "Le SVM puntano a massimizzare il margine tra le classi", "Le SVM sono un tipo di rete neurale", "Le SVM usano il gradient descent"], "e": "Una SVM cerca il confine di separazione con il margine più ampio. Nelle slide compare solo la SVM (hinge) loss: $\\sum \\max(0,\\ s_k - s_y + 1)$. (Argomento non presente nelle slide fino al 17/11.)"}, "en": {"q": "What distinguishes a Support Vector Machine (SVM) from a neural network?", "o": ["SVMs cannot handle large datasets", "SVMs always outperform neural networks", "SVMs focus on maximizing the margin between classes", "SVMs are a type of neural network", "SVMs use gradient descent for optimization"], "e": "An SVM looks for the separating boundary with the largest margin. In the slides you only meet the SVM (hinge) loss: $\\sum \\max(0,\\ s_k - s_y + 1)$. (Topic not in the slides up to 17/11.)"}}, {"id": 251, "ch": 11, "a": "C", "it": {"q": "A cosa serve principalmente la 'Regularization'?", "o": ["Ad accelerare il training", "A scegliere automaticamente il numero di layer", "A prevenire l'overfitting penalizzando modelli complessi", "Ad aumentare il learning rate", "A scegliere la funzione di attivazione"], "e": "Weight decay, early stopping, dropout, data augmentation, ensemble: riducono tutti l'overfitting e migliorano la generalizzazione."}, "en": {"q": "In deep learning, what is 'Regularization' primarily used for?", "o": ["To speed up the training process", "To automatically select the right number of layers in a network", "To prevent overfitting by penalizing complex models", "To increase the learning rate", "To choose the type of activation function"], "e": "Weight decay, early stopping, dropout, data augmentation, ensembles: all reduce overfitting and improve generalization."}}, {"id": 252, "ch": 11, "a": "A", "it": {"q": "Qual è la differenza principale tra Classification e Regression?", "o": ["La classificazione predice label discrete, la regressione valori continui", "La classificazione si usa solo nelle reti neurali", "La regressione è più veloce", "Solo la classificazione usa una loss", "La regressione è unsupervised"], "e": "Regression = output numerici continui; classification = classi discrete. Sono entrambe supervisionate e usano entrambe una loss."}, "en": {"q": "What is the main difference between Classification and Regression?", "o": ["Classification predicts discrete labels, while regression predicts continuous values", "Classification is used only in neural networks, while regression is not", "Regression algorithms are faster than classification algorithms", "Classification uses loss functions, while regression does not", "Regression is a type of unsupervised learning"], "e": "Regression = continuous numbers as output; classification = discrete classes. Both are supervised and both use a loss."}}, {"id": 253, "ch": 11, "a": "C", "it": {"q": "Quale architettura è nota per la profondità e il gran numero di parametri, spesso usata nel riconoscimento di immagini?", "o": ["LSTM", "RNN", "VGG", "Decision Tree", "Linear Regression"], "e": "VGG è una rete convolutional profonda per ImageNet (compare nel grafico \"BN: A Milestone\"). LSTM e RNN sono reti ricorrenti per sequenze. (Argomento non presente nelle slide fino al 17/11.)"}, "en": {"q": "Which architecture is known for its depth and large number of parameters, often used in image recognition?", "o": ["LSTM", "RNN", "VGG", "Decision Tree", "Linear Regression"], "e": "VGG is a deep convolutional network for ImageNet (it appears in the batch-norm milestone chart). LSTM and RNN are recurrent networks for sequences. (Topic not in the slides up to 17/11.)"}}, {"id": 254, "ch": 11, "a": "B", "it": {"q": "La 'Noise Initialization' serve a:", "o": ["Ridurre il rumore nei dati di input", "Inizializzare i pesi con piccoli numeri casuali", "Rendere la rete robusta al rumore in input", "Impedire alla rete di imparare", "Aumentare l'accuratezza"], "e": "Inizializzare con rumore casuale (gaussiano) rompe la simmetria che darebbero pesi tutti a zero. Serve però la scala giusta (Xavier/He)."}, "en": {"q": "'Noise Initialization' in neural networks is used to:", "o": ["Reduce the noise in the input data", "Initialize the weights with random small numbers", "Increase the network's robustness to input noise", "Prevent the network from learning", "Increase the network's prediction accuracy"], "e": "Initializing with random (Gaussian) noise breaks the symmetry that all-zero weights would cause. It must have the right scale (Xavier/He)."}}, {"id": 255, "ch": 11, "a": "B", "it": {"q": "Qual è lo scopo principale di una funzione di attivazione?", "o": ["Normalizzare i dati di input", "Permettere alla rete di imparare relazioni non lineari", "Ridurre la dimensione dei dati", "Accelerare il training", "Collegare i layer"], "e": "Senza non-linearità, impilare layer resta lineare ($W_2W_1x$ è un'unica matrice)."}, "en": {"q": "What is the main purpose of an Activation Function in neural networks?", "o": ["To normalize the input data", "To allow the network to learn non-linear patterns", "To reduce the dimensions of the data", "To increase the training speed", "To connect different layers of the network"], "e": "Without non-linearity, stacking layers stays linear ($W_2W_1x$ is one matrix)."}}, {"id": 256, "ch": 11, "a": "B", "it": {"q": "Nel deep learning, cosa indica il 'Bias'?", "o": ["La distorsione intenzionale dei dati", "Un input in più di ogni neurone che ne aggiusta l'output", "Un tipo di errore durante il training", "La preferenza di un modello per certi dati", "Il fine-tuning dopo il training"], "e": "Nelle slide: a ogni neurone si dà un input in più, chiamato bias (il b di $Wx + b$). Da non confondere con il bias inteso come errore di underfitting."}, "en": {"q": "In the context of deep learning, what does 'Bias' refer to?", "o": ["The intentional skewing of data to achieve a certain result", "An extra input to each neuron to adjust the output", "A type of error that occurs during training", "The preference of a model for certain types of data", "The process of fine-tuning the model after training"], "e": "In the slides: 'we provide each neuron with one more input, which we call the bias' (the b in $Wx + b$). Do not confuse it with bias as underfitting error."}}, {"id": 257, "ch": 11, "a": "C", "it": {"q": "Che ruolo ha la 'Loss Function' nel training?", "o": ["Determina l'architettura", "Sceglie la funzione di attivazione", "Misura quanto bene funziona il modello", "Imposta il learning rate", "Sceglie il tipo di layer"], "e": "Loss bassa = buone predizioni, loss alta = cattive. Il training la minimizza rispetto ai pesi."}, "en": {"q": "What role does the 'Loss Function' play in training a neural network?", "o": ["It determines the architecture of the network", "It specifies the activation function to be used", "It defines how well the model is performing", "It sets the learning rate", "It selects the type of layers to be used"], "e": "Low loss = good predictions, high loss = bad. Training minimizes it w.r.t. the weights."}}, {"id": 258, "ch": 11, "a": "C", "it": {"q": "'AlexNet' è importante nel deep learning perché:", "o": ["È stata la prima rete con layer convolutional", "Ha introdotto per prima dropout e ReLU", "Ha segnato un grande progresso nel riconoscimento di immagini con il deep learning", "È la forma più semplice di rete neurale", "Ha introdotto il training a minibatch"], "e": "AlexNet (Krizhevsky et al., 2012) vinse ImageNet con un grande distacco. Ha reso popolari ReLU e dropout ma non li ha inventati, e le reti convolutional esistevano già (LeCun)."}, "en": {"q": "'AlexNet' is significant in deep learning because it:", "o": ["Was the first network to use convolutional layers", "Was the first to introduce dropout and ReLU activation", "Marked a major advancement in the application of deep learning for image recognition", "Is the simplest form of a neural network", "Introduced the concept of minibatch training"], "e": "AlexNet (Krizhevsky et al., 2012) won ImageNet by a large margin. It popularized ReLU and dropout but did not invent them, and convolutional networks already existed (LeCun)."}}, {"id": 259, "ch": 11, "a": "A", "it": {"q": "La funzione di attivazione 'Tanh' è caratterizzata da:", "o": ["Output tra −1 e 1", "Output tra 0 e 1", "Output lineari", "Output sempre positivi", "Output fissi"], "e": "La tanh è zero-centered con range (−1, 1); la sigmoid ha range (0, 1)."}, "en": {"q": "In a neural network, the 'Tanh' activation function is characterized by:", "o": ["Outputs ranging from −1 to 1", "Outputs ranging from 0 to 1", "Linear outputs", "Outputs that are always positive", "Fixed outputs regardless of the input"], "e": "tanh is zero-centered with range (−1, 1); the sigmoid has range (0, 1)."}}, {"id": 260, "ch": 11, "a": "A", "it": {"q": "Il concetto di 'Deep Network' indica:", "o": ["Una rete con molti layer", "Una rete per concetti filosofici profondi", "Una rete per dati dei fondali marini", "Una rete con soli layer fully connected", "Una rete di deep reinforcement learning"], "e": "Depth = numero di layer; width = neuroni per layer."}, "en": {"q": "The concept of 'Deep Network' refers to:", "o": ["A network with a large number of layers", "A network that can process deep philosophical concepts", }
function renderResults() {
  const T = t(), n = S.items.length, okN = S.items.filter((q, i) => S.ans[i] === q.a).length, pct = n ? okN / n : 0;
  const chs = [...new Set(S.items.map(q => q.ch))].sort((a, b) => a - b).map(ch => { const idx = S.items.map((q, i) => i).filter(i => S.items[i].ch === ch), ok = idx.filter(i => S.ans[i] === S.items[i].a).length;
    return `<div class="chrow"><span>${ch}. ${esc(D.chapters[ch - 1][store.lang])}</span><span class="num muted">${ok}/${idx.length}</span><div class="bar"><i class="ok" style="width:${ok / idx.length * 100}%"></i><i class="ko" style="width:${(idx.length - ok) / idx.length * 100}%"></i></div></div>`; }).join('');
  const rev = S.items.map((q, i) => { const c = q[store.lang], a = S.ans[i], ok = a === q.a; if (onlyWrong && ok) return '';
    return `<div class="ritem"><div><span class="tag ${ok ? 'ok' : 'ko'}">${ok ? T.ok : T.ko}</span> <span class="label">${i + 1} · ${esc(D.chapters[q.ch - 1][store.lang])}</span></div>
      <div class="q">${fmt(c.q)}</div>
      ${ok ? '' : `<div class="a muted">${T.yours}: ${a ? `${dl(i, a)}) ${fmt(c.o[LET.indexOf(a)])}` : T.noAns}</div>`}
      <div class="a"><strong>${T.corr}: ${dl(i, q.a)})</strong> ${fmt(c.o[LET.indexOf(q.a)])}</div>
      ${c.e ? `<div class="a muted">${fmt(c.e)}</div>` : ''}</div>`; }).join('');
  $('view-results').innerHTML = `<div class="wrap" style="gap:20px">
    <section class="panel"><span class="label">${T.result}${S.timeout ? ' · ' + T.timeout : ''}</span>
      <div class="score"><div class="big num">${okN}<small>/${n} ${T.correct}</small></div>
        <div class="stat"><span class="label">${T.pct}</span><b class="num">${Math.round(pct * 100)}%</b></div>
        <div class="stat"><span class="label">${T.grade}</span><b class="num">${Math.round(pct * 30)}/30</b></div>
        <div class="stat"><span class="label">${T.time}</span><b class="num">${clock(S.secs)}</b></div></div>
      <div class="row"><button type="button" class="btn primary" id="again">${T.again}</button>
        <button type="button" class="btn" id="retry" ${okN === n ? 'disabled' : ''}>${T.retry}</button></div></section>
    <section class="panel"><h2>${T.byCh}</h2><div class="chlist">${chs}</div></section>
    <section class="panel"><div class="row" style="justify-content:space-between"><h2>${T.review}</h2>
      <label class="check" for="only-wrong"><input type="checkbox" id="only-wrong" ${onlyWrong ? 'checked' : ''}>${T.onlyWrong}</label></div>
      <div class="review">${rev}</div></section></div>`;
  typeset($('view-results'));
}
function rerender() { renderHome(); if (S && !$('view-quiz').hidden) renderQuiz(); if (S && !$('view-results').hidden) renderResults(); }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'lang-it' || b.id === 'lang-en') { store.lang = b.id.slice(5); save(); rerender(); }
  else if (b.dataset.mode) { setup.mode = b.dataset.mode; renderHome(); }
  else if (b.dataset.ch) { const all = D.chapters.map((_, i) => i + 1), c = b.dataset.ch;
    if (c === 'all') setup.chapters = new Set(all);
    else { const n = +c; if (setup.chapters.size === all.length) setup.chapters = new Set([n]); else if (setup.chapters.has(n)) { setup.chapters.delete(n); if (!setup.chapters.size) setup.chapters = new Set(all); } else setup.chapters.add(n); }
    renderHome(); }
  else if (b.id === 'start') begin();
  else if (b.id === 'reset') { confirmReset = true; renderHome(); }
  else if (b.id === 'reset-no') { confirmReset = false; renderHome(); }
  else if (b.id === 'reset-yes') { store.stats = {}; store.history = []; store.srs = null; store.day = null; save(); confirmReset = false; renderHome(); }
  else if (b.dataset.l) answer(b.dataset.l);
  else if (b.dataset.go) go(+b.dataset.go);
  else if (b.id === 'prev') go(S.idx - 1);
  else if (b.id === 'next') go(S.idx + 1);
  else if (b.id === 'finish') tryFinish();
  else if (b.id === 'deliver') finish();
  else if (b.id === 'stay') { S.confirm = false; renderQuiz(); }
  else if (b.id === 'quit' || b.id === 'again') { if (S && S.timer) clearInterval(S.timer); S = null; show('home'); renderHome(); }
  else if (b.id === 'retry') { const w = S.items.filter((q, i) => S.ans[i] !== q.a); startSession(shuffle(w), 'prac', false); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'count') { setup.count = +e.target.value; }
  else if (e.target.id === 'timed') setup.timed = e.target.checked;
  else if (e.target.id === 'only-wrong') { onlyWrong = e.target.checked; renderResults(); }
});
document.addEventListener('keydown', e => {
  if (!S || $('view-quiz').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), i = 'abcde'.indexOf(k) >= 0 && k.length === 1 ? 'abcde'.indexOf(k) : '12345'.indexOf(k);
  if (k.length === 1 && i >= 0 && i < S.perm[S.idx].length) { answer(LET[S.perm[S.idx][i]]); e.preventDefault(); }
  else if (k === 'enter' || k === 'arrowright') { const sim = S.mode === 'sim', last = S.idx === S.items.length - 1;
    if (!sim && S.ans[S.idx] === null) return; e.preventDefault(); if (last) { if (k === 'enter') tryFinish(); } else go(S.idx + 1); }
  else if (k === 'arrowleft') go(S.idx - 1);
});
// ---------- Studio guidato (spaced repetition, Leitner) ----------
const LS = {
  it: {
    title: 'Studio guidato', exam: n => n > 1 ? `Esame tra ${n} giorni · 24 novembre` : n === 1 ? 'Esame domani · 24 novembre' : n === 0 ? 'Esame oggi · 24 novembre' : 'Esame del 24 novembre passato',
    m4: 'Padroneggiate', m23: 'In consolidamento', m1: 'Da correggere', m0: 'Mai viste',
    today: (d, n) => `Oggi: <b>${d}</b> da ripassare · <b>${n}</b> nuove`,
    start: 'Inizia lo studio di oggi', cont: 'Continua lo studio di oggi', doneToday: 'Per oggi hai finito. Domani ti ripropongo le domande da ripassare.',
    extra: 'Fammi altre domande', how: 'Come funziona',
    howList: ['Ogni giorno ricevi un blocco di domande nuove, dosato per vederle tutte entro il 23 novembre.',
      'Se sbagli, la domanda torna dopo altre 3 domande, finché non la indovini. Poi la rivedi domani.',
      'Se indovini, la rivedi dopo 1, poi 2, poi 3 giorni. Con 3 risposte giuste di fila è padroneggiata e torna solo il giorno prima dell’esame.',
      'Anche gli errori fatti in Allenamento e nelle Simulazioni finiscono nel ripasso.'],
    tagNew: 'Nuova', tagRev: 'Ripasso', tagFix: 'Da correggere', again: 'La rivedrai fra poche domande.', next: 'Avanti', quit: 'Torna alla home',
    left: n => `${n} in questo giro`, roundDone: 'Giro completato', firstTry: (a, b) => `${a} su ${b} giuste al primo colpo`,
    contN: n => `Continua (${n} rimaste per oggi)`, home: 'Torna alla home', allDone: 'Hai finito le domande di oggi. Ottimo lavoro.',
    suggest: 'Se hai ancora tempo, fai una Simulazione d’esame da 30 domande a tempo.',
  },
  en: {
    title: 'Guided study', exam: n => n > 1 ? `Exam in ${n} days · 24 November` : n === 1 ? 'Exam tomorrow · 24 November' : n === 0 ? 'Exam today · 24 November' : '24 November exam has passed',
    m4: 'Mastered', m23: 'Consolidating', m1: 'To fix', m0: 'Never seen',
    today: (d, n) => `Today: <b>${d}</b> to review · <b>${n}</b> new`,
    start: 'Start today’s study', cont: 'Continue today’s study', doneToday: 'You are done for today. Tomorrow I will bring back the questions to review.',
    extra: 'Give me more questions', how: 'How it works',
    howList: ['Every day you get a batch of new questions, sized so you see them all by 23 November.',
      'If you get one wrong, it comes back after 3 other questions, until you get it right. Then you see it again tomorrow.',
      'If you get it right, you see it again after 1, then 2, then 3 days. Three right answers in a row and it is mastered: it only comes back the day before the exam.',
      'Mistakes made in Practice and Exam simulations also go into the review.'],
    tagNew: 'New', tagRev: 'Review', tagFix: 'To fix', again: 'You will see it again in a few questions.', next: 'Next', quit: 'Back to home',
    left: n => `${n} in this round`, roundDone: 'Round complete', firstTry: (a, b) => `${a} of ${b} right at the first try`,
    contN: n => `Continue (${n} left for today)`, home: 'Back to home', allDone: 'You have finished today’s questions. Great work.',
    suggest: 'If you still have time, do a 30-question timed Exam simulation.',
  }
};
const EXAM_DAY = (() => { const d = new Date(2026, 10, 24); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); })();
const todayNum = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
const GAP = [0, 0, 1, 2, 3];
const ROUND = 15, REQUEUE = 3;
let ST = null;
const ls = () => LS[store.lang];

function srsInit() {
  if (!store.srs) {
    store.srs = {};
    const td = todayNum();
    for (const q of D.questions) { const s = store.stats[q.id]; if (s) store.srs[q.id] = { box: s.last ? 2 : 1, due: td, w: s.n - s.ok }; }
    save();
  }
}
function srsUpdate(q, ok) {
  srsInit();
  const td = todayNum(), cur = store.srs[q.id] || { box: 0, w: 0 };
  const box = ok ? (cur.box === 0 ? 2 : Math.min(cur.box + 1, 4)) : 1;
  let due = td + GAP[box];
  if (ok) { if (td < EXAM_DAY - 1) due = Math.min(due, EXAM_DAY - 1); due = Math.max(due, td + 1); }
  store.srs[q.id] = { box, due, w: (cur.w || 0) + (ok ? 0 : 1) };
}
function studyDay() {
  const td = todayNum();
  if (!store.day || store.day.d !== td) store.day = { d: td, newDone: 0 };
  return store.day;
}
function studyPlan() {
  srsInit();
  const td = todayNum(), day = studyDay();
  const unseen = D.questions.filter(q => !store.srs[q.id]).sort((a, b) => a.ch - b.ch || a.id - b.id);
  const daysLeft = Math.max(1, EXAM_DAY - td);
  const quota = td >= EXAM_DAY - 1 ? unseen.length + day.newDone : Math.ceil((unseen.length + day.newDone) / daysLeft);
  const newLeft = Math.min(unseen.length, Math.max(0, quota - day.newDone));
  const due = shuffle(D.questions.filter(q => store.srs[q.id] && store.srs[q.id].due <= td)).sort((a, b) => store.srs[a.id].box - store.srs[b.id].box);
  return { due, fresh: unseen.slice(0, newLeft), unseen, td };
}
function counts() {
  srsInit();
  const c = { m4: 0, m23: 0, m1: 0, m0: 0 };
  for (const q of D.questions) { const s = store.srs[q.id]; if (!s) c.m0++; else if (s.box >= 4) c.m4++; else if (s.box >= 2) c.m23++; else c.m1++; }
  return c;
}
function renderStudyCard() {
  const T = ls(), p = studyPlan(), c = counts(), N = D.questions.length, el = $('study-card');
  const dleft = EXAM_DAY - p.td, todo = p.due.length + p.fresh.length;
  const seg = (k, color) => c[k] ? `<i style="width:${c[k] / N * 100}%;background:var(${color})"></i>` : '';
  el.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:baseline"><h2>${T.title}</h2><span class="label">${T.exam(dleft)}</span></div>
    <div class="stack">${seg('m4', '--good')}${seg('m23', '--accent')}${seg('m1', '--bad')}</div>
    <div class="legend"><span><i style="background:var(--good)"></i>${T.m4} <b class="num">${c.m4}</b></span><span><i style="background:var(--accent)"></i>${T.m23} <b class="num">${c.m23}</b></span><span><i style="background:var(--bad)"></i>${T.m1} <b class="num">${c.m1}</b></span><span><i style="background:var(--line)"></i>${T.m0} <b class="num">${c.m0}</b></span></div>
    ${todo ? `<div>${T.today(p.due.length, p.fresh.length)}</div>
      <div class="row"><button type="button" class="btn primary" id="st-start">${studyDay().newDone || ST ? T.cont : T.start}</button></div>`
      : `<div class="muted">${T.doneToday}</div><div class="row"><button type="button" class="btn" id="st-extra">${T.extra}</button></div>`}
    <details><summary>${T.how}</summary><ol class="how">${T.howList.map(x => `<li>${x}</li>`).join('')}</ol></details>`;
}
function studyRound(extra) {
  const p = studyPlan();
  let cards = [...p.due, ...p.fresh];
  if (!cards.length && extra) {
    const td = p.td;
    cards = D.questions.filter(q => store.srs[q.id] && store.srs[q.id].due > td).sort((a, b) => store.srs[a.id].box - store.srs[b.id].box || store.srs[a.id].due - store.srs[b.id].due);
    cards = [...cards, ...p.unseen];
  }
  cards = cards.slice(0, ROUND);
  if (!cards.length) { show('home'); renderHome(); return; }
  const fresh = new Set(p.fresh.map(q => q.id));
  ST = { cards, kind: cards.map(q => !store.srs[q.id] ? 'new' : store.srs[q.id].box <= 1 ? 'fix' : 'rev'), perm: cards.map(q => shuffle(q.it.o.map((_, i) => i))),
         i: 0, ans: null, first: new Map(), freshIds: fresh, extra: !!extra };
  show('study'); renderStudy();
}
function renderStudy() {
  const T = ls(), TT = t(), q = ST.cards[ST.i], c = q[store.lang], a = ST.ans, P = ST.perm[ST.i], kind = ST.kind[ST.i];
  const opts = P.map((oi, j) => { const l = LET[oi]; let cls = '';
    if (a) cls = l === q.a ? 'right' : l === a ? 'wrong' : '';
    return `<button type="button" class="opt ${cls}" data-sl="${l}" ${a ? 'disabled' : ''}><span class="bubble">${LET[j]}</span><span>${fmt(c.o[oi])}</span></button>`; }).join('');
  const disp = LET[P.indexOf(LET.indexOf(q.a))];
  const tag = kind === 'new' ? `<span class="tag new">${T.tagNew}</span>` : kind === 'fix' ? `<span class="tag ko">${T.tagFix}</span>` : `<span class="tag ok">${T.tagRev}</span>`;
  $('view-study').innerHTML = `
    <div class="qhead"><span class="label">${tag} ${q.ch}. ${esc(D.chapters[q.ch - 1][store.lang])} · ${T.left(ST.cards.length - ST.i)}</span>
      <button type="button" class="btn link" id="st-quit">${T.quit}</button></div>
    <div class="qtext">${fmt(c.q)}</div>
    <div class="opts">${opts}</div>
    ${a ? `<div class="explain ${a === q.a ? 'ok' : 'ko'}"><b>${a === q.a ? TT.right : TT.wrong(disp)}</b> ${fmt(c.e)}${a === q.a ? '' : ` <i>${T.again}</i>`}</div>
      <div class="nav"><span></span><button type="button" class="btn primary" id="st-next">${T.next}</button></div>` : ''}
    <div class="muted" style="font-size:.8rem">${TT.keys}</div>`;
  typeset($('view-study'));
}
function studyAnswer(l) {
  if (!ST || ST.ans) return;
  const q = ST.cards[ST.i], ok = l === q.a;
  ST.ans = l;
  if (!ST.first.has(q.id)) ST.first.set(q.id, ok);
  if (ST.kind[ST.i] === 'new' && ST.freshIds.has(q.id)) { studyDay().newDone++; ST.freshIds.delete(q.id); }
  record(q, ok);
  if (!ok) {
    const at = Math.min(ST.i + 1 + REQUEUE, ST.cards.length);
    ST.cards.splice(at, 0, q); ST.kind.splice(at, 0, 'fix'); ST.perm.splice(at, 0, shuffle(q.it.o.map((_, i) => i)));
  }
  renderStudy();
}
function studyNext() {
  if (!ST || !ST.ans) return;
  ST.i++; ST.ans = null;
  if (ST.i < ST.cards.length) { renderStudy(); window.scrollTo(0, 0); return; }
  const T = ls(), firstOk = [...ST.first.values()].filter(Boolean).length, p = studyPlan(), left = p.due.length + p.fresh.length;
  $('view-study').innerHTML = `
    <span class="label">${T.roundDone}</span>
    <div class="score"><div class="big num">${firstOk}<small>/${ST.first.size}</small></div><div class="muted">${T.firstTry(firstOk, ST.first.size)}</div></div>
    ${left ? '' : `<div>${T.allDone}</div><div class="muted">${T.suggest}</div>`}
    <div class="row">${left ? `<button type="button" class="btn primary" id="st-more">${T.contN(left)}</button>` : ''}<button type="button" class="btn" id="st-home">${T.home}</button></div>`;
  ST = null; window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'st-start' || b.id === 'st-more') studyRound(false);
  else if (b.id === 'st-extra') studyRound(true);
  else if (b.dataset.sl) studyAnswer(b.dataset.sl);
  else if (b.id === 'st-next') studyNext();
  else if (b.id === 'st-quit' || b.id === 'st-home') { ST = null; show('home'); renderHome(); }
  else if ((b.id === 'lang-it' || b.id === 'lang-en') && ST && !$('view-study').hidden) renderStudy();
});
document.addEventListener('keydown', e => {
  if ($('view-study').hidden || !ST || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  let i = 'abcde'.indexOf(k); if (i < 0) i = '12345'.indexOf(k);
  if (k.length === 1 && i >= 0 && !ST.ans && i < ST.perm[ST.i].length) { studyAnswer(LET[ST.perm[ST.i][i]]); e.preventDefault(); }
  else if ((k === 'enter' || k === 'arrowright') && ST.ans) { e.preventDefault(); studyNext(); }
});

renderHome();
</script>
