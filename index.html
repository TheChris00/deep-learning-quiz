<style>
/* Layout: one narrow working column like an exam sheet; setup on the left, progress on the right; the answer-bubble grid is the recurring motif. */
:root {
  --bg: #f1f4f9; --surface: #ffffff; --ink: #151a2d; --muted: #586179; --line: #d3d9e6;
  --accent: #2743c4; --accent-soft: #e3e8fb; --on-accent: #ffffff;
  --good: #17794a; --good-soft: #dcf2e6; --bad: #b3261e; --bad-soft: #fbe2e0;
  --font-display: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131c; --surface: #191e2b; --ink: #e7eaf4; --muted: #9aa3ba; --line: #2d3446;
  --accent: #93a5ff; --accent-soft: #222a4c; --on-accent: #0d1230;
  --good: #5fd39a; --good-soft: #143225; --bad: #ff8d83; --bad-soft: #3a1b1a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10131c; --surface: #191e2b; --ink: #e7eaf4; --muted: #9aa3ba; --line: #2d3446;
  --accent: #93a5ff; --accent-soft: #222a4c; --on-accent: #0d1230;
  --good: #5fd39a; --good-soft: #143225; --bad: #ff8d83; --bad-soft: #3a1b1a; color-scheme: dark }

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1.05rem; font-weight: 600; }
mjx-container { font-size: 108% !important; } mjx-container[display="true"] { overflow-x: auto; }
.opt mjx-container, .qtext mjx-container, .explain mjx-container, .ritem mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
code { font-family: var(--font-mono); font-size: 0.88em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top .sub { color: var(--muted); font-size: 0.9rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 13px; border-radius: 999px; font-size: 0.85rem; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.home { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .home { grid-template-columns: minmax(0, 1fr); } }

.modes { display: flex; flex-direction: column; gap: 8px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 11px 14px; display: flex; flex-direction: column; gap: 2px; }
.mode strong { font-family: var(--font-display); font-weight: 600; }
.mode span { font-size: 0.86rem; color: var(--muted); }
.mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 0.84rem; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.92rem; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 16px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.link { border: 0; background: none; padding: 0; color: var(--muted); font-size: 0.85rem; text-decoration: underline; }

.chrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; font-size: 0.9rem; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); display: flex; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .ok { background: var(--good); } .bar .ko { background: var(--bad); }
.chlist { display: flex; flex-direction: column; gap: 11px; }
.hist { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
.hist div { display: flex; justify-content: space-between; gap: 10px; }
.legend { display: flex; gap: 14px; font-size: 0.78rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer { font-family: var(--font-mono); font-size: 0.95rem; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; }
.timer.low { color: var(--bad); border-color: var(--bad); }
.qtext { font-size: 1.13rem; font-weight: 500; max-width: 68ch; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 14px; }
.bubble { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .bubble { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .bubble { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .bubble { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; color: inherit; opacity: 1; }
.explain { border-radius: var(--r); padding: 12px 14px; font-size: 0.95rem; max-width: 72ch; }
.explain.ok { background: var(--good-soft); } .explain.ko { background: var(--bad-soft); }
.explain b { font-family: var(--font-display); }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 6px; }
.sheet button { height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 0.78rem; font-variant-numeric: tabular-nums; padding: 0; }
.sheet button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sheet button.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.sheet button.ko { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.sheet button.cur { box-shadow: 0 0 0 2px var(--ink); }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.score { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; }
.score .big { font-family: var(--font-display); font-size: 3rem; font-weight: 700; line-height: 1; }
.score .big small { font-size: 1.3rem; color: var(--muted); font-weight: 500; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.4rem; }
.review { display: flex; flex-direction: column; gap: 14px; }
.ritem { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.ritem .q { font-weight: 500; max-width: 72ch; }
.ritem .a { font-size: 0.93rem; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.tag.ok { background: var(--good-soft); color: var(--good); } .tag.ko { background: var(--bad-soft); color: var(--bad); }

.study { border-color: var(--accent); }
.stack { height: 10px; border-radius: 5px; background: var(--line); display: flex; overflow: hidden; }
.stack i { display: block; height: 100%; }
.legend b { color: var(--ink); font-weight: 600; margin-left: 3px; }
.tag.new { background: var(--accent-soft); color: var(--accent); }
details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
ol.how { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .opt, .chip, .mode { transition: background-color .12s, border-color .12s; } }
</style>

<script>
const D = {"chapters": [{"it": "Basi di ML", "en": "ML basics"}, {"it": "Classificatore lineare", "en": "Linear classifier"}, {"it": "Reti neurali e attivazioni", "en": "Neural networks and activations"}, {"it": "Loss", "en": "Losses"}, {"it": "Backpropagation", "en": "Backpropagation"}, {"it": "Ottimizzazione", "en": "Optimization"}, {"it": "Training", "en": "Training"}, {"it": "Inizializzazione", "en": "Initialization"}, {"it": "Regolarizzazione", "en": "Regularization"}, {"it": "Batch norm e prestazioni", "en": "Batch norm and performance"}, {"it": "Esempi d'esame 2024", "en": "2024 exam examples"}], "questions": [{"id": 1, "ch": 1, "a": "C", "it": {"q": "Quale di questi è un iperparametro?", "o": ["I pesi W", "I bias b", "Il learning rate", "Gli score di output", "Gli score delle classi"], "e": "lo imposti tu; pesi e bias sono parameters."}, "en": {"q": "Which of these is a hyperparameter?", "o": ["The weights W", "The biases b", "The learning rate", "The output scores", "The class scores"], "e": "you set it; weights and biases are parameters."}}, {"id": 2, "ch": 1, "a": "B", "it": {"q": "L'image segmentation, secondo le slide, è un problema di:", "o": ["Univariate regression", "Multivariate binary classification", "Multiclass classification univariata", "Unsupervised clustering", "Multivariate regression"], "e": "un output per pixel (multivariate), due classi."}, "en": {"q": "According to the slides, image segmentation is a problem of:", "o": ["Univariate regression", "Multivariate binary classification", "Univariate multiclass classification", "Unsupervised clustering", "Multivariate regression"], "e": "one output per pixel (multivariate), two classes."}}, {"id": 3, "ch": 1, "a": "A", "it": {"q": "La depth estimation è un problema di:", "o": ["Multivariate regression", "Binary classification", "Univariate regression", "Multiclass classification", "Unsupervised clustering"], "e": "tanti output continui."}, "en": {"q": "Depth estimation is a problem of:", "o": ["Multivariate regression", "Binary classification", "Univariate regression", "Multiclass classification", "Unsupervised clustering"], "e": "many continuous outputs."}}, {"id": 4, "ch": 1, "a": "D", "it": {"q": "Quale abbinamento esempio–rete è quello delle slide?", "o": ["Text classification – RNN", "Music genre classification – Transformer", "Graph regression – Convolutional network", "Image classification – Convolutional network", "Pose estimation – Recurrent network"], "e": "text → Transformer, musica → RNN, grafi → GNN."}, "en": {"q": "Which example–network pairing is the one in the slides?", "o": ["Text classification – RNN", "Music genre classification – Transformer", "Graph regression – Convolutional network", "Image classification – Convolutional network", "Pose estimation – Recurrent network"], "e": "text → Transformer, music → RNN, graphs → GNN."}}, {"id": 5, "ch": 1, "a": "B", "it": {"q": "L'unsupervised learning è usato tipicamente per:", "o": ["Classificazione binaria", "Clustering, noise reduction, dimension reduction", "Regressione multivariata", "Massimizzare un reward", "Predire una label continua"], "e": "Senza label non si può fare classificazione né regressione; il reward appartiene al reinforcement learning."}, "en": {"q": "Unsupervised learning is typically used for:", "o": ["Binary classification", "Clustering, noise reduction, dimension reduction", "Multivariate regression", "Maximizing a reward", "Predicting a continuous label"], "e": "Without labels you cannot do classification or regression; rewards belong to reinforcement learning."}}, {"id": 6, "ch": 1, "a": "C", "it": {"q": "Nel reinforcement learning:", "o": ["Si riceve un dataset etichettato", "Si riceve un dataset non etichettato", "Non si riceve un dataset: si esplora l'ambiente per raccogliere dati", "Non esistono reward", "L'ambiente fornisce l'azione corretta per ogni stato"], "e": "Nessun dataset: l'agente esplora l'ambiente e raccoglie i dati mentre agisce."}, "en": {"q": "In reinforcement learning:", "o": ["You receive a labeled dataset", "You receive an unlabeled dataset", "You receive no dataset: you explore the environment to gather data", "There are no rewards", "The environment provides the correct action for every state"], "e": "No dataset: the agent explores the environment and gathers data as it goes."}}, {"id": 7, "ch": 1, "a": "B", "it": {"q": "Il \"temporal credit assignment problem\" riguarda:", "o": ["La scelta del batch size", "Capire quale azione passata ha causato il reward", "Il bilanciamento tra training e test set", "La scelta tra esplorare e sfruttare", "Assegnare un learning rate a ogni layer"], "e": "Il temporal credit assignment è capire se il reward dipende da questa mossa o da decisioni prese molto prima. Scegliere se esplorare o sfruttare è invece l'exploration-exploitation trade-off."}, "en": {"q": "The \"temporal credit assignment problem\" is about:", "o": ["Choosing the batch size", "Understanding which past action caused the reward", "Balancing training and test sets", "Choosing between exploring and exploiting", "Assigning a learning rate to each layer"], "e": "Temporal credit assignment is working out whether the reward comes from this move or from decisions made long before. Choosing whether to explore or exploit is the exploration-exploitation trade-off instead."}}, {"id": 8, "ch": 1, "a": "C", "it": {"q": "Nel k-NN per la regressione l'output è:", "o": ["La classe più frequente tra i k vicini", "La mediana delle distanze", "La media dei valori dei k vicini", "Il valore del vicino più lontano", "Solo la label del vicino più vicino"], "e": "Nel k-NN per la regressione si fa la media dei valori dei k vicini; il voto di maggioranza vale per la classificazione."}, "en": {"q": "In k-NN regression the output is:", "o": ["The most common class among the k neighbors", "The median of the distances", "The average of the values of the k neighbors", "The value of the farthest neighbor", "The label of the nearest neighbor only"], "e": "In k-NN regression you average the values of the k neighbors; the majority vote is for classification."}}, {"id": 9, "ch": 1, "a": "A", "it": {"q": "Il classificatore 1-NN valutato sui dati di training:", "o": ["Ha accuratezza perfetta", "Ha accuratezza casuale", "È sempre peggiore del 5-NN", "Non si può valutare", "Ha la stessa accuratezza del test set"], "e": "ogni punto è il vicino più prossimo di sé stesso."}, "en": {"q": "The 1-NN classifier evaluated on the training data:", "o": ["Has perfect accuracy", "Has random accuracy", "Is always worse than 5-NN", "Cannot be evaluated", "Has the same accuracy as on the test set"], "e": "each point is its own nearest neighbor."}}, {"id": 10, "ch": 1, "a": "B", "it": {"q": "Il k-NN è un metodo:", "o": ["Parametrico, con k appreso", "Non parametrico", "Di reinforcement learning", "Generativo", "Addestrato con la backpropagation"], "e": "Non impara pesi: memorizza i dati di training. $k$ è un iperparametro scelto da te."}, "en": {"q": "k-NN is a method that is:", "o": ["Parametric, with k learned", "Non-parametric", "Reinforcement learning", "Generative", "Trained with backpropagation"], "e": "It learns no weights: it stores the training data. $k$ is a hyperparameter you set."}}, {"id": 110, "ch": 1, "a": "C", "it": {"q": "La pose estimation è un problema di:", "o": ["Unsupervised clustering", "Multiclass classification", "Multivariate regression", "Binary classification", "Univariate regression"], "e": "L'output sono le coordinate continue di molti giunti del corpo: tanti output reali. Si usa una convolutional encoder-decoder network."}, "en": {"q": "Pose estimation is a problem of:", "o": ["Unsupervised clustering", "Multiclass classification", "Multivariate regression", "Binary classification", "Univariate regression"], "e": "The output is the continuous coordinates of many body joints: many real-valued outputs. A convolutional encoder-decoder network is used."}}, {"id": 111, "ch": 1, "a": "D", "it": {"q": "Classificare il genere musicale di un brano (classica, jazz, pop, metal…) è un problema di:", "o": ["Univariate regression", "Binary classification", "Multivariate regression", "Multiclass classification", "Unsupervised clustering"], "e": "Le classi sono discrete e più di due. Nelle slide la rete abbinata è una RNN."}, "en": {"q": "Classifying the genre of a song (classical, jazz, pop, metal…) is a problem of:", "o": ["Univariate regression", "Binary classification", "Multivariate regression", "Multiclass classification", "Unsupervised clustering"], "e": "Classes are discrete and more than two. In the slides the matching network is an RNN."}}, {"id": 112, "ch": 1, "a": "A", "it": {"q": "Nel linguaggio del corso, \"multivariate\" significa:", "o": ["Più di un output", "Più di un hidden layer", "Più di due classi", "Più di un input", "Più di un campione di training"], "e": "Univariate = un output, multivariate = più output. Il numero di classi distingue binary da multiclass, non univariate da multivariate."}, "en": {"q": "In the course's terms, \"multivariate\" means:", "o": ["More than one output", "More than one hidden layer", "More than two classes", "More than one input", "More than one training sample"], "e": "Univariate = one output, multivariate = several outputs. The number of classes separates binary from multiclass, not univariate from multivariate."}}, {"id": 113, "ch": 1, "a": "B", "it": {"q": "Quale di questi è un modello che impara la distribuzione dei dati (PGM), come citato nelle slide?", "o": ["k-Nearest Neighbors", "Diffusion model", "Classificatore lineare", "Logistic regression", "Support Vector Machine"], "e": "Le slide citano variational autoencoders, normalizing flows e diffusion models come modelli che imparano una distribuzione sui dati; le GAN come modelli generativi."}, "en": {"q": "Which of these is a model that learns a distribution over data (PGM), as listed in the slides?", "o": ["k-Nearest Neighbors", "Diffusion model", "Linear classifier", "Logistic regression", "Support Vector Machine"], "e": "The slides list variational autoencoders, normalizing flows and diffusion models as models that learn a distribution over data; GANs as generative models."}}, {"id": 114, "ch": 1, "a": "C", "it": {"q": "L'exploration-exploitation trade-off nel reinforcement learning riguarda:", "o": ["Quale azione passata ha causato il reward", "La scelta del batch size", "Se usare una strategia che già funziona o provarne altre sperando in meglio", "Il bilanciamento tra training e test set", "La scelta del numero di layer"], "e": "Esempio delle slide: se ho trovato una buona apertura negli scacchi, la uso sempre o provo altro? \"Quale azione ha causato il reward\" è invece il temporal credit assignment."}, "en": {"q": "The exploration-exploitation trade-off in reinforcement learning is about:", "o": ["Which past action caused the reward", "Choosing the batch size", "Whether to use a strategy that already works or try others hoping for better", "Balancing training and test sets", "Choosing the number of layers"], "e": "Slide example: if I found a good chess opening, do I always use it or try something else? \"Which action caused the reward\" is temporal credit assignment instead."}}, {"id": 115, "ch": 1, "a": "D", "it": {"q": "Nell'esempio degli scacchi, le \"actions\" sono:", "o": ["I pezzi presi all'avversario", "Le partite vinte", "Gli stati validi della scacchiera", "Le mosse valide in un dato momento", "I reward ricevuti"], "e": "States = configurazioni valide della scacchiera; actions = mosse valide; rewards = positivi se prendi pezzi, negativi se li perdi."}, "en": {"q": "In the chess example, the \"actions\" are:", "o": ["The pieces taken from the opponent", "The games won", "The valid board states", "The valid moves at a given time", "The rewards received"], "e": "States = valid board configurations; actions = valid moves; rewards = positive for taking pieces, negative for losing them."}}, {"id": 116, "ch": 1, "a": "A", "it": {"q": "Perché il reinforcement learning è definito \"stochastic\"?", "o": ["Facendo la stessa mossa due volte, l'avversario può rispondere in modo diverso", "Perché i pesi sono inizializzati a caso", "Perché usa minibatch casuali", "Perché non ha una loss", "Perché il reward è sempre zero"], "e": "Sia le transizioni sia i reward sono stocastici: l'avversario può prendere o non prendere il tuo pezzo."}, "en": {"q": "Why is reinforcement learning called \"stochastic\"?", "o": ["If you make the same move twice, the opponent may respond differently", "Because weights are initialized randomly", "Because it uses random minibatches", "Because it has no loss", "Because the reward is always zero"], "e": "Both transitions and rewards are stochastic: the opponent may or may not take your piece."}}, {"id": 117, "ch": 1, "a": "B", "it": {"q": "Secondo le slide, cos'è il \"Deep Learning\"?", "o": ["Un tipo di reinforcement learning", "Il fitting di deep neural network, una famiglia di equazioni molto flessibile", "Un metodo per scegliere gli iperparametri", "Qualsiasi algoritmo non supervisionato", "Un metodo di clustering per immagini"], "e": "Un modello supervisionato è un'equazione che lega input e output; le deep neural network sono una famiglia molto flessibile di equazioni, e \"fittarle\" è il deep learning."}, "en": {"q": "According to the slides, what is \"Deep Learning\"?", "o": ["A type of reinforcement learning", "Fitting deep neural networks, a very flexible family of equations", "A method to choose hyperparameters", "Any unsupervised algorithm", "A clustering method for images"], "e": "A supervised model is an equation relating input and output; deep neural networks are a very flexible family of equations, and fitting them is deep learning."}}, {"id": 118, "ch": 1, "a": "C", "it": {"q": "Gli iperparametri del k-NN indicati nelle slide sono:", "o": ["Il numero di layer e di neuroni", "Il learning rate e il batch size", "Il numero di vicini k e la distanza (L1 o L2)", "I pesi W e i bias b", "Momentum e probabilità di dropout"], "e": "Sono problem dependent e vanno scelti, per esempio con un validation set. Il k-NN non ha pesi da apprendere."}, "en": {"q": "The k-NN hyperparameters given in the slides are:", "o": ["Number of layers and neurons", "Learning rate and batch size", "The number of neighbors k and the distance (L1 or L2)", "Weights W and biases b", "Momentum and dropout probability"], "e": "They are problem dependent and must be chosen, e.g. with a validation set. k-NN has no weights to learn."}}, {"id": 119, "ch": 1, "a": "D", "it": {"q": "L'idea dell'unsupervised learning presentata nelle slide è:", "o": ["Ridurre il learning rate durante il training", "Massimizzare un reward esplorando l'ambiente", "Etichettare automaticamente il test set", "Imparare la \"grammatica\" dei dati da enormi quantità di esempi non etichettati, per facilitare il compito supervisionato", "Usare meno parametri di un modello supervisionato"], "e": "Gli esempi non etichettati sono disponibili in quantità gigantesche; conoscere le \"regole\" degli output possibili rende più facile il supervised learning."}, "en": {"q": "The idea of unsupervised learning presented in the slides is:", "o": ["Reducing the learning rate during training", "Maximizing a reward by exploring the environment", "Automatically labeling the test set", "Learning the \"grammar\" of the data from huge amounts of unlabeled examples, to make the supervised task easier", "Using fewer parameters than a supervised model"], "e": "Unlabeled examples are available in gargantuan amounts; knowing the \"rules\" of possible outputs makes supervised learning easier."}}, {"id": 11, "ch": 2, "a": "B", "it": {"q": "In CIFAR-10 un'immagine stirata in vettore ha quanti numeri?", "o": ["1024", "3072", "784", "10", "32"], "e": "$32\\cdot 32\\cdot 3$."}, "en": {"q": "In CIFAR-10, an image stretched into a vector has how many numbers?", "o": ["1024", "3072", "784", "10", "32"], "e": "$32\\cdot 32\\cdot 3$."}}, {"id": 12, "ch": 2, "a": "B", "it": {"q": "Per un classificatore lineare su CIFAR-10, W ha dimensione:", "o": ["3072 × 10", "10 × 3072", "32 × 32", "10 × 10", "3 × 10"], "e": "10 righe (classi) × 3072 colonne."}, "en": {"q": "For a linear classifier on CIFAR-10, W has size:", "o": ["3072 × 10", "10 × 3072", "32 × 32", "10 × 10", "3 × 10"], "e": "10 rows (classes) × 3072 columns."}}, {"id": 13, "ch": 2, "a": "B", "it": {"q": "Il \"bias trick\" consiste nel:", "o": ["Eliminare il bias", "Aggiungere un 1 al vettore dei dati e assorbire b in una colonna di W", "Inizializzare il bias a 0.01", "Sottrarre la media dai dati", "Raddoppiare il bias a ogni layer"], "e": "Con un 1 in più nel vettore dei dati, $b$ diventa l'ultima colonna di $W$ (nell'esempio $W$ passa da 3×4 a 3×5)."}, "en": {"q": "The \"bias trick\" consists of:", "o": ["Removing the bias", "Adding a 1 to the data vector and absorbing b into a column of W", "Initializing the bias to 0.01", "Subtracting the mean from the data", "Doubling the bias at every layer"], "e": "With an extra 1 in the data vector, $b$ becomes the last column of $W$ (in the example $W$ goes from 3×4 to 3×5)."}}, {"id": 14, "ch": 2, "a": "A", "it": {"q": "Nel visual viewpoint un classificatore lineare:", "o": ["Impara un template per classe", "Impara più template per classe", "Taglia lo spazio con curve", "Non usa i pesi", "Impara un template per ogni pixel"], "e": "un solo template per classe: è il suo limite."}, "en": {"q": "In the visual viewpoint, a linear classifier:", "o": ["Learns one template per class", "Learns several templates per class", "Cuts the space with curves", "Does not use weights", "Learns one template per pixel"], "e": "only one template per class: that is its limitation."}}, {"id": 15, "ch": 2, "a": "B", "it": {"q": "Quale caso NON è separabile da un classificatore lineare?", "o": ["Due nuvole di punti ben distanti", "Classe 1 nel primo e terzo quadrante, classe 2 negli altri", "Punti separati da una retta", "Punti separati da un iperpiano", "Due classi divise dalla retta verticale $x_1 = 0$"], "e": "configurazione tipo XOR."}, "en": {"q": "Which case is NOT separable by a linear classifier?", "o": ["Two well-separated clouds of points", "Class 1 in the first and third quadrants, class 2 in the others", "Points separated by a line", "Points separated by a hyperplane", "Two classes split by the vertical line $x_1 = 0$"], "e": "XOR-like configuration."}}, {"id": 16, "ch": 2, "a": "C", "it": {"q": "Se $f(x,W)=Wx$ e moltiplico l'immagine per 0.5, gli score:", "o": ["Restano uguali", "Raddoppiano", "Si dimezzano", "Diventano zero", "Cambiano segno"], "e": "$f(cx) = c\\cdot f(x)$."}, "en": {"q": "If $f(x,W)=Wx$ and I multiply the image by 0.5, the scores:", "o": ["Stay the same", "Double", "Halve", "Become zero", "Change sign"], "e": "$f(cx) = c\\cdot f(x)$."}}, {"id": 17, "ch": 2, "a": "B", "it": {"q": "Una loss function alta indica:", "o": ["Un buon classificatore", "Un cattivo classificatore", "Un learning rate basso", "Overfitting", "Che l'underfitting è impossibile"], "e": "Loss bassa = buon classificatore, loss alta = cattivo. Da sola non dice nulla sull'overfitting."}, "en": {"q": "A high loss indicates:", "o": ["A good classifier", "A bad classifier", "A low learning rate", "Overfitting", "Underfitting is impossible"], "e": "Low loss = good classifier, high loss = bad. On its own it says nothing about overfitting."}}, {"id": 18, "ch": 2, "a": "B", "it": {"q": "Rispetto alla linear regression, la logistic regression:", "o": ["Può predire valori oltre il range dei dati", "Garantisce predizioni in [0,1]", "Non ha una loss", "È non supervisionata", "Non si può addestrare con il gradient descent"], "e": "La sigmoid schiaccia l'output in [0,1]; la linear regression può uscire dal range dei dati."}, "en": {"q": "Compared with linear regression, logistic regression:", "o": ["Can predict values beyond the range of the data", "Guarantees predictions within [0,1]", "Has no loss", "Is unsupervised", "Cannot be trained with gradient descent"], "e": "The sigmoid squashes the output into [0,1]; linear regression can exceed the range of the data."}}, {"id": 120, "ch": 2, "a": "A", "it": {"q": "Quante immagini di training contiene CIFAR-10?", "o": ["50.000", "10.000", "60.000", "1.000.000", "100.000"], "e": "CIFAR-10: 50.000 immagini di training e 10.000 di test, ciascuna 32×32×3, 10 classi."}, "en": {"q": "How many training images does CIFAR-10 contain?", "o": ["50,000", "10,000", "60,000", "1,000,000", "100,000"], "e": "CIFAR-10: 50,000 training and 10,000 test images, each 32×32×3, 10 classes."}}, {"id": 121, "ch": 2, "a": "B", "it": {"q": "Immagine 2×2 (4 pixel), 3 classi, con il bias trick. Che dimensione ha W?", "o": ["5 × 3", "3 × 5", "4 × 3", "3 × 4", "4 × 5"], "e": "Senza bias trick W è 3×4 e b ha 3 elementi. Aggiungendo un 1 al vettore dei dati, b diventa una colonna in più: 3×5."}, "en": {"q": "2×2 image (4 pixels), 3 classes, with the bias trick. What size is W?", "o": ["5 × 3", "3 × 5", "4 × 3", "3 × 4", "4 × 5"], "e": "Without the bias trick W is 3×4 and b has 3 elements. Adding a 1 to the data vector turns b into one more column: 3×5."}}, {"id": 122, "ch": 2, "a": "C", "it": {"q": "Perché il template del cavallo appreso da un classificatore lineare sembra avere due teste?", "o": ["Perché il learning rate era troppo alto", "Perché CIFAR-10 contiene immagini duplicate", "Un solo template per classe non riesce a catturare più modi dei dati (cavalli rivolti a destra e a sinistra)", "Perché manca il bias", "Perché la rete ha troppi layer"], "e": "Visual viewpoint: ogni riga di W è un template. Con un solo template per classe, i diversi \"modi\" della classe si sovrappongono."}, "en": {"q": "Why does the horse template learned by a linear classifier seem to have two heads?", "o": ["Because the learning rate was too high", "Because CIFAR-10 contains duplicate images", "A single template per class cannot capture multiple modes of the data (horses facing left and right)", "Because the bias is missing", "Because the network has too many layers"], "e": "Visual viewpoint: each row of W is a template. With one template per class, the different \"modes\" of the class blend together."}}, {"id": 123, "ch": 2, "a": "D", "it": {"q": "Nel geometric viewpoint, l'insieme dei punti in cui lo score di una classe vale 0 è:", "o": ["Una sfera centrata nell'origine", "Un singolo punto", "Una curva non lineare", "Un iperpiano nello spazio dei pixel", "Un cerchio intorno al template della classe"], "e": "Lo score è lineare nei pixel, quindi score = 0 è un iperpiano; lo score cresce in una direzione perpendicolare. I classificatori lineari tagliano lo spazio con iperpiani."}, "en": {"q": "In the geometric viewpoint, the set of points where a class score is 0 is:", "o": ["A sphere centered at the origin", "A single point", "A non-linear curve", "A hyperplane in pixel space", "A circle around the class template"], "e": "The score is linear in the pixels, so score = 0 is a hyperplane; the score increases in a perpendicular direction. Linear classifiers carve up space with hyperplanes."}}, {"id": 124, "ch": 2, "a": "A", "it": {"q": "Quale di questi casi è difficile per un classificatore lineare?", "o": ["Classe 1: punti con $1 \\le \\|x\\|_2 \\le 2$ (un anello); classe 2: tutto il resto", "Due nuvole di punti lontane", "Due classi separate da una retta", "Due classi separate da un iperpiano", "Due classi ai lati opposti di un piano"], "e": "Un anello non si separa con un iperpiano. Gli altri casi difficili delle slide: quadranti opposti (tipo XOR) e una classe con tre modi."}, "en": {"q": "Which of these cases is hard for a linear classifier?", "o": ["Class 1: points with $1 \\le \\|x\\|_2 \\le 2$ (a ring); class 2: everything else", "Two distant point clouds", "Two classes separated by a line", "Two classes separated by a hyperplane", "Two classes on opposite sides of a plane"], "e": "A ring cannot be separated by a hyperplane. The other hard cases in the slides: opposite quadrants (XOR-like) and a class with three modes."}}, {"id": 125, "ch": 2, "a": "B", "it": {"q": "Il negativo di una loss function viene anche chiamato:", "o": ["Cost function", "Reward, profit, utility o fitness function", "Objective function", "Gradient", "Hinge loss"], "e": "Loss = objective function = cost function (da minimizzare). Il suo negativo, da massimizzare, è reward / profit / utility / fitness function."}, "en": {"q": "The negative of a loss function is also called:", "o": ["Cost function", "Reward, profit, utility or fitness function", "Objective function", "Gradient", "Hinge loss"], "e": "Loss = objective function = cost function (to minimize). Its negative, to maximize, is the reward / profit / utility / fitness function."}}, {"id": 126, "ch": 2, "a": "C", "it": {"q": "Perché i contagi da coronavirus si modellano bene con una curva logistica?", "o": ["Perché sono variabili binarie", "Perché non hanno un limite superiore", "Crescono in modo esponenziale all'inizio e poi si stabilizzano, perché non possono superare la popolazione", "Perché crescono sempre linearmente", "Perché diminuiscono nel tempo"], "e": "\"The model matters\": i contagi hanno un tetto (la popolazione), i prezzi delle case invece no. Ogni caso richiede il modello adatto."}, "en": {"q": "Why are coronavirus infections modeled well by a logistic curve?", "o": ["Because they are binary variables", "Because they have no upper bound", "They grow exponentially at first and then plateau, since they cannot exceed the population", "Because they always grow linearly", "Because they decrease over time"], "e": "\"The model matters\": infections have a ceiling (the population), housing prices do not. Each case needs the right model."}}, {"id": 127, "ch": 2, "a": "D", "it": {"q": "Quali sono i due passi per scegliere una buona W?", "o": ["Inizializzare W a zero, poi aumentare il batch size", "Calcolare W con il k-NN", "Scegliere W a caso e valutarla sul test set", "Definire una loss che misuri quanto è buona W, poi trovare la W che la minimizza", "Usare dropout, poi data augmentation"], "e": "1) Loss function per quantificare la bontà di W. 2) Optimization: trovare la W che minimizza la loss."}, "en": {"q": "What are the two steps to choose a good W?", "o": ["Initialize W to zero, then increase the batch size", "Compute W with k-NN", "Pick W at random and evaluate it on the test set", "Define a loss that measures how good W is, then find the W that minimizes it", "Use dropout, then data augmentation"], "e": "1) A loss function to quantify how good W is. 2) Optimization: find the W that minimizes the loss."}}, {"id": 19, "ch": 3, "a": "B", "it": {"q": "$f = W_2 W_1 x$ senza attivazione:", "o": ["È una rete a 2 layer non lineare", "È ancora una funzione lineare", "È un universal approximator", "Non è calcolabile", "Equivale a una rete con ReLU"], "e": "$W_2W_1$ è un'unica matrice."}, "en": {"q": "$f = W_2 W_1 x$ with no activation:", "o": ["Is a non-linear 2-layer network", "Is still a linear function", "Is a universal approximator", "Cannot be computed", "Is equivalent to a ReLU network"], "e": "$W_2W_1$ is a single matrix."}}, {"id": 20, "ch": 3, "a": "B", "it": {"q": "Il teorema di universal approximation dice che:", "o": ["Servono almeno 10 hidden layer", "Un solo hidden layer con abbastanza neuroni può approssimare qualsiasi funzione continua su un compatto", "Le reti profonde non servono", "La backprop trova sempre i pesi giusti", "Si possono approssimare solo funzioni lineari"], "e": "ma imparare i pesi resta difficile e le reti profonde sono più compatte."}, "en": {"q": "The universal approximation theorem states that:", "o": ["At least 10 hidden layers are needed", "A single hidden layer with enough neurons can approximate any continuous function on a compact set", "Deep networks are useless", "Backprop always finds the right weights", "Only linear functions can be approximated"], "e": "but learning the weights remains hard and deep networks are more compact."}}, {"id": 21, "ch": 3, "a": "C", "it": {"q": "Rete con 3 input, un hidden layer da 4 neuroni e 2 output (con bias): quanti parametri?", "o": ["20", "24", "26", "14", "18"], "e": "$(4\\cdot 3+4) + (2\\cdot 4+2) = 16 + 10$."}, "en": {"q": "Network with 3 inputs, one hidden layer of 4 neurons and 2 outputs (with biases): how many parameters?", "o": ["20", "24", "26", "14", "18"], "e": "$(4\\cdot 3+4) + (2\\cdot 4+2) = 16 + 10$."}}, {"id": 22, "ch": 3, "a": "B", "it": {"q": "Quale attivazione è zero-centered ma satura?", "o": ["Sigmoid", "tanh", "ReLU", "Leaky ReLU", "Maxout"], "e": "tanh è centrata in zero ma satura ai due estremi. La sigmoid satura e non è zero-centered; ReLU non satura per x>0."}, "en": {"q": "Which activation is zero-centered but saturates?", "o": ["Sigmoid", "tanh", "ReLU", "Leaky ReLU", "Maxout"], "e": "tanh is zero-centered but saturates at both ends. Sigmoid saturates and is not zero-centered; ReLU does not saturate for x>0."}}, {"id": 23, "ch": 3, "a": "A", "it": {"q": "Lo svantaggio dell'output sempre positivo della sigmoid è:", "o": ["I gradienti dei pesi hanno tutti lo stesso segno", "La rete diventa lineare", "La loss diventa negativa", "Il softmax non è applicabile", "Gli output possono superare 1"], "e": "update tutti nella stessa direzione (zig-zag)."}, "en": {"q": "The disadvantage of the sigmoid's always-positive output is:", "o": ["The weight gradients all have the same sign", "The network becomes linear", "The loss becomes negative", "Softmax cannot be applied", "Outputs can exceed 1"], "e": "updates all in the same direction (zig-zag)."}}, {"id": 24, "ch": 3, "a": "B", "it": {"q": "Il problema \"dead ReLU\" si verifica quando:", "o": ["La ReLU satura a 1", "Il neurone restituisce sempre 0 e il suo gradiente è 0", "Il learning rate è troppo basso", "Si usa il softmax", "Il learning rate è troppo piccolo per muovere i pesi"], "e": "Se l'input è sempre $\\le 0$ la ReLU restituisce 0 e la sua derivata è 0: il neurone non si aggiorna più."}, "en": {"q": "The \"dead ReLU\" problem occurs when:", "o": ["ReLU saturates at 1", "The neuron always outputs 0 and its gradient is 0", "The learning rate is too low", "Softmax is used", "The learning rate is too small to move the weights"], "e": "If the input is always $\\le 0$, ReLU outputs 0 and its derivative is 0: the neuron stops updating."}}, {"id": 25, "ch": 3, "a": "A", "it": {"q": "Un rimedio suggerito per i dead ReLU è:", "o": ["Inizializzare i bias a un piccolo valore positivo (0.01)", "Inizializzare i pesi a zero", "Usare la sigmoid", "Aumentare il batch size", "Usare un learning rate più grande"], "e": "Un bias leggermente positivo rende probabile che la ReLU resti attiva per la maggior parte degli input."}, "en": {"q": "A suggested remedy for dead ReLUs is:", "o": ["Initializing biases to a small positive value (0.01)", "Initializing weights to zero", "Using sigmoid", "Increasing the batch size", "Using a larger learning rate"], "e": "A slightly positive bias makes it likely that the ReLU stays active for most inputs."}}, {"id": 26, "ch": 3, "a": "C", "it": {"q": "Lo svantaggio di Maxout è:", "o": ["Satura", "Muore", "Aumenta il numero di parametri", "Non è lineare a tratti", "Non è differenziabile da nessuna parte"], "e": "Maxout prende il massimo tra più funzioni lineari, ognuna con i propri pesi: più parametri per neurone."}, "en": {"q": "The drawback of Maxout is:", "o": ["It saturates", "It dies", "It increases the number of parameters", "It is not piecewise linear", "It is not differentiable anywhere"], "e": "Maxout takes the maximum of several linear functions, each with its own weights: more parameters per neuron."}}, {"id": 27, "ch": 3, "a": "C", "it": {"q": "Il softmax:", "o": ["Si applica a ciascun neurone indipendentemente", "È invariante per scala", "Produce valori in (0,1) che sommano a 1", "Si usa con classi non mutuamente esclusive", "Si usa in ogni hidden layer"], "e": "agisce su tutti gli output insieme, non è invariante per scala, richiede classi mutuamente esclusive."}, "en": {"q": "Softmax:", "o": ["Is applied to each neuron independently", "Is scale invariant", "Produces values in (0,1) that sum to 1", "Is used with non-mutually-exclusive classes", "Is used in every hidden layer"], "e": "it acts on all outputs together, is not scale invariant, requires mutually exclusive classes."}}, {"id": 28, "ch": 3, "a": "B", "it": {"q": "Il softmax è un'approssimazione liscia di:", "o": ["max", "arg max", "ReLU", "media", "sigmoid"], "e": "Il nome inganna: approssima l'arg max (quale indice ha il valore massimo), non il max."}, "en": {"q": "Softmax is a smooth approximation of:", "o": ["max", "arg max", "ReLU", "mean", "sigmoid"], "e": "The name is misleading: it approximates arg max (which index holds the maximum), not max."}}, {"id": 29, "ch": 3, "a": "B", "it": {"q": "Il softmax è:", "o": ["Invariante per traslazione e per scala", "Invariante per traslazione ma non per scala", "Invariante per scala ma non per traslazione", "Nessuna delle due", "Invariante solo a permutazioni dell'input"], "e": "Sommare una costante a tutti gli score non cambia l'output; moltiplicarli per una costante sì."}, "en": {"q": "Softmax is:", "o": ["Invariant under translation and scaling", "Invariant under translation but not scaling", "Invariant under scaling but not translation", "Neither", "Invariant only to permutations of the input"], "e": "Adding a constant to all scores does not change the output; multiplying them by a constant does."}}, {"id": 30, "ch": 3, "a": "C", "it": {"q": "Secondo la \"quick guide\", la scelta standard per gli hidden layer è:", "o": ["Sigmoid", "tanh", "ReLU", "Softmax", "Lineare (nessuna attivazione)"], "e": "ReLU è lo standard; la sigmoid non si usa quasi più, tanh serve nelle reti ricorrenti, il softmax sta solo in output."}, "en": {"q": "According to the \"quick guide\", the standard choice for hidden layers is:", "o": ["Sigmoid", "tanh", "ReLU", "Softmax", "Linear (no activation)"], "e": "ReLU is the standard; sigmoid is not really used, tanh is for recurrent nets, softmax only sits at the output."}}, {"id": 31, "ch": 3, "a": "B", "it": {"q": "Rispetto al perceptron originale, il neurone moderno:", "o": ["Elimina i pesi", "Aggiunge il bias e sostituisce la soglia con un'activation function", "Usa solo output binari", "Non somma gli input", "Elimina l'attivazione e usa solo la soglia"], "e": "Si aggiunge il bias come input in più e il passo soglia-e-output diventa una activation function a valori reali."}, "en": {"q": "Compared with the original perceptron, the modern neuron:", "o": ["Removes the weights", "Adds the bias and replaces the threshold with an activation function", "Uses only binary outputs", "Does not sum the inputs", "Removes the activation and uses only the threshold"], "e": "The bias is added as one more input and the test-and-output step becomes a real-valued activation function."}}, {"id": 128, "ch": 3, "a": "A", "it": {"q": "Rete a 2 layer $f = W_2 \\max(0, W_1 x)$ con input 128×128 = 16384, hidden layer da 1000 e 10 output. Che dimensione ha $W_1$?", "o": ["1000 × 16384", "1000 × 10", "10 × 1000", "16384 × 1000", "10 × 16384"], "e": "$W_1$ trasforma l'input (16384) nel hidden layer (1000): righe = neuroni di uscita, colonne = input. $W_2$ è 10 × 1000."}, "en": {"q": "2-layer network $f = W_2 \\max(0, W_1 x)$ with input 128×128 = 16384, hidden layer of 1000 and 10 outputs. What size is $W_1$?", "o": ["1000 × 16384", "1000 × 10", "10 × 1000", "16384 × 1000", "10 × 16384"], "e": "$W_1$ maps the input (16384) to the hidden layer (1000): rows = output neurons, columns = inputs. $W_2$ is 10 × 1000."}}, {"id": 129, "ch": 3, "a": "B", "it": {"q": "Secondo le slide, perché si preferiscono reti profonde a reti con un solo hidden layer molto largo?", "o": ["Le reti larghe non si possono addestrare con la backprop", "Le reti profonde approssimano molte funzioni in modo molto più compatto", "Le reti profonde non hanno bisogno di attivazioni", "Le reti con un hidden layer non sono universal approximator", "Le reti profonde richiedono sempre meno dati"], "e": "Un solo hidden layer basta in teoria (universal approximation), ma potrebbe servire un numero assurdo di neuroni; più profondità dà rappresentazioni più compatte."}, "en": {"q": "According to the slides, why are deep networks preferred to a single very wide hidden layer?", "o": ["Wide networks cannot be trained with backprop", "Deep networks approximate many functions much more compactly", "Deep networks need no activations", "Single-hidden-layer networks are not universal approximators", "Deep networks always need fewer training samples"], "e": "One hidden layer is enough in theory (universal approximation), but it may need an absurd number of neurons; depth gives more compact representations."}}, {"id": 130, "ch": 3, "a": "C", "it": {"q": "Le due caratteristiche di una buona activation function indicate nelle slide sono:", "o": ["Linearità e output positivo", "Assenza di parametri e saturazione", "Non-linearità e differenziabilità", "Output in [0,1] e simmetria", "Calcolo veloce e output in [−1, 1]"], "e": "Non-linearità per dare potere espressivo agli hidden layer; differenziabilità perché la backprop usa la derivata dell'attivazione."}, "en": {"q": "The two features of a good activation function given in the slides are:", "o": ["Linearity and positive output", "No parameters and saturation", "Non-linearity and differentiability", "Output in [0,1] and symmetry", "Fast computation and output in [−1, 1]"], "e": "Non-linearity to give hidden layers expressive power; differentiability because backprop uses the activation's derivative."}}, {"id": 131, "ch": 3, "a": "D", "it": {"q": "Perché la saturazione della sigmoid è un problema?", "o": ["Perché aumenta il numero di parametri", "Perché l'output diventa negativo", "Perché la sigmoid non è differenziabile", "Per input molto grandi o molto piccoli la derivata è quasi 0 e il gradiente svanisce", "Perché l'output non è limitato"], "e": "Nelle code la sigmoid è piatta: $\\sigma'(x) = \\sigma(x)(1-\\sigma(x)) \\to 0$. Il gradiente moltiplicato all'indietro diventa piccolissimo."}, "en": {"q": "Why is sigmoid saturation a problem?", "o": ["Because it increases the number of parameters", "Because the output becomes negative", "Because the sigmoid is not differentiable", "For very large or very small inputs the derivative is almost 0 and the gradient vanishes", "Because the output is not bounded"], "e": "In the tails the sigmoid is flat: $\\sigma'(x) = \\sigma(x)(1-\\sigma(x)) \\to 0$. The gradient multiplied backwards becomes tiny."}}, {"id": 132, "ch": 3, "a": "A", "it": {"q": "Quale NON è un vantaggio della ReLU indicato nelle slide?", "o": ["Output sempre centrato in zero", "Convergenza veloce", "Non satura per x > 0", "Gradienti grandi e costanti", "Il suo gradiente vale 1 per ogni input positivo"], "e": "La ReLU restituisce max(0,x) ≥ 0, quindi non è zero-centered. La funzione zero-centered è tanh."}, "en": {"q": "Which is NOT an advantage of ReLU given in the slides?", "o": ["Output always zero-centered", "Fast convergence", "Does not saturate for x > 0", "Large and consistent gradients", "Its gradient is 1 for every positive input"], "e": "ReLU outputs max(0,x) ≥ 0, so it is not zero-centered. The zero-centered function is tanh."}}, {"id": 133, "ch": 3, "a": "B", "it": {"q": "Leaky ReLU definita come $\\max(0.1x,\\ x)$. Quanto vale per x = −2?", "o": ["0.2", "$-0.2$", "$-2$", "0", "$-0.02$"], "e": "max(0.1·(−2), −2) = max(−0.2, −2) = −0.2. Per x negativo lascia passare un 10%: per questo non \"muore\"."}, "en": {"q": "Leaky ReLU defined as $\\max(0.1x,\\ x)$. What is its value at x = −2?", "o": ["0.2", "$-0.2$", "$-2$", "0", "$-0.02$"], "e": "max(0.1·(−2), −2) = max(−0.2, −2) = −0.2. For negative x it lets 10% through: that is why it does not \"die\"."}}, {"id": 134, "ch": 3, "a": "C", "it": {"q": "Un nodo ReLU riceve in input −3 e dall'alto un gradiente (upstream) di 5. Che gradiente passa all'indietro?", "o": ["5", "$-15$", "0", "$-3$", "15"], "e": "La derivata locale della ReLU è 1 se l'input è > 0, altrimenti 0. Qui l'input è negativo: 5 · 0 = 0."}, "en": {"q": "A ReLU node receives input −3 and an upstream gradient of 5. What gradient flows backwards?", "o": ["5", "$-15$", "0", "$-3$", "15"], "e": "ReLU's local derivative is 1 if the input is > 0, otherwise 0. Here the input is negative: 5 · 0 = 0."}}, {"id": 135, "ch": 3, "a": "D", "it": {"q": "Nella Parametric ReLU (PReLU), la pendenza per x negativo:", "o": ["È fissata a 0.1", "È scelta a caso a ogni epoca", "È sempre 0", "È un parametro appreso con la backprop", "È uguale al learning rate"], "e": "PReLU = $\\max(\\alpha x, x)$ con $\\alpha$ appreso: un parametro in più in cui fare backprop. La Leaky ReLU invece usa un valore fisso (0.1)."}, "en": {"q": "In Parametric ReLU (PReLU), the slope for negative x:", "o": ["Is fixed at 0.1", "Is chosen at random every epoch", "Is always 0", "Is a parameter learned with backprop", "Is equal to the learning rate"], "e": "PReLU = $\\max(\\alpha x, x)$ with $\\alpha$ learned: one more parameter to backprop into. Leaky ReLU instead uses a fixed value (0.1)."}}, {"id": 136, "ch": 3, "a": "A", "it": {"q": "Secondo la quick guide, quale attivazione richiedono tipicamente le reti ricorrenti?", "o": ["tanh o simili", "ReLU", "Maxout", "Softmax", "Solo sigmoid nell'output layer"], "e": "Quick guide: sigmoid quasi mai, ReLU standard, poi varianti di ReLU o Maxout; le reti ricorrenti richiedono tanh o simili."}, "en": {"q": "According to the quick guide, which activation do recurrent nets typically require?", "o": ["tanh or similar", "ReLU", "Maxout", "Softmax", "Sigmoid only in the output layer"], "e": "Quick guide: sigmoid hardly ever, ReLU standard, then ReLU variants or Maxout; recurrent nets require tanh or similar."}}, {"id": 137, "ch": 3, "a": "B", "it": {"q": "Softmax di [1, 1, 1]:", "o": ["$[0,\\ 0,\\ 1]$", "$[\\tfrac13,\\ \\tfrac13,\\ \\tfrac13]$", "$[1,\\ 1,\\ 1]$", "$[e,\\ e,\\ e]$", "$[\\tfrac12,\\ \\tfrac14,\\ \\tfrac14]$"], "e": "Valori uguali danno probabilità uguali: $e^1/(3e^1) = \\tfrac13$ ciascuno. La somma è 1."}, "en": {"q": "Softmax of [1, 1, 1]:", "o": ["$[0,\\ 0,\\ 1]$", "$[\\tfrac13,\\ \\tfrac13,\\ \\tfrac13]$", "$[1,\\ 1,\\ 1]$", "$[e,\\ e,\\ e]$", "$[\\tfrac12,\\ \\tfrac14,\\ \\tfrac14]$"], "e": "Equal values give equal probabilities: $e^1/(3e^1) = \\tfrac13$ each. They sum to 1."}}, {"id": 138, "ch": 3, "a": "C", "it": {"q": "Softmax di [2, 0]: quanto vale la prima componente, circa?", "o": ["1.00", "0.50", "0.88", "0.12", "2.00"], "e": "$\\dfrac{e^2}{e^2+e^0} = \\dfrac{7.39}{8.39} \\approx 0.88$. La seconda componente è $\\approx 0.12$."}, "en": {"q": "Softmax of [2, 0]: roughly what is the first component?", "o": ["1.00", "0.50", "0.88", "0.12", "2.00"], "e": "$\\dfrac{e^2}{e^2+e^0} = \\dfrac{7.39}{8.39} \\approx 0.88$. The second component is $\\approx 0.12$."}}, {"id": 139, "ch": 3, "a": "D", "it": {"q": "Quale uguaglianza è vera per il softmax?", "o": ["softmax([1,2,3]) = [1,2,3]/6", "softmax([1,2,3]) = [0,0,1]", "softmax([1,2,3]) = softmax([10,20,30])", "softmax([1,2,3]) = softmax([101,102,103])", "softmax([1,2,3]) = softmax([3,2,1])"], "e": "Il softmax è invariante per traslazione (sommare una costante a tutti gli score non cambia nulla) ma non per scala (moltiplicare cambia le probabilità)."}, "en": {"q": "Which equality holds for softmax?", "o": ["softmax([1,2,3]) = [1,2,3]/6", "softmax([1,2,3]) = [0,0,1]", "softmax([1,2,3]) = softmax([10,20,30])", "softmax([1,2,3]) = softmax([101,102,103])", "softmax([1,2,3]) = softmax([3,2,1])"], "e": "Softmax is invariant under translation (adding a constant to all scores changes nothing) but not under scaling (multiplying changes the probabilities)."}}, {"id": 140, "ch": 3, "a": "A", "it": {"q": "Un'immagine può contenere contemporaneamente un gatto e un cane. Il softmax sulle classi è adatto?", "o": ["No, perché il softmax richiede classi mutuamente esclusive", "Sì, ma solo con la ReLU", "Sì, il softmax gestisce più classi vere insieme", "No, perché il softmax funziona solo con 2 classi", "Sì, se gli score vengono moltiplicati per 10"], "e": "Il softmax distribuisce una probabilità totale di 1 tra le classi: presuppone che ne sia vera una sola."}, "en": {"q": "An image can contain a cat and a dog at the same time. Is softmax over the classes suitable?", "o": ["No, because softmax requires mutually exclusive classes", "Yes, but only with ReLU", "Yes, softmax handles several true classes together", "No, because softmax only works with 2 classes", "Yes, if the scores are scaled by 10"], "e": "Softmax shares a total probability of 1 among the classes: it assumes only one is true."}}, {"id": 141, "ch": 3, "a": "B", "it": {"q": "Cosa dimostrarono McCulloch e Pitts nel 1943?", "o": ["Che la backpropagation converge sempre", "Che reti di neuroni artificiali possono eseguire logica matematica", "Che una rete con un hidden layer è un universal approximator", "Che la ReLU è migliore della sigmoid", "Che i neuroni vanno addestrati con SGD"], "e": "Primo modello matematico del neurone: per ogni espressione logica che soddisfa certe condizioni esiste una rete che si comporta come essa descrive. Il perceptron arriva nel 1957."}, "en": {"q": "What did McCulloch and Pitts show in 1943?", "o": ["That backpropagation always converges", "That networks of artificial neurons can perform mathematical logic", "That a one-hidden-layer network is a universal approximator", "That ReLU is better than sigmoid", "That neurons should be trained with SGD"], "e": "First mathematical model of the neuron: for any logical expression meeting certain conditions there is a net behaving as it describes. The perceptron came in 1957."}}, {"id": 32, "ch": 4, "a": "B", "it": {"q": "L'ottimo della L1 loss è:", "o": ["La media", "La mediana", "La moda", "Il massimo", "Il minimo"], "e": "L2 → media, L1 → mediana."}, "en": {"q": "The optimum of the L1 loss is:", "o": ["The mean", "The median", "The mode", "The maximum", "The minimum"], "e": "L2 → mean, L1 → median."}}, {"id": 33, "ch": 4, "a": "B", "it": {"q": "Quale loss è più sensibile agli outlier?", "o": ["L1", "L2", "Sono uguali", "Hinge", "Cross-entropy"], "e": "l'errore è elevato al quadrato."}, "en": {"q": "Which loss is more sensitive to outliers?", "o": ["L1", "L2", "They are the same", "Hinge", "Cross-entropy"], "e": "the error is squared."}}, {"id": 34, "ch": 4, "a": "B", "it": {"q": "Classificazione multiclasse: output layer e loss tipici sono", "o": ["Sigmoid + MSE", "Softmax + cross-entropy", "ReLU + L1", "tanh + hinge", "Sigmoid + L1"], "e": "Il softmax trasforma gli score in probabilità; la cross-entropy penalizza −log della probabilità della classe vera. Sigmoid + binary cross-entropy è il caso binario."}, "en": {"q": "Multiclass classification: typical output layer and loss are", "o": ["Sigmoid + MSE", "Softmax + cross-entropy", "ReLU + L1", "tanh + hinge", "Sigmoid + L1"], "e": "Softmax turns scores into probabilities; cross-entropy penalizes −log of the true class probability. Sigmoid + binary cross-entropy is the binary case."}}, {"id": 35, "ch": 4, "a": "C", "it": {"q": "Score [3.2, 5.1, −1.7], classe vera la prima. La cross-entropy loss vale circa:", "o": ["0.13", "0.079", "2.04", "6.16", "1.0"], "e": "$-\\ln\\dfrac{e^{3.2}}{e^{3.2}+e^{5.1}+e^{-1.7}} = -\\ln(0.13) \\approx 2.04$. (0.13 è la probabilità, non la loss.)"}, "en": {"q": "Scores [3.2, 5.1, −1.7], true class is the first. The cross-entropy loss is about:", "o": ["0.13", "0.079", "2.04", "6.16", "1.0"], "e": "$-\\ln\\dfrac{e^{3.2}}{e^{3.2}+e^{5.1}+e^{-1.7}} = -\\ln(0.13) \\approx 2.04$. (0.13 is the probability, not the loss.)"}}, {"id": 36, "ch": 4, "a": "C", "it": {"q": "Con softmax e C classi, a inizio training la loss dovrebbe essere circa:", "o": ["0", "1", "$\\log C$", "$C$", "$1/C$"], "e": "probabilità uniformi 1/C → −log(1/C) = log C."}, "en": {"q": "With softmax and C classes, at the start of training the loss should be about:", "o": ["0", "1", "$\\log C$", "$C$", "$1/C$"], "e": "uniform probabilities 1/C → −log(1/C) = log C."}}, {"id": 37, "ch": 4, "a": "B", "it": {"q": "La full loss è:", "o": ["Data loss − regularization loss", "Data loss + regularization loss", "Solo la data loss", "Data loss × learning rate", "Solo la regularization loss"], "e": "Full loss = data loss + regularization loss (per esempio $\\lambda\\|W\\|^2$)."}, "en": {"q": "The full loss is:", "o": ["Data loss − regularization loss", "Data loss + regularization loss", "Only the data loss", "Data loss × learning rate", "Regularization loss only"], "e": "Full loss = data loss + regularization loss (for example $\\lambda\\|W\\|^2$)."}}, {"id": 142, "ch": 4, "a": "C", "it": {"q": "Predizioni [2, 4], target [1, 7]. Quanto vale la L1 loss (somma)?", "o": ["5", "10", "4", "2", "3"], "e": "$|2-1| + |4-7| = 1 + 3 = 4$. La L2 sarebbe $1^2 + 3^2 = 10$."}, "en": {"q": "Predictions [2, 4], targets [1, 7]. What is the L1 loss (sum)?", "o": ["5", "10", "4", "2", "3"], "e": "$|2-1| + |4-7| = 1 + 3 = 4$. L2 would be $1^2 + 3^2 = 10$."}}, {"id": 143, "ch": 4, "a": "D", "it": {"q": "Predizioni [2, 4], target [1, 7]. Quanto vale la L2 loss (somma dei quadrati)?", "o": ["8", "4", "16", "10", "12"], "e": "$(2-1)^2 + (4-7)^2 = 1 + 9 = 10$. L'errore di 3 pesa 9 volte quello di 1: per questo la L2 è sensibile agli outlier."}, "en": {"q": "Predictions [2, 4], targets [1, 7]. What is the L2 loss (sum of squares)?", "o": ["8", "4", "16", "10", "12"], "e": "$(2-1)^2 + (4-7)^2 = 1 + 9 = 10$. The error of 3 weighs 9 times the error of 1: that is why L2 is prone to outliers."}}, {"id": 144, "ch": 4, "a": "A", "it": {"q": "Devo predire un'unica costante per i target {1, 2, 9}. Quale valore minimizza la L1 loss?", "o": ["2", "1", "9", "4", "3"], "e": "L'ottimo della L1 è la mediana (2); l'ottimo della L2 è la media (4). L'outlier 9 sposta la media ma non la mediana."}, "en": {"q": "I must predict a single constant for targets {1, 2, 9}. Which value minimizes the L1 loss?", "o": ["2", "1", "9", "4", "3"], "e": "The L1 optimum is the median (2); the L2 optimum is the mean (4). The outlier 9 moves the mean but not the median."}}, {"id": 145, "ch": 4, "a": "B", "it": {"q": "Binary cross-entropy con label vera $y = 1$ e predizione $\\hat{y} = 0.8$. Quanto vale, circa?", "o": ["0.80", "0.22", "1.61", "0.20", "0.08"], "e": "$\\text{BCE} = -[y\\log\\hat{y} + (1-y)\\log(1-\\hat{y})] = -\\log 0.8 \\approx 0.22$. Se $\\hat{y}$ fosse 0.2 la loss sarebbe $-\\log 0.2 \\approx 1.61$."}, "en": {"q": "Binary cross-entropy with true label $y = 1$ and prediction $\\hat{y} = 0.8$. Roughly what is it?", "o": ["0.80", "0.22", "1.61", "0.20", "0.08"], "e": "$\\text{BCE} = -[y\\log\\hat{y} + (1-y)\\log(1-\\hat{y})] = -\\log 0.8 \\approx 0.22$. If $\\hat{y}$ were 0.2 the loss would be $-\\log 0.2 \\approx 1.61$."}}, {"id": 146, "ch": 4, "a": "C", "it": {"q": "Cosa succede alla cross-entropy quando la probabilità assegnata alla classe vera tende a 0?", "o": ["Tende a 0", "Tende a 1", "Tende a infinito", "Diventa negativa", "Resta costante"], "e": "L = $-\\log p$: con p = 1 la loss è 0, con p → 0 la loss esplode. Per questo la terza immagine dell'esempio (classe vera con lo score più basso) ha loss 6.16."}, "en": {"q": "What happens to cross-entropy when the probability of the true class goes to 0?", "o": ["It goes to 0", "It goes to 1", "It goes to infinity", "It becomes negative", "It stays constant"], "e": "L = $-\\log p$: with p = 1 the loss is 0, with p → 0 the loss blows up. That is why the third image in the example (true class with the lowest score) has loss 6.16."}}, {"id": 147, "ch": 4, "a": "D", "it": {"q": "Hinge (SVM) loss con margine 1. Score: cat 3.2, car 5.1, frog −1.7; classe vera cat. Quanto vale?", "o": ["0", "3.9", "1.9", "2.9", "$-2.9$"], "e": "$\\sum \\max(0,\\ s_k - s_{\\text{vera}} + 1)$: car → $\\max(0,\\ 5.1 - 3.2 + 1) = 2.9$; frog → $\\max(0,\\ -1.7 - 3.2 + 1) = 0$. Totale 2.9."}, "en": {"q": "Hinge (SVM) loss with margin 1. Scores: cat 3.2, car 5.1, frog −1.7; true class cat. What is it?", "o": ["0", "3.9", "1.9", "2.9", "$-2.9$"], "e": "$\\sum \\max(0,\\ s_k - s_{\\text{true}} + 1)$: car → $\\max(0,\\ 5.1 - 3.2 + 1) = 2.9$; frog → $\\max(0,\\ -1.7 - 3.2 + 1) = 0$. Total 2.9."}}, {"id": 148, "ch": 4, "a": "A", "it": {"q": "La cross-entropy loss corrisponde a:", "o": ["Una stima di massima verosimiglianza (Maximum Likelihood Estimate)", "La distanza L1 tra score e label", "La varianza delle predizioni", "La regolarizzazione L2", "Il numero di campioni classificati male"], "e": "Minimizzare −log della probabilità della classe vera equivale a massimizzare la verosimiglianza dei dati."}, "en": {"q": "Cross-entropy loss corresponds to:", "o": ["A Maximum Likelihood Estimate", "The L1 distance between scores and labels", "The variance of the predictions", "L2 regularization", "The number of misclassified samples"], "e": "Minimizing −log of the true class probability is the same as maximizing the likelihood of the data."}}, {"id": 149, "ch": 4, "a": "B", "it": {"q": "Per la stabilità numerica del softmax si fa così:", "o": ["Si moltiplicano gli score per 100", "Si sottrae il massimo degli score prima dell'esponenziale", "Si usa la ReLU al posto dell'esponenziale", "Si divide per il numero di classi", "Si somma 1 a ogni score"], "e": "Gli esponenziali di numeri grandi vanno in overflow. Sottrarre il massimo non cambia il risultato, grazie all'invarianza per traslazione."}, "en": {"q": "For numerical stability of softmax you:", "o": ["Multiply the scores by 100", "Subtract the maximum score before the exponential", "Use ReLU instead of the exponential", "Divide by the number of classes", "Add 1 to every score"], "e": "Exponentials of large numbers overflow. Subtracting the maximum does not change the result, thanks to translation invariance."}}, {"id": 150, "ch": 4, "a": "C", "it": {"q": "Nella tabella riassuntiva, la classificazione binaria usa:", "o": ["Softmax in output e MSE", "Nessuna attivazione e L1", "Sigmoid in output e binary cross-entropy", "ReLU in output e hinge loss", "Softmax in output e hinge loss"], "e": "Binaria: sigmoid + binary cross-entropy. Multiclasse: softmax + cross-entropy. Altre loss: SVM/hinge, L1/L2."}, "en": {"q": "In the summary table, binary classification uses:", "o": ["Softmax output and MSE", "No activation and L1", "Sigmoid output and binary cross-entropy", "ReLU output and hinge loss", "Softmax output and hinge loss"], "e": "Binary: sigmoid + binary cross-entropy. Multiclass: softmax + cross-entropy. Other losses: SVM/hinge, L1/L2."}}, {"id": 38, "ch": 5, "a": "B", "it": {"q": "$f = (x+y)\\cdot z$ con $x=1,\\ y=-3,\\ z=4$. Quanto vale $\\dfrac{\\partial f}{\\partial x}$?", "o": ["$-2$", "4", "$-8$", "1", "$-3$"], "e": "$\\dfrac{\\partial f}{\\partial d}\\cdot\\dfrac{\\partial d}{\\partial x} = z\\cdot 1 = 4$."}, "en": {"q": "$f = (x+y)\\cdot z$ with $x=1,\\ y=-3,\\ z=4$. What is $\\dfrac{\\partial f}{\\partial x}$?", "o": ["$-2$", "4", "$-8$", "1", "$-3$"], "e": "$\\dfrac{\\partial f}{\\partial d}\\cdot\\dfrac{\\partial d}{\\partial x} = z\\cdot 1 = 4$."}}, {"id": 39, "ch": 5, "a": "A", "it": {"q": "Nello stesso esempio, $\\dfrac{\\partial f}{\\partial z}$ vale:", "o": ["$-2$", "4", "$-8$", "1", "0"], "e": "$\\dfrac{\\partial f}{\\partial z} = d = x+y = -2$."}, "en": {"q": "In the same example, $\\dfrac{\\partial f}{\\partial z}$ is:", "o": ["$-2$", "4", "$-8$", "1", "0"], "e": "$\\dfrac{\\partial f}{\\partial z} = d = x+y = -2$."}}, {"id": 40, "ch": 5, "a": "B", "it": {"q": "La backpropagation si basa su:", "o": ["Il metodo di Newton", "La chain rule", "La line search", "Il bias trick", "La random search"], "e": "La backprop scompone il gradiente in derivate locali e le moltiplica con la chain rule lungo il grafo."}, "en": {"q": "Backpropagation is based on:", "o": ["Newton's method", "The chain rule", "Line search", "The bias trick", "Random search"], "e": "Backprop breaks the gradient into local derivatives and multiplies them with the chain rule along the graph."}}, {"id": 41, "ch": 5, "a": "B", "it": {"q": "In un nodo, il gradiente che viene propagato all'indietro è:", "o": ["Upstream gradient + derivata locale", "Upstream gradient × derivata locale", "Solo la derivata locale", "Il valore del forward pass", "Gradiente upstream ÷ derivata locale"], "e": "$\\frac{\\partial L}{\\partial x} = \\frac{\\partial L}{\\partial z}\\cdot\\frac{\\partial z}{\\partial x}$: gradiente a monte per derivata locale."}, "en": {"q": "At a node, the gradient propagated backwards is:", "o": ["Upstream gradient + local derivative", "Upstream gradient × local derivative", "Only the local derivative", "The forward-pass value", "Upstream gradient ÷ local derivative"], "e": "$\\frac{\\partial L}{\\partial x} = \\frac{\\partial L}{\\partial z}\\cdot\\frac{\\partial z}{\\partial x}$: upstream gradient times local derivative."}}, {"id": 42, "ch": 5, "a": "B", "it": {"q": "Rete $\\hat{y} = w_2 \\max(0, w_1 x)$, $L=(\\hat{y}-y)^2$, con $x=1,\\ y=0,\\ w_1=\\tfrac13,\\ w_2=2$. $\\dfrac{\\partial L}{\\partial w_2}$ vale:", "o": ["$\\frac{4}{3}$", "$\\frac{4}{9}$", "$\\frac{8}{3}$", "$\\frac{2}{3}$", "$\\frac{1}{3}$"], "e": "$\\dfrac{\\partial L}{\\partial \\hat{y}} = 2\\cdot\\tfrac23 = \\tfrac43$; per l'input di $w_2$ (ReLU $= \\tfrac13$) → $\\tfrac49$."}, "en": {"q": "Network $\\hat{y} = w_2 \\max(0, w_1 x)$, $L=(\\hat{y}-y)^2$, with $x=1,\\ y=0,\\ w_1=\\tfrac13,\\ w_2=2$. $\\dfrac{\\partial L}{\\partial w_2}$ is:", "o": ["$\\frac{4}{3}$", "$\\frac{4}{9}$", "$\\frac{8}{3}$", "$\\frac{2}{3}$", "$\\frac{1}{3}$"], "e": "$\\dfrac{\\partial L}{\\partial \\hat{y}} = 2\\cdot\\tfrac23 = \\tfrac43$; times the input of $w_2$ (ReLU $= \\tfrac13$) → $\\tfrac49$."}}, {"id": 43, "ch": 5, "a": "C", "it": {"q": "Nello stesso esempio $\\dfrac{\\partial L}{\\partial w_1}$ vale:", "o": ["$\\frac{4}{9}$", "$\\frac{4}{3}$", "$\\frac{8}{3}$", "0", "2"], "e": "$\\tfrac43\\cdot w_2 = \\tfrac83$; ReLU attiva ($\\times 1$); $\\times x = \\tfrac83$."}, "en": {"q": "In the same example $\\dfrac{\\partial L}{\\partial w_1}$ is:", "o": ["$\\frac{4}{9}$", "$\\frac{4}{3}$", "$\\frac{8}{3}$", "0", "2"], "e": "$\\tfrac43\\cdot w_2 = \\tfrac83$; ReLU active ($\\times 1$); $\\times x = \\tfrac83$."}}, {"id": 44, "ch": 5, "a": "B", "it": {"q": "In un computational graph:", "o": ["Gli archi non hanno direzione", "I nodi sono variabili o operazioni e il grafo è direzionato", "Non si possono rappresentare le attivazioni", "Ogni nodo è un intero layer", "Il grafo deve contenere cicli"], "e": "Grafo direzionato: i nodi sono variabili o operazioni, gli archi sono il flusso dei dati."}, "en": {"q": "In a computational graph:", "o": ["Edges have no direction", "Nodes are variables or operations and the graph is directional", "Activations cannot be represented", "Each node is an entire layer", "The graph must contain cycles"], "e": "Directional graph: nodes are variables or operations, edges are the data flow."}}, {"id": 151, "ch": 5, "a": "D", "it": {"q": "$f = (x+y)\\cdot z$ con $x = 1,\\ y = -3,\\ z = 4$. Quanto vale $\\dfrac{\\partial f}{\\partial y}$?", "o": ["$-8$", "1", "$-2$", "4", "0"], "e": "$\\dfrac{\\partial f}{\\partial y} = \\dfrac{\\partial f}{\\partial d}\\cdot\\dfrac{\\partial d}{\\partial y} = z\\cdot 1 = 4$, con d = x + y. Il nodo somma passa il gradiente invariato a entrambi gli input."}, "en": {"q": "$f = (x+y)\\cdot z$ with $x = 1,\\ y = -3,\\ z = 4$. What is $\\dfrac{\\partial f}{\\partial y}$?", "o": ["$-8$", "1", "$-2$", "4", "0"], "e": "$\\dfrac{\\partial f}{\\partial y} = \\dfrac{\\partial f}{\\partial d}\\cdot\\dfrac{\\partial d}{\\partial y} = z\\cdot 1 = 4$, with d = x + y. The sum node passes the gradient unchanged to both inputs."}}, {"id": 152, "ch": 5, "a": "A", "it": {"q": "$f = (x+y)\\cdot z$ con $x = 1,\\ y = -3,\\ z = 4$. Quanto vale f nel forward pass?", "o": ["$-8$", "1", "$-2$", "8", "$-12$"], "e": "d = x + y = −2; f = d · z = −8."}, "en": {"q": "$f = (x+y)\\cdot z$ with $x = 1,\\ y = -3,\\ z = 4$. What is f in the forward pass?", "o": ["$-8$", "1", "$-2$", "8", "$-12$"], "e": "d = x + y = −2; f = d · z = −8."}}, {"id": 153, "ch": 5, "a": "B", "it": {"q": "Nodo prodotto $f = a\\cdot b$ con $a = 3,\\ b = -4$ e gradiente upstream 2. Quanto vale $\\dfrac{\\partial L}{\\partial a}$?", "o": ["$-4$", "$-8$", "2", "6", "3"], "e": "Derivata locale di a·b rispetto ad a = b. Quindi 2 · (−4) = −8. Rispetto a b sarebbe 2 · 3 = 6: il nodo prodotto \"scambia\" i valori."}, "en": {"q": "Product node $f = a\\cdot b$ with $a = 3,\\ b = -4$ and upstream gradient 2. What is $\\dfrac{\\partial L}{\\partial a}$?", "o": ["$-4$", "$-8$", "2", "6", "3"], "e": "Local derivative of a·b w.r.t. a = b. So 2 · (−4) = −8. W.r.t. b it would be 2 · 3 = 6: the product node \"swaps\" the values."}}, {"id": 154, "ch": 5, "a": "C", "it": {"q": "Un nodo somma riceve un gradiente upstream di 3. Che gradiente passa a ciascuno dei suoi input?", "o": ["0", "1.5", "3", "6", "$-3$"], "e": "La derivata locale di x + y rispetto a ciascun input è 1: il gradiente viene distribuito invariato."}, "en": {"q": "A sum node receives an upstream gradient of 3. What gradient does it pass to each input?", "o": ["0", "1.5", "3", "6", "$-3$"], "e": "The local derivative of x + y w.r.t. each input is 1: the gradient is distributed unchanged."}}, {"id": 155, "ch": 5, "a": "D", "it": {"q": "Esempio della sigmoid ($w_0 = -3,\\ x_0 = -2,\\ w_1 = 2,\\ x_1 = -1,\\ b = -3$). Quanto vale l'output nel forward pass?", "o": ["0.37", "1.37", "0.20", "0.73", "1.00"], "e": "$w_0x_0 + w_1x_1 + b = 6 - 2 - 3 = 1$; $e^{-1} = 0.37$; $1 + 0.37 = 1.37$; $1/1.37 = 0.73 = \\sigma(1)$."}, "en": {"q": "Sigmoid example ($w_0 = -3,\\ x_0 = -2,\\ w_1 = 2,\\ x_1 = -1,\\ b = -3$). What is the output in the forward pass?", "o": ["0.37", "1.37", "0.20", "0.73", "1.00"], "e": "$w_0x_0 + w_1x_1 + b = 6 - 2 - 3 = 1$; $e^{-1} = 0.37$; $1 + 0.37 = 1.37$; $1/1.37 = 0.73 = \\sigma(1)$."}}, {"id": 156, "ch": 5, "a": "A", "it": {"q": "Nello stesso esempio della sigmoid, quanto vale $\\dfrac{\\partial f}{\\partial x_0}$?", "o": ["$-0.6$", "0.4", "$-0.4$", "0.2", "$-0.2$"], "e": "Il gradiente all'ingresso della sigmoid è $\\sigma(1)(1-\\sigma(1)) \\approx 0.2$. Poi $\\dfrac{\\partial f}{\\partial x_0} = w_0\\cdot 0.2 = -3\\cdot 0.2 = -0.6$ (mentre $\\dfrac{\\partial f}{\\partial w_0} = x_0\\cdot 0.2 = -0.4$)."}, "en": {"q": "In the same sigmoid example, what is $\\dfrac{\\partial f}{\\partial x_0}$?", "o": ["$-0.6$", "0.4", "$-0.4$", "0.2", "$-0.2$"], "e": "The gradient at the sigmoid's input is $\\sigma(1)(1-\\sigma(1)) \\approx 0.2$. Then $\\dfrac{\\partial f}{\\partial x_0} = w_0\\cdot 0.2 = -3\\cdot 0.2 = -0.6$ (while $\\dfrac{\\partial f}{\\partial w_0} = x_0\\cdot 0.2 = -0.4$)."}}, {"id": 157, "ch": 5, "a": "B", "it": {"q": "Derivata della sigmoid: se $\\sigma(x) = 0.73$, quanto vale $\\sigma'(x)$, circa?", "o": ["0.73", "0.2", "1", "0.27", "0.5"], "e": "$\\sigma'(x) = \\sigma(x)(1-\\sigma(x)) = 0.73\\cdot 0.27 \\approx 0.2$. È lo stesso 0.2 che si ottiene nodo per nodo nel grafo."}, "en": {"q": "Sigmoid derivative: if $\\sigma(x) = 0.73$, roughly what is $\\sigma'(x)$?", "o": ["0.73", "0.2", "1", "0.27", "0.5"], "e": "$\\sigma'(x) = \\sigma(x)(1-\\sigma(x)) = 0.73\\cdot 0.27 \\approx 0.2$. It is the same 0.2 obtained node by node in the graph."}}, {"id": 158, "ch": 5, "a": "C", "it": {"q": "Nodo $g(x) = 1/x$ con x = 1.37 e gradiente upstream 1. Quanto vale il gradiente a valle, circa?", "o": ["0.73", "0.53", "$-0.53$", "$-1.37$", "$-0.37$"], "e": "Derivata locale di $1/x = -1/x^2 = -1/1.37^2 \\approx -0.53$. Moltiplicata per l'upstream 1 dà −0.53."}, "en": {"q": "Node $g(x) = 1/x$ with x = 1.37 and upstream gradient 1. Roughly what is the downstream gradient?", "o": ["0.73", "0.53", "$-0.53$", "$-1.37$", "$-0.37$"], "e": "Local derivative of $1/x = -1/x^2 = -1/1.37^2 \\approx -0.53$. Times the upstream 1 gives −0.53."}}, {"id": 159, "ch": 5, "a": "D", "it": {"q": "Rete $\\hat{y} = w_2 \\max(0, w_1 x)$, $L = (\\hat{y} - y)^2$, con $x = 1,\\ y = 0,\\ w_1 = \\tfrac13,\\ w_2 = 2$. Quanto vale L?", "o": ["$\\frac{1}{9}$", "$\\frac{2}{3}$", "$\\frac{4}{3}$", "$\\frac{4}{9}$", "0"], "e": "$w_1x = \\tfrac13$; ReLU $= \\tfrac13$; $\\hat{y} = 2\\cdot\\tfrac13 = \\tfrac23$; $L = (\\tfrac23)^2 = \\tfrac49$."}, "en": {"q": "Network $\\hat{y} = w_2 \\max(0, w_1 x)$, $L = (\\hat{y} - y)^2$, with $x = 1,\\ y = 0,\\ w_1 = \\tfrac13,\\ w_2 = 2$. What is L?", "o": ["$\\frac{1}{9}$", "$\\frac{2}{3}$", "$\\frac{4}{3}$", "$\\frac{4}{9}$", "0"], "e": "$w_1x = \\tfrac13$; ReLU $= \\tfrac13$; $\\hat{y} = 2\\cdot\\tfrac13 = \\tfrac23$; $L = (\\tfrac23)^2 = \\tfrac49$."}}, {"id": 160, "ch": 5, "a": "A", "it": {"q": "Nella notazione dei pesi $w_{l,m,n}$, l'indice m indica:", "o": ["Il neurone all'interno del layer", "Il layer", "Il campione del minibatch", "Il peso all'interno del neurone", "La classe di output"], "e": "l = quale layer, m = quale neurone nel layer, n = quale peso del neurone."}, "en": {"q": "In the weight notation $w_{l,m,n}$, the index m indicates:", "o": ["The neuron within the layer", "The layer", "The minibatch sample", "The weight within the neuron", "The output class"], "e": "l = which layer, m = which neuron in the layer, n = which weight in the neuron."}}, {"id": 161, "ch": 5, "a": "B", "it": {"q": "Rispetto a quali grandezze si calcolano i gradienti per addestrare la rete?", "o": ["Solo le label y", "Tutti i pesi W e tutti i bias b", "Solo i pesi dell'ultimo layer", "Solo gli input x", "Solo il learning rate"], "e": "Pesi e bias sono le incognite dell'ottimizzazione. Gli input e le label sono dati fissi."}, "en": {"q": "With respect to which quantities are gradients computed to train the network?", "o": ["Only the labels y", "All weights W and all biases b", "Only the weights of the last layer", "Only the inputs x", "Only the learning rate"], "e": "Weights and biases are the unknowns of the optimization. Inputs and labels are fixed data."}}, {"id": 162, "ch": 5, "a": "C", "it": {"q": "Perché si rappresentano le reti neurali come computational graph?", "o": ["Eliminano la necessità della chain rule", "Evitano di calcolare il forward pass", "Permettono di scomporre il gradiente di funzioni complesse in derivate locali semplici (modularità)", "Rendono la loss convessa", "Eliminano la necessità della loss"], "e": "Ogni nodo conosce solo la propria derivata locale; la chain rule le combina. Così funzioni enormi diventano gestibili."}, "en": {"q": "Why are neural networks represented as computational graphs?", "o": ["They remove the need for the chain rule", "They avoid computing the forward pass", "They break the gradient of complex functions into simple local derivatives (modularity)", "They make the loss convex", "They remove the need for a loss function"], "e": "Each node only knows its own local derivative; the chain rule combines them. That makes huge functions manageable."}}, {"id": 45, "ch": 6, "a": "B", "it": {"q": "L'update del gradient descent è:", "o": ["$\\theta' = \\theta + \\alpha\\nabla L$", "$\\theta' = \\theta - \\alpha\\nabla L$", "$\\theta' = \\alpha\\nabla L$", "$\\theta' = \\theta - \\nabla L/\\alpha$", "$\\theta' = \\theta\\cdot\\alpha\\nabla L$"], "e": "Ci si muove contro il gradiente, che punta nella direzione di massima crescita."}, "en": {"q": "The gradient descent update is:", "o": ["$\\theta' = \\theta + \\alpha\\nabla L$", "$\\theta' = \\theta - \\alpha\\nabla L$", "$\\theta' = \\alpha\\nabla L$", "$\\theta' = \\theta - \\nabla L/\\alpha$", "$\\theta' = \\theta\\cdot\\alpha\\nabla L$"], "e": "You step against the gradient, which points in the direction of greatest increase."}}, {"id": 46, "ch": 6, "a": "B", "it": {"q": "Un learning rate troppo grande causa:", "o": ["Convergenza lenta", "Salto del minim
