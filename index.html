ix", "The minibatch gradient"], "e": "the Jacobian is the matrix of first derivatives."}}, {"id": 163, "ch": 6, "a": "D", "it": {"q": "f(x) = (x − 3)², x₀ = 0, learning rate α = 0.1. Quanto vale x₁ dopo un passo di gradient descent?", "o": ["3", "0.06", "6", "0.6"], "e": "f'(x) = 2(x − 3) = −6 in x = 0. x₁ = 0 − 0.1 · (−6) = 0.6. Il passo successivo dà 1.08, come nella tabella delle slide."}, "en": {"q": "f(x) = (x − 3)², x₀ = 0, learning rate α = 0.1. What is x₁ after one gradient descent step?", "o": ["3", "0.06", "6", "0.6"], "e": "f'(x) = 2(x − 3) = −6 at x = 0. x₁ = 0 − 0.1 · (−6) = 0.6. The next step gives 1.08, as in the slide table."}}, {"id": 164, "ch": 6, "a": "A", "it": {"q": "Stesso esempio, f(x) = (x − 3)², x₀ = 0, ma con α = 0.01. Quanto vale x₁?", "o": ["0.06", "0.6", "−0.06", "0.006"], "e": "x₁ = 0 − 0.01 · (−6) = 0.06. Con α = 0.001 sarebbe 0.006."}, "en": {"q": "Same example, f(x) = (x − 3)², x₀ = 0, but with α = 0.01. What is x₁?", "o": ["0.06", "0.6", "−0.06", "0.006"], "e": "x₁ = 0 − 0.01 · (−6) = 0.06. With α = 0.001 it would be 0.006."}}, {"id": 165, "ch": 6, "a": "B", "it": {"q": "Training set di 2²⁰ immagini (circa 1 milione), batch size 64. Quanti minibatch in un'epoca?", "o": ["1.024", "16.384", "1.048.576", "64"], "e": "2²⁰ / 2⁶ = 2¹⁴ = 16.384."}, "en": {"q": "Training set of 2²⁰ images (about 1 million), batch size 64. How many minibatches per epoch?", "o": ["1,024", "16,384", "1,048,576", "64"], "e": "2²⁰ / 2⁶ = 2¹⁴ = 16,384."}}, {"id": 166, "ch": 6, "a": "C", "it": {"q": "Qual è l'update del momentum?", "o": ["θ ← θ − α∇L / √s", "θ ← θ + α∇L", "v ← βv − α∇L, poi θ ← θ + v", "θ ← θ − H⁻¹∇L"], "e": "La velocity accumula una media esponenzialmente pesata dei gradienti; i pesi si muovono della velocity."}, "en": {"q": "What is the momentum update?", "o": ["θ ← θ − α∇L / √s", "θ ← θ + α∇L", "v ← βv − α∇L, then θ ← θ + v", "θ ← θ − H⁻¹∇L"], "e": "The velocity accumulates an exponentially weighted average of gradients; the weights move by the velocity."}}, {"id": 167, "ch": 6, "a": "D", "it": {"q": "Con momentum e β = 1 (e learning rate piccolo) cosa succede?", "o": ["Si converge in un passo", "I pesi restano fermi", "Si ottiene gradient descent normale", "Si oscilla avanti e indietro all'infinito, come una pallina in una ciotola senza attrito"], "e": "β = 0 → gradient descent vanilla; β = 1 → nessun attrito, oscilla per sempre. Per questo si usa β ≈ 0.8–0.9."}, "en": {"q": "With momentum and β = 1 (and a small learning rate) what happens?", "o": ["It converges in one step", "The weights stay still", "You get plain gradient descent", "It rocks back and forth forever, like a ball in a frictionless bowl"], "e": "β = 0 → vanilla gradient descent; β = 1 → no friction, it oscillates forever. That is why β ≈ 0.8–0.9 is used."}}, {"id": 168, "ch": 6, "a": "A", "it": {"q": "Nel Nesterov momentum il gradiente viene calcolato:", "o": ["Nel punto in cui il momentum sta per portare i pesi (look-ahead)", "Nel punto di partenza dell'ottimizzazione", "Sul test set", "Solo ogni 10 iterazioni"], "e": "È un momentum \"che guarda avanti\": prima fa il salto della velocity, poi corregge con il gradiente valutato lì."}, "en": {"q": "In Nesterov momentum the gradient is computed:", "o": ["At the point the momentum is about to take the weights (look-ahead)", "At the starting point of the optimization", "On the test set", "Only every 10 iterations"], "e": "It is a \"look-ahead\" momentum: first it makes the velocity jump, then corrects with the gradient evaluated there."}}, {"id": 169, "ch": 6, "a": "B", "it": {"q": "In RMSProp, cosa succede nelle direzioni con gradienti grandi?", "o": ["Il learning rate viene azzerato", "Il passo viene smorzato, perché si divide per la radice della media dei gradienti al quadrato", "Il gradiente viene ignorato", "Il passo viene amplificato"], "e": "Si divide per √s: dove i gradienti sono grandi (oscillazioni) la divisione è grande e il passo piccolo; dove sono piccoli il passo resta ampio."}, "en": {"q": "In RMSProp, what happens in directions with large gradients?", "o": ["The learning rate is set to zero", "The step is damped, since you divide by the root of the average squared gradient", "The gradient is ignored", "The step is amplified"], "e": "You divide by √s: where gradients are large (oscillations) the division is large and the step small; where they are small the step stays wide."}}, {"id": 170, "ch": 6, "a": "C", "it": {"q": "In Adam, il first moment m e il second moment v corrispondono a:", "o": ["Learning rate e batch size", "Media e varianza dei pesi", "Media dei gradienti (come Momentum) e media dei gradienti al quadrato (come RMSProp)", "Gradiente e Hessiano"], "e": "Adam = Momentum + RMSProp: m accumula i gradienti, v i gradienti al quadrato, entrambi con bias correction."}, "en": {"q": "In Adam, the first moment m and second moment v correspond to:", "o": ["Learning rate and batch size", "Mean and variance of the weights", "Average of gradients (like Momentum) and average of squared gradients (like RMSProp)", "Gradient and Hessian"], "e": "Adam = Momentum + RMSProp: m accumulates gradients, v squared gradients, both with bias correction."}}, {"id": 171, "ch": 6, "a": "D", "it": {"q": "Quale iperparametro di Adam va tipicamente tarato, secondo le slide?", "o": ["β₁", "ε", "β₂", "Il learning rate α"], "e": "β₁ = 0.9, β₂ = 0.999 ed ε = 10⁻⁸ sono default che di solito funzionano; α \"needs tuning\"."}, "en": {"q": "Which Adam hyperparameter typically needs tuning, according to the slides?", "o": ["β₁", "ε", "β₂", "The learning rate α"], "e": "β₁ = 0.9, β₂ = 0.999 and ε = 10⁻⁸ are defaults that usually work; α \"needs tuning\"."}}, {"id": 172, "ch": 6, "a": "A", "it": {"q": "Il metodo di Gauss-Newton:", "o": ["Approssima l'Hessiano con JᵀJ, perché le vere derivate seconde sono difficili da ottenere", "È un metodo del primo ordine", "Usa solo il segno del gradiente", "Aggiunge rumore al gradiente"], "e": "Gauss-Newton usa il Jacobiano per approssimare la curvatura; Levenberg aggiunge λI (smorzamento), Levenberg-Marquardt λ·diag(JᵀJ)."}, "en": {"q": "The Gauss-Newton method:", "o": ["Approximates the Hessian with JᵀJ, because true second derivatives are hard to obtain", "Is a first-order method", "Uses only the sign of the gradient", "Adds noise to the gradient"], "e": "Gauss-Newton uses the Jacobian to approximate curvature; Levenberg adds λI (damping), Levenberg-Marquardt λ·diag(JᵀJ)."}}, {"id": 173, "ch": 6, "a": "B", "it": {"q": "Applicando il metodo di Newton alla linear regression (loss quadratica) si ottiene:", "o": ["Convergenza lenta come SGD", "La soluzione esatta in un solo passo", "Divergenza", "Un minimo locale non globale"], "e": "Newton usa un'approssimazione di Taylor al secondo ordine: su una funzione quadratica l'approssimazione è esatta, quindi un passo basta."}, "en": {"q": "Applying Newton's method to linear regression (quadratic loss) gives:", "o": ["Slow convergence like SGD", "The exact solution in a single step", "Divergence", "A local, non-global minimum"], "e": "Newton uses a second-order Taylor approximation: on a quadratic function it is exact, so one step is enough."}}, {"id": 174, "ch": 6, "a": "C", "it": {"q": "Per risolvere un sistema lineare Ax = b, secondo le slide si usano:", "o": ["Adam", "Dropout", "LU, QR, Cholesky, Jacobi, Gauss-Seidel, CG", "Gradient descent o SGD"], "e": "\"GD or SGD is not a way to solve a linear system!\": esistono metodi dedicati e più efficienti."}, "en": {"q": "To solve a linear system Ax = b, according to the slides you use:", "o": ["Adam", "Dropout", "LU, QR, Cholesky, Jacobi, Gauss-Seidel, CG", "Gradient descent or SGD"], "e": "\"GD or SGD is not a way to solve a linear system!\": there are dedicated, more efficient methods."}}, {"id": 175, "ch": 6, "a": "D", "it": {"q": "Quale gruppo contiene solo metodi del secondo ordine?", "o": ["Momentum, RMSProp, Adam", "Gradient descent, SGD", "Grid search, random search", "Newton, Gauss-Newton, Levenberg-Marquardt, (L-)BFGS"], "e": "Secondo ordine = usano (un'approssimazione de) l'Hessiano. GD e SGD sono del primo ordine; Momentum, RMSProp e Adam sono varianti di SGD."}, "en": {"q": "Which group contains only second-order methods?", "o": ["Momentum, RMSProp, Adam", "Gradient descent, SGD", "Grid search, random search", "Newton, Gauss-Newton, Levenberg-Marquardt, (L-)BFGS"], "e": "Second order = they use (an approximation of) the Hessian. GD and SGD are first order; Momentum, RMSProp and Adam are SGD variants."}}, {"id": 176, "ch": 6, "a": "A", "it": {"q": "Perché la line search per il learning rate ottimo non è pratica nel deep learning?", "o": ["Richiede di risolvere un problema enorme a ogni passo", "Perché dà sempre α = 0", "Perché funziona solo con la ReLU", "Perché non usa il gradiente"], "e": "Trovare l'α ottimo lungo la direzione del gradiente a ogni iterazione costa troppo con milioni di parametri."}, "en": {"q": "Why is line search for the optimal learning rate impractical in deep learning?", "o": ["It requires solving a huge problem at every step", "Because it always gives α = 0", "Because it only works with ReLU", "Because it does not use the gradient"], "e": "Finding the optimal α along the gradient direction at every iteration is too costly with millions of parameters."}}, {"id": 177, "ch": 6, "a": "B", "it": {"q": "Quale sequenza di learning rate soddisfa le condizioni di Robbins-Monro (Σα = ∞, Σα² < ∞)?", "o": ["α_k = 0.1 costante", "α_k = 1/k", "α_k = 1/k³", "α_k = 2^k"], "e": "Σ1/k diverge (si arriva ovunque), Σ1/k² converge (il rumore si spegne). Una costante ha Σα² = ∞; 1/k³ ha Σα finita."}, "en": {"q": "Which learning-rate sequence satisfies the Robbins-Monro conditions (Σα = ∞, Σα² < ∞)?", "o": ["constant α_k = 0.1", "α_k = 1/k", "α_k = 1/k³", "α_k = 2^k"], "e": "Σ1/k diverges (you can reach anywhere), Σ1/k² converges (the noise dies out). A constant has Σα² = ∞; 1/k³ has finite Σα."}}, {"id": 178, "ch": 6, "a": "C", "it": {"q": "Definizione di funzione convessa vista nelle slide:", "o": ["Ha esattamente due minimi", "È lineare a tratti", "Il segmento tra due punti qualsiasi del grafico sta sopra o sul grafico", "La derivata è sempre positiva"], "e": "Se il segmento sta sempre sopra o sul grafico, ogni minimo locale è globale."}, "en": {"q": "Definition of a convex function in the slides:", "o": ["It has exactly two minima", "It is piecewise linear", "The segment between any two points of the graph lies above or on the graph", "The derivative is always positive"], "e": "If the segment always lies above or on the graph, every local minimum is global."}}, {"id": 179, "ch": 6, "a": "D", "it": {"q": "Perché SGD è più rumoroso del gradient descent full batch?", "o": ["Perché usa un learning rate più grande", "Perché usa l'Hessiano", "Perché ignora la backpropagation", "Stima il gradiente su un sottoinsieme di campioni, quindi ha più varianza"], "e": "Il gradiente del minibatch è una stima non distorta ma rumorosa del gradiente vero; batch più piccoli = più varianza."}, "en": {"q": "Why is SGD noisier than full-batch gradient descent?", "o": ["Because it uses a larger learning rate", "Because it uses the Hessian", "Because it ignores backpropagation", "It estimates the gradient on a subset of samples, so it has more variance"], "e": "The minibatch gradient is an unbiased but noisy estimate of the true gradient; smaller batches = more variance."}}, {"id": 66, "ch": 7, "a": "C", "it": {"q": "Con α₀ = 0.1 e decay_rate = 1 (α = α₀/(1+decay·epoch)), all'epoca 3 α vale:", "o": ["0.05", "0.033", "0.025", "0.0125"], "e": "0.1 / (1+3)."}, "en": {"q": "With α₀ = 0.1 and decay_rate = 1 (α = α₀/(1+decay·epoch)), at epoch 3 α is:", "o": ["0.05", "0.033", "0.025", "0.0125"], "e": "0.1 / (1+3)."}}, {"id": 67, "ch": 7, "a": "B", "it": {"q": "Il validation set serve a:", "o": ["Addestrare i pesi", "Scegliere gli iperparametri e monitorare la generalizzazione", "Dare il risultato finale", "Fare data augmentation"], "e": "Train → pesi; validation → iperparametri e controllo della generalizzazione; test → solo alla fine."}, "en": {"q": "The validation set is used to:", "o": ["Train the weights", "Choose hyperparameters and monitor generalization", "Report the final result", "Do data augmentation"], "e": "Train → weights; validation → hyperparameters and generalization check; test → only at the very end."}}, {"id": 68, "ch": 7, "a": "C", "it": {"q": "Il test set:", "o": ["Si usa per il tuning", "Si usa per il debug", "Non va toccato durante sviluppo e training", "Deve stare dentro il training set"], "e": "Se lo usi per tuning o debug, la stima finale non è più affidabile."}, "en": {"q": "The test set:", "o": ["Is used for tuning", "Is used for debugging", "Must not be touched during development and training", "Must be inside the training set"], "e": "If you use it for tuning or debugging, the final estimate is no longer reliable."}}, {"id": 69, "ch": 7, "a": "B", "it": {"q": "Errore ground truth 1%, training 5%, validation 8%. Il gap 1% → 5% rappresenta:", "o": ["Variance (overfitting)", "Bias (underfitting)", "Rumore", "Data leakage"], "e": "il gap training ↔ validation (5% → 8%) è invece variance/overfitting."}, "en": {"q": "Ground truth error 1%, training 5%, validation 8%. The 1% → 5% gap represents:", "o": ["Variance (overfitting)", "Bias (underfitting)", "Noise", "Data leakage"], "e": "the training ↔ validation gap (5% → 8%) is variance/overfitting instead."}}, {"id": 70, "ch": 7, "a": "B", "it": {"q": "Training loss che scende mentre la validation loss risale indica:", "o": ["Underfitting", "Overfitting", "Training ideale", "Learning rate troppo basso"], "e": "Il modello sta memorizzando il training set: è il segnale classico dell'overfitting."}, "en": {"q": "Training loss decreasing while validation loss increases indicates:", "o": ["Underfitting", "Overfitting", "Ideal training", "Learning rate too low"], "e": "The model is memorizing the training set: the classic sign of overfitting."}}, {"id": 71, "ch": 7, "a": "B", "it": {"q": "Training e validation loss entrambe ancora in discesa a fine training indicano:", "o": ["Overfitting", "Underfitting", "Divergenza", "Dead ReLU"], "e": "c'è ancora margine: il modello non ha finito di imparare."}, "en": {"q": "Training and validation loss both still decreasing at the end of training indicate:", "o": ["Overfitting", "Underfitting", "Divergence", "Dead ReLU"], "e": "there is still room: the model has not finished learning."}}, {"id": 72, "ch": 7, "a": "B", "it": {"q": "La random search rispetto alla grid search:", "o": ["Prova tutte le combinazioni", "Sceglie punti a caso nei range predefiniti", "Non richiede range", "È il metodo manuale"], "e": "La grid search prova tutte le combinazioni di una griglia; la random search pesca punti a caso negli stessi range."}, "en": {"q": "Random search, compared with grid search:", "o": ["Tries all combinations", "Picks points at random in the predefined ranges", "Needs no ranges", "Is the manual method"], "e": "Grid search tries every combination on a grid; random search picks random points in the same ranges."}}, {"id": 73, "ch": 7, "a": "B", "it": {"q": "Il primo passo consigliato per iniziare il training è:", "o": ["Usare la rete più grande per due settimane", "Fare overfit su un singolo campione", "Partire dal test set", "Applicare subito il dropout massimo"], "e": "Se la rete non riesce nemmeno a memorizzare un campione, c'è un bug. Poi si aumentano i dati poco alla volta."}, "en": {"q": "The recommended first step to start training is:", "o": ["Use the biggest network for two weeks", "Overfit a single sample", "Start from the test set", "Apply maximum dropout straight away"], "e": "If the network cannot even memorize one sample, there is a bug. Then you increase the data gradually."}}, {"id": 74, "ch": 7, "a": "B", "it": {"q": "Lo strumento di debug più importante secondo le slide:", "o": ["La matrice di confusione", "Le loss curves", "Il numero di parametri", "Il tempo per iterazione"], "e": "Le slide lo dicono esplicitamente: le loss curves sono lo strumento di debug più importante."}, "en": {"q": "The most important debugging tool according to the slides:", "o": ["The confusion matrix", "The loss curves", "The number of parameters", "The time per iteration"], "e": "The slides say so explicitly: loss curves are the most important debugging tool."}}, {"id": 75, "ch": 7, "a": "B", "it": {"q": "Quale di questi è un \"bad sign\"?", "o": ["Gap piccolo tra training e validation", "Performance su validation migliore che su training", "Loss che scende in modo stabile", "Generalizzazione che compare aumentando i dati"], "e": "Validation migliore del training indica che qualcosa non torna, per esempio un validation set più facile del training set."}, "en": {"q": "Which of these is a \"bad sign\"?", "o": ["Small gap between training and validation", "Validation performance better than training", "Loss decreasing steadily", "Generalization appearing as data increases"], "e": "Validation better than training means something is off, for example a validation set easier than the training set."}}, {"id": 180, "ch": 7, "a": "A", "it": {"q": "Step decay: α = 0.1, decay rate t = 0.5, applicato ogni 10 epoche (α ← α − t·α). Quanto vale α all'epoca 20?", "o": ["0.025", "0.0125", "0.05", "0.1"], "e": "Ogni applicazione dimezza α: epoca 10 → 0.05, epoca 20 → 0.025."}, "en": {"q": "Step decay: α = 0.1, decay rate t = 0.5, applied every 10 epochs (α ← α − t·α). What is α at epoch 20?", "o": ["0.025", "0.0125", "0.05", "0.1"], "e": "Each application halves α: epoch 10 → 0.05, epoch 20 → 0.025."}}, {"id": 181, "ch": 7, "a": "B", "it": {"q": "Exponential decay: α = t^epoch · α₀ con α₀ = 0.1 e t = 0.9. Quanto vale α all'epoca 2?", "o": ["0.08", "0.081", "0.09", "0.0081"], "e": "0.9² · 0.1 = 0.81 · 0.1 = 0.081."}, "en": {"q": "Exponential decay: α = t^epoch · α₀ with α₀ = 0.1 and t = 0.9. What is α at epoch 2?", "o": ["0.08", "0.081", "0.09", "0.0081"], "e": "0.9² · 0.1 = 0.81 · 0.1 = 0.081."}}, {"id": 182, "ch": 7, "a": "C", "it": {"q": "Perché si riduce il learning rate durante il training?", "o": ["Per evitare la backpropagation", "Per aumentare l'overfitting", "Serve un passo grande quando si è lontani dal minimo e piccolo quando si è vicini", "Perché il batch size cresce"], "e": "All'inizio passi grandi accelerano; vicino al minimo passi piccoli evitano di saltarlo."}, "en": {"q": "Why is the learning rate reduced during training?", "o": ["To avoid backpropagation", "To increase overfitting", "You need a big step when far from the minimum and a small one when close", "Because the batch size grows"], "e": "Early on, big steps speed things up; near the minimum, small steps avoid jumping over it."}}, {"id": 183, "ch": 7, "a": "D", "it": {"q": "Quale tra questi è uno split tipico dei dati indicato nelle slide?", "o": ["Train 10%, validation 10%, test 80%", "Train 50%, test 50%, senza validation", "Train 100%", "Train 80%, validation 10%, test 10%"], "e": "Split tipici: 60/20/20 oppure 80/10/10."}, "en": {"q": "Which of these is a typical data split given in the slides?", "o": ["Train 10%, validation 10%, test 80%", "Train 50%, test 50%, no validation", "Train 100%", "Train 80%, validation 10%, test 10%"], "e": "Typical splits: 60/20/20 or 80/10/10."}}, {"id": 184, "ch": 7, "a": "A", "it": {"q": "Il validation set è chiamato anche:", "o": ["Development set (dev set)", "Minibatch", "Test set", "Ground truth"], "e": "Validation = dev set: serve a scegliere gli iperparametri e controllare la generalizzazione."}, "en": {"q": "The validation set is also called:", "o": ["Development set (dev set)", "Minibatch", "Test set", "Ground truth"], "e": "Validation = dev set: used to choose hyperparameters and check generalization."}}, {"id": 185, "ch": 7, "a": "B", "it": {"q": "Softmax con 10 classi: quale loss iniziale ti aspetti nel sanity check, circa?", "o": ["10", "2.3", "0", "0.1"], "e": "Pesi piccoli → probabilità quasi uniformi 1/10 → loss = −ln(1/10) = ln 10 ≈ 2.3."}, "en": {"q": "Softmax with 10 classes: roughly what initial loss do you expect in the sanity check?", "o": ["10", "2.3", "0", "0.1"], "e": "Small weights → nearly uniform probabilities 1/10 → loss = −ln(1/10) = ln 10 ≈ 2.3."}}, {"id": 186, "ch": 7, "a": "C", "it": {"q": "Valori di weight decay suggeriti per la coarse grid search:", "o": ["1e-1, 1e-2, 1e-3, 1e-4", "0.5, 0.9, 0.99", "1e-4, 1e-5, 0", "1, 10, 100"], "e": "1e-1…1e-4 sono i learning rate da provare; per il weight decay si provano 1e-4, 1e-5 e 0."}, "en": {"q": "Weight decay values suggested for the coarse grid search:", "o": ["1e-1, 1e-2, 1e-3, 1e-4", "0.5, 0.9, 0.99", "1e-4, 1e-5, 0", "1, 10, 100"], "e": "1e-1…1e-4 are the learning rates to try; for weight decay you try 1e-4, 1e-5 and 0."}}, {"id": 187, "ch": 7, "a": "D", "it": {"q": "Una singola iterazione impiega più di 500 ms. Cosa suggeriscono le slide?", "o": ["Aumentare il numero di layer", "Usare il test set per il training", "Ridurre il learning rate", "Cercare i colli di bottiglia, per esempio nel caricamento dati (risoluzione minore, compressione, SSD)"], "e": "Misura tempi precisi; se un'iterazione supera 500 ms forse c'è un problema. Spesso è il dataloading, a volte la backprop."}, "en": {"q": "A single iteration takes more than 500 ms. What do the slides suggest?", "o": ["Increase the number of layers", "Use the test set for training", "Reduce the learning rate", "Look for bottlenecks, e.g. in data loading (smaller resolution, compression, SSD)"], "e": "Get precise timings; if an iteration exceeds 500 ms there may be a problem. It is often data loading, sometimes backprop."}}, {"id": 188, "ch": 7, "a": "A", "it": {"q": "Regola pratica delle slide sull'architettura iniziale:", "o": ["Partire dalla rete più semplice possibile, dividendo per 5 i layer che si avevano in mente", "Copiare un'architettura senza testarla", "Partire dalla rete più grande e addestrarla due settimane", "Usare sempre almeno 100 layer"], "e": "Errore frequente: rete enorme, due settimane di training e poi si vede. Meglio cicli di debug di pochi minuti."}, "en": {"q": "Rule of thumb from the slides on the initial architecture:", "o": ["Start with the simplest network possible, dividing the layers you had in mind by 5", "Copy an architecture without testing it", "Start with the biggest network and train it for two weeks", "Always use at least 100 layers"], "e": "Frequent mistake: huge network, two weeks of training, then see. Better: debug cycles of a few minutes."}}, {"id": 189, "ch": 7, "a": "B", "it": {"q": "\"Ho aggiunto 5 layer, raddoppiato i dati e addestrato 5 giorni in più: ora va meglio, ma perché?\" Quale regola viola?", "o": ["Usare la grid search", "Fare una sola modifica alla volta", "Non toccare il test set", "Fare overfit su un campione"], "e": "Cambiando più cose insieme non si sa quale abbia avuto effetto. Le valutazioni devono essere coerenti e confrontabili."}, "en": {"q": "\"I added 5 layers, doubled the data and trained 5 days longer: now it is better, but why?\" Which rule does this break?", "o": ["Use grid search", "Only make one change at a time", "Never touch the test set", "Overfit one sample"], "e": "Changing several things at once, you cannot tell which one had the effect. Evaluations must be consistent and comparable."}}, {"id": 190, "ch": 7, "a": "C", "it": {"q": "Durante la refine grid search, i modelli migliori si addestrano:", "o": ["Con learning rate 0", "Per una sola iterazione", "Più a lungo (10–20 epoche), senza learning rate decay", "Direttamente sul test set"], "e": "Coarse: pochi modelli, poche epoche. Refine: griglia più fine intorno ai migliori, 10–20 epoche, senza decay, studiando le loss curves."}, "en": {"q": "During the refined grid search, the best models are trained:", "o": ["With learning rate 0", "For a single iteration", "Longer (10–20 epochs), without learning rate decay", "Directly on the test set"], "e": "Coarse: few models, few epochs. Refine: finer grid around the best, 10–20 epochs, no decay, studying the loss curves."}}, {"id": 191, "ch": 7, "a": "D", "it": {"q": "Le performance sul validation set sono migliori che sul training set. Una possibile causa è:", "o": ["C'è underfitting ideale", "Il learning rate è ottimo", "Il modello è perfetto", "Il validation set è più facile del training set"], "e": "Le slide lo mostrano tra le \"other curves\" e lo elencano tra i bad signs: qualcosa nei dati o nella valutazione non torna."}, "en": {"q": "Validation performance is better than training performance. A possible cause is:", "o": ["There is ideal underfitting", "The learning rate is optimal", "The model is perfect", "The validation set is easier than the training set"], "e": "The slides show it among the \"other curves\" and list it among the bad signs: something in the data or evaluation is off."}}, {"id": 192, "ch": 7, "a": "A", "it": {"q": "Da dove viene, tipicamente, il training error mostrato durante il training?", "o": ["Dalla media degli errori dei minibatch", "Dal validation set", "Dall'ultimo campione visto", "Da un passaggio completo sul test set"], "e": "Durante il training: train error = media sui minibatch; per la validation si prende un sottoinsieme ogni n iterazioni."}, "en": {"q": "Where does the training error shown during training typically come from?", "o": ["The average minibatch error", "The validation set", "The last sample seen", "A full pass over the test set"], "e": "During training: train error = average over minibatches; for validation you take a subset every n iterations."}}, {"id": 193, "ch": 7, "a": "B", "it": {"q": "Come appare un training ideale nelle curve?", "o": ["Training loss a zero e validation in salita", "Gap piccolo tra training e validation loss, entrambe scendono allo stesso ritmo senza fluttuazioni", "Validation loss molto sotto la training loss", "Entrambe ferme dall'inizio"], "e": "Overfitting = validation che risale; underfitting = entrambe ancora in discesa alla fine; ideale = gap piccolo e discesa stabile."}, "en": {"q": "What does ideal training look like in the curves?", "o": ["Training loss at zero and validation rising", "Small gap between training and validation loss, both going down at the same rate without fluctuations", "Validation loss far below training loss", "Both flat from the start"], "e": "Overfitting = validation rising; underfitting = both still decreasing at the end; ideal = small gap and stable decrease."}}, {"id": 76, "ch": 8, "a": "B", "it": {"q": "Inizializzare tutti i pesi a zero:", "o": ["È la scelta migliore", "Impedisce il symmetry breaking", "Causa exploding gradient", "Satura la tanh"], "e": "Tutti i neuroni calcolano la stessa funzione e ricevono lo stesso gradiente: restano identici."}, "en": {"q": "Initializing all weights to zero:", "o": ["Is the best choice", "Prevents symmetry breaking", "Causes exploding gradients", "Saturates tanh"], "e": "All neurons compute the same function and get the same gradient: they stay identical."}}, {"id": 77, "ch": 8, "a": "A", "it": {"q": "Pesi gaussiani con std 0.01 in una rete tanh a 10 layer:", "o": ["Output che vanno a zero e vanishing gradient", "Output saturati a ±1", "Varianza costante", "Exploding gradient"], "e": "Con pesi minuscoli gli output si rimpiccioliscono layer dopo layer fino a zero, e con loro i gradienti dei pesi."}, "en": {"q": "Gaussian weights with std 0.01 in a 10-layer tanh network:", "o": ["Outputs go to zero and vanishing gradient", "Outputs saturated at ±1", "Constant variance", "Exploding gradient"], "e": "With tiny weights the outputs shrink layer after layer down to zero, and the weight gradients with them."}}, {"id": 78, "ch": 8, "a": "B", "it": {"q": "Pesi gaussiani con std 1 in una rete tanh profonda:", "o": ["Output a zero", "Output saturati a ±1 e vanishing gradient per saturazione", "Nessun problema", "Dead ReLU"], "e": "Con pesi grandi tanh satura a ±1, dove la sua derivata è circa 0."}, "en": {"q": "Gaussian weights with std 1 in a deep tanh network:", "o": ["Outputs at zero", "Outputs saturated at ±1 and vanishing gradient from saturation", "No problem", "Dead ReLU"], "e": "With big weights tanh saturates at ±1, where its derivative is about 0."}}, {"id": 79, "ch": 8, "a": "A", "it": {"q": "Nella Xavier initialization la varianza dei pesi è:", "o": ["1/n", "2/n", "n", "0.01"], "e": "`Var(w) = 1/n` mantiene la varianza dell'output uguale a quella dell'input. `2/n` è He, per ReLU."}, "en": {"q": "In Xavier initialization the variance of the weights is:", "o": ["1/n", "2/n", "n", "0.01"], "e": "`Var(w) = 1/n` keeps the output variance equal to the input variance. `2/n` is He, for ReLU."}}, {"id": 80, "ch": 8, "a": "B", "it": {"q": "Nella formula di Xavier, n è:", "o": ["Il numero di campioni del dataset", "Il numero di neuroni di input del layer", "Il numero di classi", "Il numero di layer"], "e": "per il primo layer n = D."}, "en": {"q": "In the Xavier formula, n is:", "o": ["The number of samples in the dataset", "The number of input neurons of the layer", "The number of classes", "The number of layers"], "e": "for the first layer n = D."}}, {"id": 81, "ch": 8, "a": "B", "it": {"q": "Con ReLU si usa:", "o": ["Xavier con Var = 1/n", "He (\"Xavier/2\") con Var = 2/n", "Tutti zeri", "std = 1"], "e": "ReLU azzera metà dei valori: si raddoppia la varianza, `Var(w) = 2/n`."}, "en": {"q": "With ReLU you use:", "o": ["Xavier with Var = 1/n", "He (\"Xavier/2\") with Var = 2/n", "All zeros", "std = 1"], "e": "ReLU zeroes half of the values: the variance is doubled, `Var(w) = 2/n`."}}, {"id": 194, "ch": 8, "a": "C", "it": {"q": "Inizializzazione He per un layer con n = 200 input. Qual è la deviazione standard dei pesi?", "o": ["0.005", "1", "0.1", "0.01"], "e": "He: Var = 2/n = 2/200 = 0.01 → std = √0.01 = 0.1."}, "en": {"q": "He initialization for a layer with n = 200 inputs. What is the standard deviation of the weights?", "o": ["0.005", "1", "0.1", "0.01"], "e": "He: Var = 2/n = 2/200 = 0.01 → std = √0.01 = 0.1."}}, {"id": 195, "ch": 8, "a": "D", "it": {"q": "Inizializzazione Xavier per un layer con n = 100 input. Qual è la deviazione standard dei pesi?", "o": ["0.01", "0.14", "1", "0.1"], "e": "Xavier: Var = 1/n = 0.01 → std = 0.1. Con He sarebbe √(2/100) ≈ 0.14."}, "en": {"q": "Xavier initialization for a layer with n = 100 inputs. What is the standard deviation of the weights?", "o": ["0.01", "0.14", "1", "0.1"], "e": "Xavier: Var = 1/n = 0.01 → std = 0.1. With He it would be √(2/100) ≈ 0.14."}}, {"id": 196, "ch": 8, "a": "A", "it": {"q": "Qual è l'obiettivo della Xavier initialization?", "o": ["Mantenere la varianza dell'output di un layer uguale a quella dell'input", "Rendere tutti i pesi uguali", "Eliminare i bias", "Massimizzare la loss iniziale"], "e": "Se la varianza resta costante tra i layer, le attivazioni non svaniscono né saturano."}, "en": {"q": "What is the goal of Xavier initialization?", "o": ["Keep a layer's output variance equal to its input variance", "Make all weights equal", "Remove the biases", "Maximize the initial loss"], "e": "If the variance stays constant across layers, activations neither vanish nor saturate."}}, {"id": 197, "ch": 8, "a": "B", "it": {"q": "Perché la Xavier initialization non basta con la ReLU?", "o": ["Perché la ReLU satura a ±1", "La ReLU azzera metà dei valori, quindi la varianza si dimezza a ogni layer e gli output tornano verso zero", "Perché la ReLU ha troppi parametri", "Perché la ReLU non è differenziabile"], "e": "\"ReLU kills half of the data\": serve raddoppiare la varianza dei pesi → He (Xavier/2), Var = 2/n."}, "en": {"q": "Why is Xavier initialization not enough with ReLU?", "o": ["Because ReLU saturates at ±1", "ReLU zeroes half of the values, so the variance halves at every layer and outputs drift back to zero", "Because ReLU has too many parameters", "Because ReLU is not differentiable"], "e": "\"ReLU kills half of the data\": you need to double the weight variance → He (Xavier/2), Var = 2/n."}}, {"id": 198, "ch": 8, "a": "C", "it": {"q": "Le slide indicano due strade per risolvere il vanishing gradient dovuto all'inizializzazione. Quali?", "o": ["Usare solo la sigmoid", "Togliere le attivazioni e usare la L1", "Lavorare sull'inizializzazione e lavorare sull'output generato da ogni layer", "Aumentare il batch size e il learning rate"], "e": "La prima porta a Xavier/He; la seconda alla batch normalization, che normalizza le attivazioni di ogni layer."}, "en": {"q": "The slides give two ways to fix the vanishing gradient caused by initialization. Which?", "o": ["Using only sigmoid", "Removing activations and using L1", "Working on the initialization and working on the output generated by each layer", "Increasing batch size and learning rate"], "e": "The first leads to Xavier/He; the second to batch normalization, which normalizes each layer's activations."}}, {"id": 199, "ch": 8, "a": "D", "it": {"q": "Con pesi piccoli (std 0.01), perché i gradienti dei pesi dei layer profondi diventano piccoli?", "o": ["Perché i bias sono zero", "Perché la tanh satura a ±1", "Perché il learning rate è troppo alto", "Gli output del layer l sono piccoli, e il gradiente rispetto ai pesi del layer l+1 è proporzionale a quegli output"], "e": "Anche se la derivata della tanh è buona vicino a 0, input piccoli danno gradienti piccoli rispetto ai pesi: vanishing gradient causato da output piccoli."}, "en": {"q": "With small weights (std 0.01), why do the weight gradients of deep layers become small?", "o": ["Because biases are zero", "Because tanh saturates at ±1", "Because the learning rate is too high", "Layer l's outputs are small, and the gradient w.r.t. layer l+1's weights is proportional to those outputs"], "e": "Even though tanh's derivative is fine near 0, small inputs give small gradients w.r.t. the weights: vanishing gradient caused by small outputs."}}, {"id": 200, "ch": 8, "a": "A", "it": {"q": "Quale affermazione sull'inizializzazione è corretta secondo le slide?", "o": ["È estremamente importante e non garantisce di raggiungere l'ottimo", "Garantisce sempre l'ottimo globale", "Serve solo per le reti lineari", "È irrilevante se si usa Adam"], "e": "Il punto di partenza determina dove l'ottimizzazione (non convessa) può arrivare."}, "en": {"q": "Which statement about initialization is correct according to the slides?", "o": ["It is extremely important and does not guarantee reaching the optimum", "It always guarantees the global optimum", "It only matters for linear networks", "It is irrelevant if you use Adam"], "e": "The starting point determines where the (non-convex) optimization can end up."}}, {"id": 82, "ch": 9, "a": "B", "it": {"q": "La data augmentation serve principalmente a:", "o": ["Velocizzare l'inferenza", "Ridurre l'overfitting", "Ridurre i parametri", "Eliminare il bias del dataset"], "e": "Copie leggermente modificate dei dati rendono il modello invariante alle trasformazioni e riducono l'overfitting."}, "en": {"q": "Data augmentation is mainly used to:", "o": ["Speed up inference", "Reduce overfitting", "Reduce the parameters", "Remove dataset bias"], "e": "Slightly modified copies of the data make the model invariant to transformations and reduce overfitting."}}, {"id": 83, "ch": 9, "a": "B", "it": {"q": "Se il dataset originale contiene bias, i dati aumentati:", "o": ["Sono privi di bias", "Contengono gli stessi bias", "Hanno bias opposti", "Non sono utilizzabili"], "e": "L'augmentation trasforma i dati esistenti: i bias del dataset di partenza si ereditano."}, "en": {"q": "If the original dataset contains biases, the augmented data:", "o": ["Are bias-free", "Contain the same biases", "Have opposite biases", "Cannot be used"], "e": "Augmentation transforms existing data: the biases of the original dataset are inherited."}}, {"id": 84, "ch": 9, "a": "B", "it": {"q": "Nel test con crop fissi (stile ImageNet) si usano:", "o": ["5 crop", "10 crop = (4 angoli + centro) × 2 flip", "224 crop", "Crop casuali"], "e": "A test time i crop sono fissi: 4 angoli + centro, ognuno anche specchiato = 10. I crop casuali si usano in training."}, "en": {"q": "In testing with fixed crops (ImageNet style) you use:", "o": ["5 crops", "10 crops = (4 corners + center) × 2 flips", "224 crops", "Random crops"], "e": "At test time crops are fixed: 4 corners + center, each also flipped = 10. Random crops are used in training."}}, {"id": 85, "ch": 9, "a": "B", "it": {"q": "Il weight decay:", "o": ["Premia i pesi grandi", "Penalizza i pesi grandi (L2)", "Riduce il learning rate nel tempo", "Spegne neuroni"], "e": "Ridurre il learning rate nel tempo è il learning rate decay: nomi simili, cose diverse."}, "en": {"q": "Weight decay:", "o": ["Rewards large weights", "Penalizes large weights (L2)", "Reduces the learning rate over time", "Turns neurons off"], "e": "Reducing the learning rate over time is learning rate decay: similar names, different things."}}, {"id": 86, "ch": 9, "a": "B", "it": {"q": "L'early stopping consiste nel:", "o": ["Fermarsi quando la training loss arriva a zero", "Fermarsi quando la validation loss inizia a peggiorare", "Fermarsi dopo un'epoca", "Ridurre il batch size"], "e": "Ci si ferma quando la validation loss inizia a risalire: è una forma semplice di regolarizzazione."}, "en": {"q": "Early stopping consists of:", "o": ["Stopping when the training loss reaches zero", "Stopping when the validation loss starts getting worse", "Stopping after one epoch", "Reducing the batch size"], "e": "You stop when the validation loss starts going up: an easy form of regularization."}}, {"id": 87, "ch": 9, "a": "B", "it": {"q": "In un ensemble, l'errore combinato diminuisce con la dimensione dell'ensemble se gli errori dei modelli sono:", "o": ["Identici", "Non correlati", "Perfettamente correlati", "Nulli"], "e": "Se i modelli sbagliano in modo indipendente, facendo la media gli errori si compensano."}, "en": {"q": "In an ensemble, the combined error decreases with the ensemble size if the models' errors are:", "o": ["Identical", "Uncorrelated", "Perfectly correlated", "Zero"], "e": "If the models make independent errors, averaging makes the errors cancel out."}}, {"id": 88, "ch": 9, "a": "B", "it": {"q": "Il dropout in training:", "o": ["Azzera pesi a caso in modo permanente", "Disattiva un insieme casuale di neuroni (tipicamente 50%)", "Rimuove layer", "Riduce il learning rate"], "e": "A ogni passo si spegne a caso un sottoinsieme di neuroni (tipicamente il 50%), diverso ogni volta."}, "en": {"q": "Dropout during training:", "o": ["Permanently zeroes random weights", "Disables a random set of neurons (typically 50%)", "Removes layers", "Reduces the learning rate"], "e": "At each step a random subset of neurons (typically 50%) is turned off, different every time."}}, {"id": 89, "ch": 9, "a": "B", "it": {"q": "A test time, con dropout:", "o": ["Si spengono il 50% dei neuroni", "Tutti i neuroni sono attivi e si applica il weight scaling", "Si riaddestra la rete", "Si usa solo metà rete"], "e": "Tutti i neuroni accesi; gli output si riscalano con la probabilità `p` (weight scaling inference rule)."}, "en": {"q": "At test time, with dropout:", "o": ["50% of neurons are turned off", "All neurons are active and weight scaling is applied", "The network is retrained", "Only half the network is used"], "e": "All neurons on; outputs are rescaled by the probability `p` (weight scaling inference rule)."}}, {"id": 90, "ch": 9, "a": "B", "it": {"q": "Il dropout può essere visto come:", "o": ["Un metodo del secondo ordine", "Un bagging efficiente con parametri condivisi", "Una data augmentation", "Un'inizializzazione"], "e": "Ogni minibatch addestra una sotto-rete diversa, ma tutte condividono gli stessi pesi."}, "en": {"q": "Dropout can be seen as:", "o": ["A second-order method", "An efficient bagging method with parameter sharing", "A data augmentation", "An initialization"], "e": "Each minibatch trains a different sub-network, but they all share the same weights."}}, {"id": 91, "ch": 9, "a": "B", "it": {"q": "Un effetto collaterale del dropout:", "o": ["Aumenta la capacità effettiva", "Riduce la capacità effettiva → modelli più grandi e più tempo di training", "Elimina la validation", "Rende la rete lineare"], "e": "Usando metà rete alla volta la capacità effettiva cala: servono modelli più grandi e più tempo di training."}, "en": {"q": "A side effect of dropout:", "o": ["It increases effective capacity", "It reduces effective capacity → larger models and more training time", "It removes the need for validation", "It makes the network linear"], "e": "Using half the network at a time lowers effective capacity: larger models and more training time are needed."}}, {"id": 92, "ch": 9, "a": "B", "it": {"q": "Un \"common mistake\" legato al dropout è:", "o": ["Usare un batch troppo grande", "Dimenticare di passare tra train mode ed eval mode", "Usare Adam", "Usare ReLU"], "e": "Il dropout si comporta in modo diverso in training e in test: bisogna impostare la modalità giusta."}, "en": {"q": "A \"common mistake\" related to dropout is:", "o": ["Using too large a batch", "Forgetting to toggle between train mode and eval mode", "Using Adam", "Using ReLU"], "e": "Dropout behaves differently in training and at test time: the right mode must be set."}}, {"id": 201, "ch": 9, "a": "B", "it": {"q": "Nel random crop usato in training su ImageNet (Krizhevsky et al.):", "o": ["Si usano sempre gli stessi 10 crop", "Si sceglie L a caso in [256, 480], si ridimensiona l'immagine con lato corto L e si estrae un crop casuale 224×224", "Si ruota l'immagine di 90°", "Si ritaglia sempre il centro 32×32"], "e": "In training i crop sono casuali; in test si usano crop fissi (4 angoli + centro, × 2 flip) a più scale."}, "en": {"q": "In the random crop used in ImageNet training (Krizhevsky et al.):", "o": ["Always use the same 10 crops", "Pick a random L in [256, 480], resize so the short side is L, take a random 224×224 crop", "Rotate the image by 90°", "Always crop the central 32×32"], "e": "In training crops are random; at test time fixed crops (4 corners + center, × 2 flips) at several scales are used."}}, {"id": 202, "ch": 9, "a": "C", "it": {"q": "Quando si confrontano due reti, cosa dicono le slide sulla data augmentation?", "o": ["Si applica solo al test set", "Si usa solo sulla rete più piccola", "Va usata la stessa augmentation per entrambe: è parte del design della rete", "Non conta ai fini del confronto"], "e": "Augmentation diverse renderebbero il confronto non equo."}, "en": {"q": "When comparing two networks, what do the slides say about data augmentation?", "o": ["Apply it only to the test set", "Use it only on the smaller network", "Use the same augmentation for both: it is part of the network design", "It does not matter for the comparison"], "e": "Different augmentations would make the comparison unfair."}}, {"id": 203, "ch": 9, "a": "D", "it": {"q": "Perché la data augmentation è molto usata nell'imaging medico?", "o": ["Perché i modelli medici non vanno in overfitting", "Perché le immagini mediche sono sempre a colori", "Perché non servono label", "Dataset piccoli, condivisione dei dati limitata dalla privacy, pochi pazienti per le malattie rare"], "e": "Sono le tre ragioni elencate nelle slide."}, "en": {"q": "Why is data augmentation widely used in medical imaging?", "o": ["Because medical models never overfit", "Because medical images are always in color", "Because no labels are needed", "Small datasets, data sharing limited by privacy, few patients for rare diseases"], "e": "These are the three reasons listed in the slides."}}, {"id": 204, "ch": 9, "a": "A", "it": {"q": "Quali strategie avanzate di data augmentation citano le slide?", "o": ["Generative AI (GAN, autoencoder, diffusion model) e reinforcement learning", "Solo flip orizzontali", "Dropout e weight decay", "Grid search e random search"], "e": "Oltre a trasformazioni semplici (flip, crop, luminosità) si possono generare dati sintetici con modelli generativi."}, "en": {"q": "Which advanced data augmentation strategies do the slides mention?", "o": ["Generative AI (GANs, autoencoders, diffusion models) and reinforcement learning", "Only horizontal flips", "Dropout and weight decay", "Grid search and random search"], "e": "Beyond simple transforms (flip, crop, brightness) synthetic data can be generated with generative models."}}, {"id": 205, "ch": 9, "a": "B", "it": {"q": "Qual è l'update del gradient descent con weight decay (L2)?", "o": ["θ ← θ − α∇L / λ", "θ ← θ − α∇L − αλθ", "θ ← λθ", "θ ← θ − α∇L + αλθ"], "e": "Il gradiente del termine L2 (λ/2)‖θ‖² è λθ: a ogni passo i pesi vengono anche \"tirati\" verso zero."}, "en": {"q": "What is the gradient descent update with weight decay (L2)?", "o": ["θ ← θ − α∇L / λ", "θ ← θ − α∇L − αλθ", "θ ← λθ", "θ ← θ − α∇L + αλθ"], "e": "The gradient of the L2 term (λ/2)‖θ‖² is λθ: at every step the weights are also \"pulled\" towards zero."}}, {"id": 206, "ch": 9, "a": "C", "it": {"q": "Nell'intuizione del dropout (furry, two eyes, tail, paws…), cosa impara la rete?", "o": ["A ignorare tutte le feature", "A usare una sola feature molto forte", "Rappresentazioni ridondanti: basa lo score su più feature, perché nessuna è sempre disponibile", "A memorizzare il training set"], "e": "Spegnendo neuroni a caso, la rete non può affidarsi a una sola feature: si riduce la co-adaptation tra neuroni."}, "en": {"q": "In the dropout intuition (furry, two eyes, tail, paws…), what does the network learn?", "o": ["To ignore all features", "To use one very strong feature", "Redundant representations: it bases the score on more features, since none is always available", "To memorize the training set"], "e": "By switching neurons off at random, the network cannot rely on a single feature: co-adaptation between neurons is reduced."}}, {"id": 207, "ch": 9, "a": "D", "it": {"q": "Dropout con probabilità p di tenere un neurone. Cosa si fa a test time?", "o": ["Si moltiplicano gli output per 1/p e si spegne metà rete", "Si disattiva l'ultimo layer", "Si spegne il 50% dei neuroni", "Tutti i neuroni restano accesi e gli output si moltiplicano per p"], "e": "In training ogni neurone è attivo con probabilità p; a test time, con tutti accesi, si scala per p così il valore atteso coincide (weight scaling inference rule)."}, "en": {"q": "Dropout with probability p of keeping a neuron. What is done at test time?", "o": ["Outputs are multiplied by 1/p and half the network is off", "The last layer is disabled", "50% of the neurons are switched off", "All neurons stay on and outputs are multiplied by p"], "e": "In training each neuron is active with probability p; at test time, with all on, you scale by p so the expected value matches (weight scaling inference rule)."}}, {"id": 208, "ch": 9, "a": "A", "it": {"q": "Il bagging consiste nel:", "o": ["Addestrare k modelli su k dataset diversi e fare la media delle loro predizioni", "Normalizzare il minibatch", "Spegnere neuroni a caso", "Fermare il training in anticipo"], "e": "È un metodo ensemble; il dropout ne è una versione efficiente con parametri condivisi."}, "en": {"q": "Bagging consists of:", "o": ["Training k models on k different datasets and averaging their predictions", "Normalizing the minibatch", "Switching neurons off at random", "Stopping training early"], "e": "It is an ensemble method; dropout is an efficient version of it with shared parameters."}}, {"id": 209, "ch": 9, "a": "B", "it": {"q": "Una CNN ben addestrata con data augmentation è robusta a variazioni di:", "o": ["Dimensione del batch", "Traslazione, punto di vista, dimensione e illuminazione", "Numero di classi", "Learning rate"], "e": "Il classificatore deve essere invariante a molte trasformazioni (pose, appearance, illumination); l'augmentation simula trasformazioni plausibili."}, "en": {"q": "A CNN well trained with data augmentation is robust to changes in:", "o": ["Batch size", "Translation, viewpoint, size and illumination", "Number of classes", "Learning rate"], "e": "The classifier must be invariant to many transformations (pose, appearance, illumination); augmentation simulates plausible ones."}}, {"id": 210, "ch": 9, "a": "C", "it": {"q": "Quale di questi è un beneficio della data augmentation elencato nelle slide?", "o": ["Rende inutile il validation set", "Riduce il numero di parametri", "Aiuta a risolvere problemi di class imbalance", "Elimina i bias del dataset originale"], "e": "Altri benefici: più dati, meno overfitting, migliore generalizzazione, meno costi di raccolta ed etichettatura. I bias del dataset invece si ereditano."}, "en": {"q": "Which of these is a benefit of data augmentation listed in the slides?", "o": ["It makes the validation set unnecessary", "It reduces the number of parameters", "It helps resolve class imbalance issues", "It removes the original dataset's biases"], "e": "Other benefits: more data, less overfitting, better generalization, lower collection and labeling costs. Dataset biases are inherited instead."}}, {"id": 93, "ch": 10, "a": "B", "it": {"q": "L'internal covariate shift è:", "o": ["Il cambiamento della distribuzione dei dati tra train e test", "Il cambiamento della distribuzione degli input di un layer durante il training, perché cambiano i parametri dei layer precedenti", "La variazione del learning rate nel tempo", "La correlazione tra le feature di input"], "e": "Non riguarda la differenza tra train e test, ma il cambiamento degli input dei layer durante il training."}, "en": {"q": "Internal covariate shift is:", "o": ["The change in data distribution between train and test", "The change in the distribution of a layer's inputs during training, because the parameters of the preceding layers change", "The change of the learning rate over time", "The correlation between input features"], "e": "It is not about the train/test difference, but about the change of layer inputs during training."}}, {"id": 94, "ch": 10, "a": "B", "it": {"q": "In batch normalization, ogni feature viene normalizzata usando:", "o": ["Media e varianza dell'intero dataset", "Media e varianza del minibatch per quella feature", "Media e varianza della singola immagine", "Il valore massimo della feature"], "e": "per ogni feature k, sugli N esempi del minibatch."}, "en": {"q": "In batch normalization, each feature is normalized using:", "o": ["Mean and variance of the whole dataset", "Mean and variance of the minibatch for that feature", "Mean and variance of the single image", "The maximum value of the feature"], "e": "for each feature k, over the N examples of the minibatch."}}, {"id": 95, "ch": 10, "a": "C", "it": {"q": "Dopo la normalizzazione BN calcola `y = γx̂ + β`. Cosa sono γ e β?", "o": ["Costanti fissate a 1 e 0", "Iperparametri scelti a mano", "Parametri appresi con la backprop, che permettono alla rete di cambiare il range (anche di annullare la normalizzazione)", "Media e varianza del minibatch"], "e": "con `γ = √Var` e `β = E` la rete può persino annullare la normalizzazione."}, "en": {"q": "After normalizing, BN computes `y = γx̂ + β`. What are γ and β?", "o": ["Constants fixed at 1 and 0", "Hyperparameters set by hand", "Parameters learned with backprop, letting the network change the range (even undo the normalization)", "Mean and variance of the minibatch"], "e": "with `γ = √Var` and `β = E` the network can even undo the normalization."}}, {"id": 96, "ch": 10, "a": "B", "it": {"q": "Dove si inserisce tipicamente un layer BN?", "o": ["Prima del layer fully connected", "Dopo il layer FC o convolutional e prima della non-linearità", "Dopo la loss", "Solo nell'output layer"], "e": "FC → BN → tanh."}, "en": {"q": "Where is a BN layer typically placed?", "o": ["Before the fully connected layer", "After the FC or convolutional layer and before the non-linearity", "After the loss", "Only in the output layer"], "e": "FC → BN → tanh."}}, {"id": 97, "ch": 10, "a": "B", "it": {"q": "A test time la batch normalization usa:", "o": ["Media e varianza della singola immagine", "Media e varianza ottenute con una media mobile esponenziale durante il training", "Media 0 e varianza 1 fisse", "Nessuna normalizzazione"], "e": "`μ_running` e `Var_running` con momentum `β_m`; una singola immagine non dà una media sensata."}, "en": {"q": "At test time batch normalization uses:", "o": ["Mean and variance of the single image", "Mean and variance from an exponentially weighted running average computed during training", "Fixed mean 0 and variance 1", "No normalization"], "e": "`μ_running` and `Var_running` with momentum `β_m`; a single image gives no meaningful mean."}}, {"id": 98, "ch": 10, "a": "A", "it": {"q": "Perché i bias dei layer che precedono BN si possono mettere a zero?", "o": ["Perché BN sottrae la media e li cancella comunque", "Perché causano dead ReLU", "Perché BN raddoppia i parametri", "Perché lo richiede l'inizializzazione He"], "e": "un bias costante sparisce quando si sottrae la media."}, "en": {"q": "Why can the biases of the layers before BN be set to zero?", "o": ["Because BN subtracts the mean and cancels them anyway", "Because they cause dead ReLUs", "Because BN doubles the parameters", "Because He initialization requires it"], "e": "a constant bias disappears when the mean is subtracted."}}, {"id": 99, "ch": 10, "a": "B", "it": {"q": "Il principale svantaggio della batch normalization è che:", "o": ["Rallenta la convergenza", "Funziona male con batch size piccoli", "Non è differenziabile", "Restringe il range di iperparametri utilizzabili"], "e": "con batch da 32 a 2 il validation error sale da ~24% a ~35%."}, "en": {"q": "The main drawback of batch normalization is that it:", "o": ["Slows down convergence", "Works poorly with small batch sizes", "Is not differentiable", "Narrows the usable range of hyperparameters"], "e": "with batches from 32 down to 2 the validation error rises from ~24% to ~35%."}}, {"id": 100, "ch": 10, "a": "B", "it": {"q": "Secondo Wu & He, quale normalizzazione resta stabile al variare del batch size?", "o": ["Batch Norm", "Group Norm", "Dropout", "Weight decay"], "e": "Group Norm resta intorno al 24% a ogni batch size."}, "en": {"q": "According to Wu & He, which normalization stays stable as the batch size changes?", "o": ["Batch Norm", "Group Norm", "Dropout", "Weight decay"], "e": "Group Norm stays around 24% at every batch size."}}, {"id": 101, "ch": 10, "a": "C", "it": {"q": "Instance Norm normalizza:", "o": ["Su N, H, W per ogni canale", "Su C, H, W per ogni campione", "Su H, W per ogni campione e canale", "Su tutto il batch"], "e": "Batch Norm normalizza su N, H, W per canale; Layer Norm su C, H, W per campione."}, "en": {"q": "Instance Norm normalizes:", "o": ["Over N, H, W per channel", "Over C, H, W per sample", "Over H, W per sample and channel", "Over the whole batch"], "e": "Batch Norm normalizes over N, H, W per channel; Layer Norm over C, H, W per sample."}}, {"id": 102, "ch": 10, "a": "B", "it": {"q": "MNIST-1D: 4000 esempi di training, batch size 100, 6000 step. Quante epoche sono?", "o": ["60", "150", "6000", "40"], "e": "4000 / 100 = 40 step per epoca; 6000 / 40 = 150."}, "en": {"q": "MNIST-1D: 4000 training examples, batch size 100, 6000 steps. How many epochs is that?", "o": ["60", "150", "6000", "40"], "e": "4000 / 100 = 40 steps per epoch; 6000 / 40 = 150."}}, {"id": 103, "ch": 10, "a": "B", "it": {"q": "Nell'esperimento MNIST-1D la training loss va a zero, mentre la test loss scende e poi risale. Perché?", "o": ["Il learning rate è troppo basso", "Il modello diventa sempre più sicuro delle sue predizioni sbagliate", "I dati di test sono rumorosi", "Manca la batch normalization"], "e": "il modello non generalizza: il test error resta intorno al 40%."}, "en": {"q": "In the MNIST-1D experiment the training loss goes to zero, while the test loss decreases and then increases. Why?", "o": ["The learning rate is too low", "The model becomes increasingly confident about its wrong predictions", "The test data are noisy", "Batch normalization is missing"], "e": "the model does not generalize: the test error stays around 40%."}}, {"id": 104, "ch": 10, "a": "B", "it": {"q": "Il double descent è il fenomeno per cui:", "o": ["Il training error scende due volte", "Il test error scende, risale vicino al punto in cui il modello memorizza esattamente i dati, poi riscende", "La loss ha due minimi globali", "Il learning rate decade in due step"], "e": "si vede con il 15% di label noise."}, "en": {"q": "Double descent is the phenomenon where:", "o": ["Training error decreases twice", "Test error decreases, rises near the point where the model exactly memorizes the data, then decreases again", "The loss has two global minima", "The learning rate decays in two steps"], "e": "it shows up with 15% label noise."}}, {"id": 105, "ch": 10, "a": "B", "it": {"q": "La regione in cui il numero di parametri è circa uguale al numero di esempi di training si chiama:", "o": ["Classical regime", "Critical regime", "Modern regime", "Under-fitting regime"], "e": "prima c'è il classical (under-parameterized), dopo il modern (over-parameterized)."}, "en": {"q": "The region where the number of parameters roughly equals the number of training examples is called:", "o": ["Classical regime", "Critical regime", "Modern regime", "Under-fitting regime"], "e": "before it comes the classical (under-parameterized) regime, after it the modern (over-parameterized) one."}}, {"id": 106, "ch": 10, "a": "A", "it": {"q": "Dati a 40 dimensioni, 10 bin per dimensione, 10.000 punti. Quanti punti per bin, circa?", "o": ["1 punto ogni 10³⁵ bin", "250 punti per bin", "1 punto ogni 400 bin", "10⁴ punti per bin"], "e": "10⁴⁰ bin / 10⁴ punti = 1 punto ogni 10³⁵ bin."}, "en": {"q": "40-dimensional data, 10 bins per dimension, 10,000 points. Roughly how many points per bin?", "o": ["1 point per 10³⁵ bins", "250 points per bin", "1 point per 400 bins", "10⁴ points per bin"], "e": "10⁴⁰ bins / 10⁴ points = 1 point per 10³⁵ bins."}}, {"id": 107, "ch": 10, "a": "C", "it": {"q": "Quale NON è una proprietà dello spazio ad alta dimensione citata nelle slide?", "o": ["Due punti casuali da una normale sono quasi ortogonali", "La distanza dall'origine dei campioni è circa costante", "Quasi tutto il volume di un'arancia sta nella polpa, vicino al centro", "Il rapporto tra distanza del punto più vicino e del più lontano tende a 1"], "e": "è il contrario: il volume sta nella buccia."}, "en": {"q": "Which is NOT a property of high-dimensional space mentioned in the slides?", "o": ["Two random points from a normal distribution are nearly orthogonal", "The distance of samples from the origin is roughly constant", "Most of the volume of an orange is in the pulp, near the center", "The ratio of nearest to farthest distance tends to 1"], "e": "it is the opposite: the volume is in the peel."}}, {"id": 108, "ch": 10, "a": "B", "it": {"q": "Il procedimento corretto per scegliere gli iperparametri è:", "o": ["Addestrare sul training e scegliere sul test", "Addestrare sul training, scegliere sul validation, testare una sola volta sul test", "Usare il test set più volte per confrontare i modelli", "Scegliere sempre la capacità massima"], "e": "il test set si usa una volta sola, alla fine."}, "en": {"q": "The correct procedure for choosing hyperparameters is:", "o": ["Train on training, choose on test", "Train on training, choose on validation, test once on test", "Use the test set several times to compare models", "Always choose the maximum capacity"], "e": "the test set is used only once, at the very end."}}, {"id": 109, "ch": 10, "a": "A", "it": {"q": "Perché non basta aggiungere più layer per migliorare una rete?", "o": ["L'ottimizzazione diventa difficile e le prestazioni si stabilizzano o calano", "Più layer riducono il numero di parametri", "La GPU non supporta più di 10 layer", "La batch normalization lo impedisce"], "e": "nessuna struttura, solo forza bruta."}   const P = S.perm[S.idx];
  const opts = P.map((oi, j) => { const l = LET[oi]; let cls = '';
    if (locked) cls = l === q.a ? 'right' : l === a ? 'wrong' : ''; else if (a === l) cls = 'sel';
    return `<button type="button" class="opt ${cls}" data-l="${l}" ${locked ? 'disabled' : ''}><span class="bubble">${LET[j]}</span><span>${fmt(c.o[oi])}</span></button>`; }).join('');
  const sheet = S.items.map((it, i) => { const x = S.ans[i]; let cls = x === null ? '' : sim ? 'done' : x === it.a ? 'ok' : 'ko';
    return `<button type="button" class="${cls} ${i === S.idx ? 'cur' : ''}" data-go="${i}" aria-label="${T.q} ${i + 1}">${i + 1}</button>`; }).join('');
  const un = S.ans.filter(x => x === null).length;
  $('view-quiz').innerHTML = `
    <div class="qhead"><span class="label">${T.q} <span class="num">${S.idx + 1}</span> ${T.of} <span class="num">${S.items.length}</span> · ${q.ch}. ${esc(D.chapters[q.ch - 1][store.lang])}</span>
      <span class="row">${S.left !== null ? `<span class="timer num ${S.left <= 60 ? 'low' : ''}" id="timer">${clock(Math.max(S.left, 0))}</span>` : ''}<button type="button" class="btn link" id="quit">${T.quit}</button></span></div>
    <div class="qtext">${fmt(c.q)}</div>
    <div class="opts">${opts}</div>
    ${locked ? `<div class="explain ${a === q.a ? 'ok' : 'ko'}"><b>${a === q.a ? T.right : T.wrong(dl(S.idx, q.a))}</b> ${fmt(c.e)}</div>` : ''}
    ${S.confirm ? `<div class="confirm"><span>${T.unans(un)}</span><span class="row"><button type="button" class="btn" id="deliver">${T.deliver}</button><button type="button" class="btn" id="stay">${T.back}</button></span></div>` : ''}
    <div class="nav"><button type="button" class="btn" id="prev" ${S.idx === 0 ? 'disabled' : ''}>${T.prev}</button>
      ${sim ? `<span class="row">${last ? '' : `<button type="button" class="btn" id="next">${T.next}</button>`}<button type="button" class="btn primary" id="finish">${T.finish}</button></span>`
            : `<button type="button" class="btn primary" id="${last ? 'finish' : 'next'}" ${locked ? '' : 'disabled'}>${last ? T.end : T.next}</button>`}</div>
    <div class="sheet">${sheet}</div>
    <div class="muted" style="font-size:.8rem">${T.keys}</div>`;
}
function answer(l) {
  const q = S.items[S.idx], sim = S.mode === 'sim';
  if (!sim && S.ans[S.idx] !== null) return;
  S.ans[S.idx] = l; S.confirm = false;
  if (!sim) record(q, l === q.a);
  renderQuiz();
}
function go(i) { if (i < 0 || i >= S.items.length) return; S.idx = i; S.confirm = false; renderQuiz(); }
function tryFinish() { const un = S.ans.filter(x => x === null).length; if (S.mode === 'sim' && un && !S.confirm) { S.confirm = true; renderQuiz(); } else finish(); }
function finish() {
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  S.secs = Math.round((Date.now() - S.t0) / 1000);
  if (S.mode === 'sim') { S.items.forEach((q, i) => record(q, S.ans[i] === q.a));
    store.history.push({ d: Date.now(), s: S.items.filter((q, i) => S.ans[i] === q.a).length, n: S.items.length }); store.history = store.history.slice(-30); save(); }
  onlyWrong = false; show('results'); renderResults();
}
function renderResults() {
  const T = t(), n = S.items.length, okN = S.items.filter((q, i) => S.ans[i] === q.a).length, pct = n ? okN / n : 0;
  const chs = [...new Set(S.items.map(q => q.ch))].sort((a, b) => a - b).map(ch => { const idx = S.items.map((q, i) => i).filter(i => S.items[i].ch === ch), ok = idx.filter(i => S.ans[i] === S.items[i].a).length;
    return `<div class="chrow"><span>${ch}. ${esc(D.chapters[ch - 1][store.lang])}</span><span class="num muted">${ok}/${idx.length}</span><div class="bar"><i class="ok" style="width:${ok / idx.length * 100}%"></i><i class="ko" style="width:${(idx.length - ok) / idx.length * 100}%"></i></div></div>`; }).join('');
  const rev = S.items.map((q, i) => { const c = q[store.lang], a = S.ans[i], ok = a === q.a; if (onlyWrong && ok) return '';
    return `<div class="ritem"><div><span class="tag ${ok ? 'ok' : 'ko'}">${ok ? T.ok : T.ko}</span> <span class="label">${i + 1} · ${esc(D.chapters[q.ch - 1][store.lang])}</span></div>
      <div class="q">${fmt(c.q)}</div>
      ${ok ? '' : `<div class="a muted">${T.yours}: ${a ? `${dl(i, a)}) ${fmt(c.o[LET.indexOf(a)])}` : T.noAns}</div>`}
      <div class="a"><strong>${T.corr}: ${dl(i, q.a)})</strong> ${fmt(c.o[LET.indexOf(q.a)])}</div>
      ${c.e ? `<div class="a muted">${fmt(c.e)}</div>` : ''}</div>`; }).join('');
  $('view-results').innerHTML = `<div class="wrap" style="gap:20px">
    <section class="panel"><span class="label">${T.result}${S.timeout ? ' · ' + T.timeout : ''}</span>
      <div class="score"><div class="big num">${okN}<small>/${n} ${T.correct}</small></div>
        <div class="stat"><span class="label">${T.pct}</span><b class="num">${Math.round(pct * 100)}%</b></div>
        <div class="stat"><span class="label">${T.grade}</span><b class="num">${Math.round(pct * 30)}/30</b></div>
        <div class="stat"><span class="label">${T.time}</span><b class="num">${clock(S.secs)}</b></div></div>
      <div class="row"><button type="button" class="btn primary" id="again">${T.again}</button>
        <button type="button" class="btn" id="retry" ${okN === n ? 'disabled' : ''}>${T.retry}</button></div></section>
    <section class="panel"><h2>${T.byCh}</h2><div class="chlist">${chs}</div></section>
    <section class="panel"><div class="row" style="justify-content:space-between"><h2>${T.review}</h2>
      <label class="check" for="only-wrong"><input type="checkbox" id="only-wrong" ${onlyWrong ? 'checked' : ''}>${T.onlyWrong}</label></div>
      <div class="review">${rev}</div></section></div>`;
}
function rerender() { renderHome(); if (S && !$('view-quiz').hidden) renderQuiz(); if (S && !$('view-results').hidden) renderResults(); }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'lang-it' || b.id === 'lang-en') { store.lang = b.id.slice(5); save(); rerender(); }
  else if (b.dataset.mode) { setup.mode = b.dataset.mode; renderHome(); }
  else if (b.dataset.ch) { const all = D.chapters.map((_, i) => i + 1), c = b.dataset.ch;
    if (c === 'all') setup.chapters = new Set(all);
    else { const n = +c; if (setup.chapters.size === all.length) setup.chapters = new Set([n]); else if (setup.chapters.has(n)) { setup.chapters.delete(n); if (!setup.chapters.size) setup.chapters = new Set(all); } else setup.chapters.add(n); }
    renderHome(); }
  else if (b.id === 'start') begin();
  else if (b.id === 'reset') { confirmReset = true; renderHome(); }
  else if (b.id === 'reset-no') { confirmReset = false; renderHome(); }
  else if (b.id === 'reset-yes') { store.stats = {}; store.history = []; save(); confirmReset = false; renderHome(); }
  else if (b.dataset.l) answer(b.dataset.l);
  else if (b.dataset.go) go(+b.dataset.go);
  else if (b.id === 'prev') go(S.idx - 1);
  else if (b.id === 'next') go(S.idx + 1);
  else if (b.id === 'finish') tryFinish();
  else if (b.id === 'deliver') finish();
  else if (b.id === 'stay') { S.confirm = false; renderQuiz(); }
  else if (b.id === 'quit' || b.id === 'again') { if (S && S.timer) clearInterval(S.timer); S = null; show('home'); renderHome(); }
  else if (b.id === 'retry') { const w = S.items.filter((q, i) => S.ans[i] !== q.a); startSession(shuffle(w), 'prac', false); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'count') { setup.count = +e.target.value; }
  else if (e.target.id === 'timed') setup.timed = e.target.checked;
  else if (e.target.id === 'only-wrong') { onlyWrong = e.target.checked; renderResults(); }
});
document.addEventListener('keydown', e => {
  if (!S || $('view-quiz').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), i = 'abcd'.indexOf(k) >= 0 && k.length === 1 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (k.length === 1 && i >= 0) { answer(LET[S.perm[S.idx][i]]); e.preventDefault(); }
  else if (k === 'enter' || k === 'arrowright') { const sim = S.mode === 'sim', last = S.idx === S.items.length - 1;
    if (!sim && S.ans[S.idx] === null) return; e.preventDefault(); if (last) { if (k === 'enter') tryFinish(); } else go(S.idx + 1); }
  else if (k === 'arrowleft') go(S.idx - 1);
});
renderHome();
</script>
